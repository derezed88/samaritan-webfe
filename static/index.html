<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAMARITAN</title>
  <style>
    /* ─── Google Fonts fallback (closest free mono to FF Magda Clean Mono) ─── */
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nova+Mono&display=swap');

    /* ─── Reset & base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #ffffff;
      --bg-edge:    #b0b0b0;
      --bg-mid:     #d8d8d8;
      --text:       #000000;
      --red:        #fe2d2d;
      --red-dark:   #330000;
      --red-mid:    #cc0000;
      --bar:        #000000;
      --bar-text:   #ffffff;
      --font: 'Share Tech Mono', 'Nova Mono', 'Courier New', monospace;
    }

    /* ─── Dark mode theme (toggled by #screen_mode dark) ─── */
    /* NOTE: transition duration below must match THEME_TRANSITION_MS in JS */
    [data-theme="dark"] {
      --bg:         #000000;
      --bg-edge:    #1a1a1a;
      --bg-mid:     #0d0d0d;
      --text:       #ffffff;
      --bar:        #111111;
      --bar-text:   #ffffff;
      /* red accents unchanged in dark mode */
    }

    /* ─── Theme transition — applied to all elements using CSS vars ─── */
    body,
    .sidebar, .sidebar-line, .sidebar-block, .sidebar-dot, .sidebar-small-text,
    #status-bar, #control-bar,
    #word-display, #word-rule,
    #response-panel,
    #text-input, #text-input-panel,
    #kbd-btn, #mic-btn, #send-btn,
    #error-flash {
      transition:
        background-color 1s ease,
        background 1s ease,
        color 1s ease,
        border-color 1s ease,
        opacity 1s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: radial-gradient(ellipse at center,
        var(--bg) 0%,
        var(--bg-mid) 55%,
        var(--bg-edge) 100%
      );
      font-family: var(--font);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: default;
    }

    /* ─── Scanline overlay ─── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.03) 3px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ─── Three-column layout ─── */
    #layout {
      display: flex;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    .sidebar {
      width: 17.5%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 40px;
      gap: 18px;
      opacity: 0.35;
    }

    .sidebar-line {
      width: 60%;
      height: 1px;
      background: var(--text);
    }

    .sidebar-block {
      width: 60%;
      height: 6px;
      background: var(--text);
    }

    .sidebar-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text);
    }

    .sidebar-small-text {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
    }

    /* ─── Center stage ─── */
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ─── Status bar (top) ─── */
    #status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: var(--bar);
      color: var(--bar-text);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      animation: blink-dot 1200ms ease-in-out infinite;
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.1; }
    }

    /* ─── Main display area ─── */
    #display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      width: 100%;
      position: relative;
    }

    /* ─── Red triangle marker ─── */
    #triangle {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 20px solid var(--red);
      margin-bottom: 20px;
      animation: triangle-pulse 1000ms ease-in-out infinite alternate;
    }

    @keyframes triangle-pulse {
      from { border-top-color: var(--red-dark); }
      to   { border-top-color: var(--red); }
    }

    /* ─── Word display ─── */
    #word-display {
      font-size: 2.4em;
      font-weight: bold;
      letter-spacing: 8px;
      text-transform: uppercase;
      text-align: center;
      color: var(--text);
      min-height: 1.4em;
      opacity: 0;
      transition: opacity 180ms ease-in-out;
      user-select: none;
      padding: 0 20px;
      max-width: 80%;
      word-break: break-all;
    }

    #word-display.visible {
      opacity: 1;
    }

    /* ─── Horizontal rule below word ─── */
    #word-rule {
      height: 2px;
      background: var(--text);
      margin-top: 14px;
      width: 0;
      transition: width 200ms ease-out;
    }

    /* ─── Terminal panel (long responses) ─── */
    #terminal-panel {
      display: none;
      position: absolute;
      top: 30px;      /* below status bar */
      bottom: 204px;  /* above bottom-zone (160px) + control bar (44px) */
      left: 0; right: 0;
      padding: 18px 24px;
      overflow-y: auto;
      font-size: 0.88em;
      letter-spacing: 2px;
      line-height: 1.8;
      color: var(--text);
      text-align: left;
      text-transform: uppercase;
      scrollbar-width: thin;
      scrollbar-color: var(--red-mid) transparent;
      white-space: pre-wrap;
      word-break: break-word;
      z-index: 10;   /* above #display triangle/word-display */
    }

    #terminal-panel.active { display: block; }

    #terminal-panel::-webkit-scrollbar { width: 4px; }
    #terminal-panel::-webkit-scrollbar-thumb { background: var(--red-mid); }
    #terminal-panel::-webkit-scrollbar-track { background: transparent; }

    /* blinking cursor at end of terminal output */
    #terminal-cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: var(--red);
      vertical-align: text-bottom;
      animation: blink-cursor 600ms step-end infinite;
    }

    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ─── Idle message ─── */
    #idle {
      font-size: 1.1em;
      letter-spacing: 6px;
      color: #000000;
      background: #ffffff;
      border: 2px solid #ffffff;
      padding: 4px 14px 5px;
      display: inline-block;
    }

    [data-theme="dark"] #idle {
      color: #ffffff;
      background: #000000;
      border: 2px solid #ffffff;
    }

    #idle.blink {
      animation: blink-idle 900ms step-end infinite;
    }

    @keyframes blink-idle {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ═══════════════════════════════════════════════════════════
       KEYWORD CARDS — stacked on right side of center column
       ═══════════════════════════════════════════════════════════ */

    /* Container that holds up to 3 visible cards */
    #card-stack {
      position: absolute;
      top: 36px;
      right: 8px;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
      pointer-events: none;
    }

    /* Base card shell */
    .kw-card {
      font-family: 'Barlow Semi Condensed', var(--font);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: none;       /* hidden cards take no space */
      opacity: 0;
      transform: translateX(30px);
      width: 100%;
    }

    /* shown = in DOM and animating in */
    .kw-card.shown {
      display: block;
      transition: opacity 400ms ease, transform 400ms ease;
    }

    .kw-card.visible {
      opacity: 1;
      transform: translateX(0);
    }

    /* ── INITIATIVE card (Dominant Mandate style) ── */
    .kw-initiative {
      background: #000000;
      border: 2px solid #ffffff;
      padding: 0 0 4px 0;
      color: #ffffff;
    }

    .kw-initiative .kw-title-bar {
      background: #717171;
      color: #000000;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 6px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      letter-spacing: 2px;
    }

    .kw-initiative .kw-label-row {
      display: flex;
      align-items: center;
      padding: 5px 6px 2px;
      gap: 6px;
    }

    .kw-initiative .kw-keyword-badge {
      background: #cc0000;
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .kw-initiative .kw-body {
      color: #ffffff;
      font-size: 11px;
      padding: 4px 8px 4px;
      line-height: 1.6;
      min-height: 1.4em;
    }

    .kw-initiative .kw-footer-bar {
      background: #555555;
      height: 5px;
      margin: 4px -0px 0;
    }

    /* ── ASSET card (Subject Identified style) ── */
    .kw-asset {
      color: #ffffff;
    }

    .kw-asset .kw-title-bar {
      background: #000000;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 6px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
      letter-spacing: 2px;
      display: inline-block;
      width: 100%;
    }

    .kw-asset .kw-subtitle-row {
      background: #606060;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-top: 2px solid #aaa;
    }

    .kw-asset .kw-subtitle-label {
      color: #ffffff;
      font-size: 10px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .kw-asset .kw-keyword-badge {
      background: #cc0000;
      color: #ffffff;
      font-size: 10px;
      padding: 1px 5px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .kw-asset .kw-content {
      background: #000000;
      border-bottom: 2px solid #aaa;
      padding: 5px 8px;
      color: #ffffff;
      font-size: 11px;
      line-height: 1.6;
      min-height: 1.4em;
    }

    /* ── TASK card (Subtitle-Task style) ── */
    .kw-task {
      color: #ffffff;
    }

    .kw-task .kw-title-bar {
      background: #000000;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 6px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
      letter-spacing: 2px;
      display: inline-block;
      width: 100%;
    }

    .kw-task .kw-subtitle-row {
      background: #606060;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-top: 2px solid #aaa;
    }

    .kw-task .kw-subtitle-label {
      color: #ffffff;
      font-size: 10px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .kw-task .kw-keyword-badge {
      background: #000000;
      color: rgba(255,0,0,0.9);
      font-size: 10px;
      padding: 1px 5px;
      text-shadow: 1px 1px 2px rgba(255,0,0,0.8);
    }

    .kw-task .kw-content {
      background: #000000;
      border-bottom: 2px solid #aaa;
      padding: 5px 8px;
      color: rgba(255,0,0,0.9);
      font-size: 11px;
      line-height: 1.6;
      min-height: 1.4em;
      text-shadow: 0 0 6px rgba(255,0,0,0.5);
    }

    /* ── THREAT card (Primary Threat style) ── */
    .kw-threat {
      background: #606060;
      padding: 0;
    }

    .kw-threat .kw-deviant-bar {
      background: #232323;
      color: #ffffff;
      font-size: 9px;
      padding: 2px 6px;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .kw-threat .kw-deviant-icon {
      width: 8px; height: 8px;
      background: #cc0000;
      border-radius: 50%;
      animation: threat-pulse 800ms ease-in-out infinite alternate;
      flex-shrink: 0;
    }

    @keyframes threat-pulse {
      from { background: #b40000; box-shadow: none; }
      to   { background: #ff0000; box-shadow: 0 0 6px rgba(255,0,0,0.8); }
    }

    .kw-threat .kw-title-bar {
      background: #cc0000;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 6px;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
      letter-spacing: 3px;
      width: 100%;
    }

    .kw-threat .kw-rows {
      padding: 4px 6px 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .kw-threat .kw-row {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      border: 2px solid #787878;
    }

    .kw-threat .kw-row-label {
      color: #ffffff;
      font-size: 9px;
      padding: 0 5px;
      flex-shrink: 0;
      width: 70px;
    }

    .kw-threat .kw-row-value {
      background: #cc0000;
      color: #ffffff;
      font-size: 9px;
      padding: 0 6px;
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      letter-spacing: 2px;
    }

    .kw-threat .kw-content {
      padding: 4px 8px 5px;
      color: #ffffff;
      font-size: 10px;
      line-height: 1.6;
      min-height: 1.2em;
      border-top: 1px solid rgba(180,180,180,0.3);
    }

    /* ─── Loader dots ─── */
    #loader {
      display: none;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
    }

    #loader.active { display: flex; }

    .loader-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text);
      animation: loader-wave 1.2s ease-in-out infinite;
    }

    .loader-dot:nth-child(1) { animation-delay: 0ms; }
    .loader-dot:nth-child(2) { animation-delay: 120ms; }
    .loader-dot:nth-child(3) { animation-delay: 240ms; }
    .loader-dot:nth-child(4) { animation-delay: 360ms; }
    .loader-dot:nth-child(5) { animation-delay: 480ms; }
    .loader-dot:nth-child(6) { animation-delay: 600ms; }
    .loader-dot:nth-child(7) { animation-delay: 720ms; }

    #loader-status {
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
      min-height: 1em;
    }

    @keyframes loader-wave {
      0%, 100% { transform: scaleY(1);   opacity: 0.3; }
      50%       { transform: scaleY(2.2); opacity: 1; }
    }

    /* ─── Bottom zone: shared by response panel and text input panel ─── */
    /* Both panels sit above the control bar, occupying the same space.   */
    /* Only one is visible at a time.                                      */

    #bottom-zone {
      position: absolute;
      bottom: 44px;   /* height of control bar */
      left: 0; right: 0;
      height: 160px;
      display: flex;
      align-items: stretch;
      z-index: 30;   /* above #card-stack (z-index:20) */
    }

    /* ─── Response panel ─── */
    #response-panel {
      display: none;
      position: absolute;
      top: 30px;      /* below status bar */
      bottom: 204px;  /* above bottom-zone + control bar */
      left: 0; right: 0;
      padding: 18px 24px;
      overflow-y: auto;
      font-size: 0.82em;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.8;
      color: var(--text);
      opacity: 0.55;
      text-align: left;
      scrollbar-width: none;
      white-space: pre-wrap;
      word-break: break-word;
      z-index: 9;   /* below terminal-panel (z-index:10) */
    }

    #response-panel.active { display: block; }
    #response-panel::-webkit-scrollbar { display: none; }

    /* ─── Text input panel (full-width, same zone) ─── */
    #text-input-panel {
      display: none;   /* shown only in kbd mode */
      flex: 1;
      flex-direction: column;
      align-items: stretch;
      padding: 16px 20px 10px;
      background: var(--bg);
      border-top: 1px solid rgba(128,128,128,0.4);
    }

    #text-input-panel.open {
      display: flex;
    }

    #text-input-label {
      color: var(--red);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #text-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--red-mid);
      color: var(--text);
      font-family: var(--font);
      font-size: 1.5em;
      letter-spacing: 4px;
      outline: none;
      padding: 4px 0;
      caret-color: var(--red);
      width: 100%;
    }

    #text-input::placeholder {
      color: var(--text);
      opacity: 0.2;
      letter-spacing: 3px;
    }

    #send-btn {
      align-self: flex-end;
      margin-top: 10px;
      background: transparent;
      border: 1px solid var(--red-mid);
      color: var(--red-mid);
      cursor: pointer;
      padding: 6px 20px;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 200ms;
    }

    #send-btn:hover  { background: var(--red-dark); color: #fff; border-color: var(--red); }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ─── Control bar (bottom strip) ─── */
    #control-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--bar);
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 30;   /* above #card-stack (z-index:20) */
    }

    #prompt-label {
      color: var(--red);
      font-size: 16px;
      flex-shrink: 0;
    }

    /* voice transcript fills the middle */
    #voice-preview {
      flex: 1;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-style: italic;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    /* ─── Keyboard toggle button ─── */
    #kbd-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 4px 10px;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
      transition: all 200ms;
      height: 28px;
    }

    #kbd-btn:hover, #kbd-btn.active {
      border-color: var(--red-mid);
      color: var(--bar-text);
    }

    /* ─── Mic button ─── */
    #mic-btn {
      background: transparent;
      border: 1px solid var(--red-mid);
      color: var(--bar-text);
      cursor: pointer;
      padding: 4px 10px;
      font-family: var(--font);
      font-size: 13px;
      transition: all 200ms;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      height: 32px;
    }

    @media (hover: hover) {
      #mic-btn:hover { background: var(--red-dark); border-color: var(--red); }
    }

    #mic-btn.listening {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      animation: mic-pulse 600ms ease-in-out infinite alternate;
    }

    @keyframes mic-pulse {
      from { box-shadow: 0 0 4px var(--red); }
      to   { box-shadow: 0 0 20px var(--red), 0 0 40px rgba(254,45,45,0.3); }
    }

    #mic-icon { font-size: 15px; }
    /* Mode-specific border + dot color — visible both idle and listening */
    #mic-btn.barge       { border-color: var(--red); color: var(--red); }
    #mic-btn.speaker     { border-color: #f0a500;    color: #f0a500; }
    #mic-btn.xai         { border-color: #10b981;    color: #10b981; }
    #mic-btn.xai-b       { border-color: #f97316;  color: #f97316;
                           animation: xai-b-pulse 1.2s ease-in-out infinite alternate; }
    @keyframes xai-b-pulse {
      from { border-color: #f97316; color: #f97316; box-shadow: 0 0 4px #f97316; }
      to   { border-color: #10b981; color: #10b981; box-shadow: 0 0 14px rgba(16,185,129,0.4); }
    }
    #mic-btn.deepgram-di { border-color: #3b82f6;    color: #3b82f6;
                           animation: dg-di-pulse 1s ease-in-out infinite alternate; }
    @keyframes dg-di-pulse {
      from { border-color: #3b82f6; color: #3b82f6; box-shadow: 0 0 4px #3b82f6; }
      to   { border-color: var(--red); color: var(--red); box-shadow: 0 0 18px rgba(254,45,45,0.5); }
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }

    /* ─── Voice provider selector ─── */
    #stt-provider-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 4px 10px;
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
      transition: all 200ms;
      height: 28px;
    }
    #stt-provider-btn:hover {
      border-color: rgba(255,255,255,0.5);
      color: var(--bar-text);
    }

    /* ─── Claude mode toggle button ─── */
    #claude-mode-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 0 4px;
      min-width: 28px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: bold;
      flex-shrink: 0;
      transition: all 200ms;
      height: 28px;
    }
    @media (hover: hover) {
      #claude-mode-btn:hover {
        border-color: rgba(255,255,255,0.5);
        color: var(--bar-text);
      }
    }
    #claude-mode-btn.active {
      border-color: #a855f7;
      color: #a855f7;
      box-shadow: 0 0 6px rgba(168,85,247,0.4);
    }
    #claude-mode-btn.starting {
      border-color: #a855f7;
      color: #a855f7;
      opacity: 0.5;
      pointer-events: none;
    }

    #voice-provider-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 0 4px;
      min-width: 28px;
      font-family: var(--font);
      font-size: 13px;
      flex-shrink: 0;
      transition: all 200ms;
      height: 28px;
    }
    @media (hover: hover) {
      #voice-provider-btn:hover {
        border-color: rgba(255,255,255,0.5);
        color: var(--bar-text);
      }
    }
    #voice-provider-btn.xai-persistent {
      background: #f0a500;
      border-color: #f0a500;
      color: #000;
    }
    #voice-provider-btn.xai-persistent:hover {
      background: #d49200;
      border-color: #d49200;
      color: #000;
    }

    /* ─── Full-voice toggle button ─── */
    #full-voice-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 4px 10px;
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
      transition: all 200ms;
      height: 28px;
    }

    @media (hover: hover) {
      #full-voice-btn:hover {
        border-color: var(--red-mid);
        color: var(--bar-text);
      }
    }

    #full-voice-btn.active {
      border-color: var(--red);
      color: var(--red);
      animation: fv-pulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes fv-pulse {
      from { box-shadow: 0 0 2px var(--red); }
      to   { box-shadow: 0 0 12px var(--red), 0 0 24px rgba(254,45,45,0.25); }
    }

    /* ─── Speaker icon waves: hidden until full-voice active ─── */
    #fv-wave1, #fv-wave2 { opacity: 0; transition: opacity 200ms; }
    #full-voice-btn.active #fv-wave1 { opacity: 1; }
    #full-voice-btn.active #fv-wave2 { opacity: 1; }

    /* ─── Keyboard SVG key dots ─── */
    #kbd-btn svg line { stroke-width: 3; stroke-linecap: round; }

    /* ─── Corner decorations ─── */
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      opacity: 0.4;
    }

    .corner-tl { top: 40px; left: 0; border-top: 2px solid var(--text); border-left: 2px solid var(--text); }
    .corner-tr { top: 40px; right: 0; border-top: 2px solid var(--text); border-right: 2px solid var(--text); }
    .corner-bl { bottom: 48px; left: 0; border-bottom: 2px solid var(--text); border-left: 2px solid var(--text); }
    .corner-br { bottom: 48px; right: 0; border-bottom: 2px solid var(--text); border-right: 2px solid var(--text); }

    /* ─── Error flash ─── */
    #error-flash {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--red);
      opacity: 0;
      transition: opacity 300ms;
      pointer-events: none;
      white-space: nowrap;
      z-index: 300;
    }

    #error-flash.show { opacity: 1; }

    /* ─── Session ID (top right sidebar) ─── */
    #session-id {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(0,0,0,0.3);
      text-transform: uppercase;
    }

    /* ─── Voice transcript preview ─── */
    #voice-preview {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 1;
      font-style: italic;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }

    /* ─── Keyboard toggle button ─── */
    #kbd-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 5px 10px;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      flex-shrink: 0;
      transition: all 200ms;
    }

    #kbd-btn:hover, #kbd-btn.active {
      border-color: var(--red-mid);
      color: var(--bar-text);
    }


    /* ─── Send button ─── */
    #send-btn {
      background: transparent;
      border: 1px solid var(--red-mid);
      color: var(--red);
      cursor: pointer;
      padding: 5px 14px;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 200ms;
      flex-shrink: 0;
    }

    #send-btn:hover {
      background: var(--red-dark);
      color: #fff;
      border-color: var(--red);
    }

    #send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ═══════════════════════════════════════════════════════════
       COGNITIVE MODE — real-time llmem-gw monitoring overlay
       ═══════════════════════════════════════════════════════════ */

    #cogn-container {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      color: #ccc;
      font-family: var(--font);
      flex-direction: column;
      z-index: 200;
    }
    #cogn-container.active { display: flex; }

    #cogn-status-bar {
      background: #111;
      color: #fff;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid #c00;
    }

    #cogn-status-bar .cogn-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #fe2d2d;
      animation: blink-dot 1200ms ease-in-out infinite;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }

    /* ─── Main area: data-stack (left) + center (dash+chat) + card-stack (right) ─── */
    #cogn-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ─── Left data card stack (goals, beliefs, prospective, plans) ─── */
    #cogn-data-stack {
      width: 220px;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 8px 0 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-right: 1px solid #222;
      scrollbar-width: thin;
      scrollbar-color: #c00 transparent;
    }
    #cogn-data-stack::-webkit-scrollbar { width: 3px; }
    #cogn-data-stack::-webkit-scrollbar-thumb { background: #c00; }
    #cogn-data-stack::-webkit-scrollbar-track { background: transparent; }

    #cogn-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ─── Dashboard (timers, top of center column, halved height) ─── */
    #cogn-dashboard {
      flex-shrink: 0;
      max-height: 41vh;
      overflow-y: auto;
      padding: 6px 12px 4px;
      border-bottom: 2px solid #c00;
      background: #0d0d0d;
      scrollbar-width: thin;
      scrollbar-color: #c00 transparent;
    }
    #cogn-dashboard::-webkit-scrollbar { width: 4px; }
    #cogn-dashboard::-webkit-scrollbar-thumb { background: #c00; }
    #cogn-dashboard::-webkit-scrollbar-track { background: transparent; }

    #cogn-dash-content {
      font-size: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      color: #999;
      margin: 0;
    }

    #cogn-dash-age {
      font-size: 9px;
      color: #555;
      text-align: right;
      padding: 2px 0 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ─── Memstats — full-height column, left of toolstats ─── */
    #cogn-mem-panel {
      width: 384px;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 8px 10px;
      background: #0d0d0d;
      border-left: 1px solid #222;
      border-right: 1px solid #222;
      scrollbar-width: thin;
      scrollbar-color: #c00 transparent;
    }
    #cogn-mem-panel::-webkit-scrollbar { width: 3px; }
    #cogn-mem-panel::-webkit-scrollbar-thumb { background: #c00; }
    #cogn-mem-panel::-webkit-scrollbar-track { background: transparent; }

    #cogn-mem-label {
      font-size: 8px;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }
    #cogn-mem-content {
      font-size: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      color: #999;
      margin: 0;
    }

    /* ─── Toolstats — full-height column, left of cognition cards ─── */
    #cogn-tools-col {
      width: 352px;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 8px 0 8px 8px;
      border-right: 1px solid #222;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }
    #cogn-tools-col::-webkit-scrollbar { width: 3px; }
    #cogn-tools-col::-webkit-scrollbar-thumb { background: #444; }
    #cogn-tools-col::-webkit-scrollbar-track { background: transparent; }

    /* ─── Chat log (scrollable, halved height) ─── */
    #cogn-chat {
      flex: 1;
      max-height: 50%;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }
    #cogn-chat::-webkit-scrollbar { width: 4px; }
    #cogn-chat::-webkit-scrollbar-thumb { background: #444; }
    #cogn-chat::-webkit-scrollbar-track { background: transparent; }

    .cogn-msg { font-size: 12px; line-height: 1.6; }
    .cogn-msg-user .cogn-msg-prefix   { color: #c00; }
    .cogn-msg-assistant .cogn-msg-prefix { color: #666; }
    .cogn-msg-system { color: #555; font-style: italic; font-size: 11px; }
    .cogn-msg-text { white-space: pre-wrap; word-break: break-word; color: #ccc; }
    .cogn-msg-user .cogn-msg-text { color: #e0e0e0; }

    .cogn-cursor {
      display: inline-block;
      width: 7px; height: 1em;
      background: #c00;
      vertical-align: text-bottom;
      animation: blink-cursor 600ms step-end infinite;
    }
    .cogn-cursor.off { display: none; }

    /* ═══════════════════════════════════════════════════════════
       COGNITIVE CARDS — right-side stack (Samaritan style)
       ═══════════════════════════════════════════════════════════ */

    #cogn-card-stack {
      width: 220px;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 8px 8px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: #c00 transparent;
    }
    #cogn-card-stack::-webkit-scrollbar { width: 3px; }
    #cogn-card-stack::-webkit-scrollbar-thumb { background: #c00; }
    #cogn-card-stack::-webkit-scrollbar-track { background: transparent; }

    .cogn-card {
      background: #0f0f0f;
      border: 1px solid #333;
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: border-color 400ms ease;
    }
    .cogn-card.card-running  { border-color: #22c55e; }
    .cogn-card.card-error    { border-color: #c00; }

    .cogn-card-header {
      background: #1a1a1a;
      color: #666;
      font-size: 8px;
      padding: 2px 6px;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cogn-card-icon {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 400ms ease;
    }
    .cogn-card-icon.ci-sleeping { background: #3b82f6; }
    .cogn-card-icon.ci-running  { background: #22c55e;
      animation: cogn-icon-pulse 600ms ease-in-out infinite alternate; }
    .cogn-card-icon.ci-disabled { background: #444; }
    .cogn-card-icon.ci-starting { background: #f0a500; }
    .cogn-card-icon.ci-error    { background: #fe2d2d;
      animation: cogn-icon-pulse 400ms ease-in-out infinite alternate; }

    @keyframes cogn-icon-pulse {
      from { box-shadow: none; }
      to   { box-shadow: 0 0 6px currentColor; }
    }

    .cogn-card-title {
      background: #c00;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      letter-spacing: 2px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
    }

    .cogn-card-rows { padding: 2px 0; }

    .cogn-card-row {
      display: flex;
      align-items: center;
      min-height: 19px;
      border-bottom: 1px solid #1a1a1a;
    }
    .cogn-card-row:last-child { border-bottom: none; }

    .cogn-card-label {
      color: #555;
      font-size: 9px;
      padding: 0 6px;
      width: 72px;
      flex-shrink: 0;
      letter-spacing: 1px;
    }

    .cogn-card-val {
      color: #aaa;
      font-size: 9px;
      padding: 0 4px;
      flex: 1;
      letter-spacing: 1px;
      text-align: right;
    }

    .cogn-card-val.cv-countdown {
      color: #fe2d2d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .cogn-card-val.cv-status-sleeping { color: #3b82f6; }
    .cogn-card-val.cv-status-running  { color: #22c55e; }
    .cogn-card-val.cv-status-disabled { color: #555; }
    .cogn-card-val.cv-status-error    { color: #fe2d2d; }

    /* ── Progress bar (time elapsed in current cycle) ── */
    .cogn-card-progress {
      height: 3px;
      background: #1a1a1a;
      margin: 0 6px;
    }
    .cogn-card-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #c00, #fe2d2d);
      width: 0%;
      transition: width 1s linear;
    }

    /* ── Feedback footer ── */
    .cogn-card-fb {
      color: #444;
      font-size: 8px;
      padding: 3px 6px 4px;
      letter-spacing: 1px;
      border-top: 1px solid #1a1a1a;
      margin-top: 2px;
    }
    .cogn-card-fb .fb-ok  { color: #22c55e; }
    .cogn-card-fb .fb-low { color: #f0a500; }
    .cogn-card-fb .fb-bad { color: #fe2d2d; }

    /* ─── Input bar (bottom) ─── */
    #cogn-input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #111;
      border-top: 1px solid #333;
      flex-shrink: 0;
    }

    #cogn-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid #444;
      color: #e0e0e0;
      font-family: var(--font);
      font-size: 13px;
      letter-spacing: 2px;
      outline: none;
      padding: 6px 0;
      caret-color: #c00;
    }
    #cogn-input::placeholder { color: #444; letter-spacing: 2px; }

    #cogn-send {
      background: transparent;
      border: 1px solid #c00;
      color: #c00;
      cursor: pointer;
      padding: 6px 16px;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 200ms;
    }
    #cogn-send:hover { background: #330000; color: #fff; }
    #cogn-send:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ═══════════════════════════════════════════════════════════
       COGNITIVE DATA CARDS — goals, beliefs, prospective, plans, toolstats
       ═══════════════════════════════════════════════════════════ */

    .cogn-dc {
      background: #0f0f0f;
      border: 1px solid #333;
      font-family: var(--font);
      text-transform: uppercase;
    }

    .cogn-dc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0;
    }

    .cogn-dc-title {
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 3px 6px;
      flex: 1;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
    }

    .cogn-dc-controls {
      display: flex;
      flex-shrink: 0;
    }

    .cogn-dc-btn {
      background: rgba(0,0,0,0.4);
      color: #aaa;
      border: none;
      border-left: 1px solid rgba(255,255,255,0.1);
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 150ms;
    }
    .cogn-dc-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

    .cogn-dc-body {
      padding: 4px 6px;
      overflow-y: auto;
      max-height: 54px;   /* default ~3 lines */
      font-size: 9px;
      line-height: 1.5;
      letter-spacing: 0.5px;
      color: #777;
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
      transition: max-height 200ms ease;
    }
    .cogn-dc-body::-webkit-scrollbar { width: 3px; }
    .cogn-dc-body::-webkit-scrollbar-thumb { background: #444; }
    .cogn-dc-body::-webkit-scrollbar-track { background: transparent; }

    /* ── Fill-mode data card (stretches to fill parent) ── */
    .cogn-dc-fill {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .cogn-dc-fill .cogn-dc-body {
      flex: 1;
      max-height: none;
    }

    /* ── Separator between timer cards and data cards ── */
    .cogn-card-sep {
      height: 1px;
      background: linear-gradient(90deg, transparent, #c00, transparent);
      margin: 4px 0;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      #cogn-card-stack, #cogn-data-stack, #cogn-mem-panel, #cogn-tools-col { display: none; }
    }

    /* ─── Camera controls ─── */
    #cam-controls {
      display: flex;
      gap: 4px;
      align-items: center;
      position: absolute;
      right: 100px;   /* between title and clock */
      top: 50%;
      transform: translateY(-50%);
    }

    .cam-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      padding: 2px 6px;
      font-family: var(--font);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      height: 22px;
      transition: all 200ms;
    }
    .cam-btn:hover { border-color: rgba(255,255,255,0.5); color: var(--bar-text); }

    #cam-toggle-btn.rear  { border-color: #10b981; color: #10b981; }
    #cam-toggle-btn.front { border-color: #3b82f6; color: #3b82f6; }

    #cam-capture-btn.has-photo { border-color: #10b981; color: #10b981; }

    #auto-cap-btn.active {
      border-color: #f0a500; color: #f0a500;
      animation: auto-cap-pulse 2s ease-in-out infinite alternate;
    }
    @keyframes auto-cap-pulse {
      from { box-shadow: 0 0 2px #f0a500; }
      to   { box-shadow: 0 0 10px rgba(240,165,0,0.5); }
    }

    /* Photo analysis mode button */
    #photo-mode-btn.mode-scene    { border-color: #10b981; color: #10b981; }
    #photo-mode-btn.mode-ocr      { border-color: #3b82f6; color: #3b82f6; }
    #photo-mode-btn.mode-reason   { border-color: #a855f7; color: #a855f7; }

    /* Camera viewfinder overlay */
    #camera-viewfinder {
      display: none;
      position: absolute;
      top: 30px;
      bottom: 100px;
      left: 0; right: 0;
      z-index: 8;
      background: #000;
    }
    #camera-viewfinder.active { display: block; }
    #camera-viewfinder video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Capture flash */
    #capture-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 9;
      transition: opacity 80ms;
    }
    #capture-flash.flash { opacity: 0.6; }

    /* Photo attached indicator */
    #capture-indicator {
      position: absolute;
      top: 34px;
      right: 10px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #10b981;
      text-transform: uppercase;
      z-index: 11;
      display: none;
    }
    #capture-indicator.active { display: block; }

    /* ─── Narrow phone screens (≤ 480px) ─── */
    @media (max-width: 480px) {
      #stt-provider-btn { display: none; }
      /* Tighten bar so all icon buttons fit */

<script>
// ═══════════════════════════════════════════════════════════
//  SAMARITAN INTERFACE — client logic
// ═══════════════════════════════════════════════════════════
// ── Auth ─────────────────────────────────────────────────────
// HTTP Basic Auth is handled by the browser — it prompts for credentials
// Key is injected by the server at render time — sent as Bearer on all requests.
// EventSource can't set headers so it uses ?token= query param instead.
const _apiKey = '%%SAMARITAN_API_KEY%%';
function authHeaders() {
  return _apiKey ? { 'Authorization': 'Bearer ' + _apiKey } : {};
}
function authedUrl(url) {
  if (!_apiKey) return url;
  const sep = url.includes('?') ? '&' : '?';
  return url + sep + 'token=' + encodeURIComponent(_apiKey);
}

// ── Session ID (unique per submit) ──────────────────────────
function makeSessionId() { return 'sam-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
// Persist SESSION_ID across background-reload cycles so llmem-gw session continuity is maintained.
const _savedSessionId = sessionStorage.getItem('sam_session_id');
let SESSION_ID = _savedSessionId || makeSessionId();
sessionStorage.setItem('sam_session_id', SESSION_ID);
document.getElementById('session-id-value').textContent = SESSION_ID.toUpperCase();

// ── DOM refs ────────────────────────────────────────────────
const wordDisplay    = document.getElementById('word-display');
const wordRule       = document.getElementById('word-rule');
const idleEl         = document.getElementById('idle');
const loaderEl       = document.getElementById('loader');
const terminalPanel  = document.getElementById('terminal-panel');
const terminalText   = document.getElementById('terminal-text');
const terminalCursor = document.getElementById('terminal-cursor');
const cardStack      = document.getElementById('card-stack');
const textInput      = document.getElementById('text-input');
const textInputPanel = document.getElementById('text-input-panel');
const sendBtn        = document.getElementById('send-btn');
const micBtn         = document.getElementById('mic-btn');
const micIcon        = document.getElementById('mic-icon');
const kbdBtn         = document.getElementById('kbd-btn');
const fullVoiceBtn       = document.getElementById('full-voice-btn');
const claudeModeBtn      = document.getElementById('claude-mode-btn');
const voiceProviderBtn   = document.getElementById('voice-provider-btn');
const voicePreview   = document.getElementById('voice-preview');
const statusText     = document.getElementById('status-text');
const statusDot      = document.getElementById('status-dot');
const responsePanel  = document.getElementById('response-panel');
const errorFlash     = document.getElementById('error-flash');
const clockEl        = document.getElementById('clock');

// ── Keyboard / voice mode toggle ─────────────────────────────
let kbdOpen      = false;
let voiceMode    = false;  // true only when user explicitly enabled mic
let _micStateBeforeKbd = null;  // saved mic state when keyboard opens
let fullVoiceMode = false; // true when xAI TTS is active

// ── Mic mode: 'off' | 'barge' | 'speaker' | 'deepgram-di' | 'xai' | 'xai-b' ─
// off         — mic disabled in full-voice mode
// barge       — mic always on; STT transcript during TTS triggers barge-in (AirPods/headphones)
// speaker     — mic always on; STT transcripts suppressed during TTS (phone speaker safe)
// deepgram-di — Deepgram nova-3 + speaker diarization; labels each speaker turn
// xai         — xAI realtime STT with emotion/prosody; no barge-in
// xai-b       — xAI realtime STT with emotion/prosody + barge-in
let micMode = 'off';
let _sttRestartAttempted = false;  // prevents restart-without-cycling trap
const MIC_MODES = ['off', 'barge', 'speaker', 'deepgram-di', 'xai', 'xai-b'];
const MIC_MODE_LABELS = { off: '🎤', barge: 'B', speaker: 'S', 'deepgram-di': 'DI', xai: 'X', 'xai-b': 'XB' };

function setMicMode(mode) {
  micMode = mode;
  if (!isListening) micIcon.textContent = MIC_MODE_LABELS[mode];
  micBtn.classList.remove('barge', 'speaker', 'deepgram-di', 'xai', 'xai-b');
  if (mode !== 'off') micBtn.classList.add(mode);
}

// ── Full-voice toggle ─────────────────────────────────────────
// Pre-create AudioContext on user gesture so iOS Safari allows it to play later.
function initAudioCtx() {
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Auto-resume if iOS suspends the context (e.g. after notification interruption)
    audioCtx.addEventListener('statechange', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    });
  } else if (audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
}

// voiceProviderBtn wired after ttsProviders is defined (see end of TTS section)

fullVoiceBtn.addEventListener('click', () => {
  fullVoiceMode = !fullVoiceMode;
  fullVoiceBtn.classList.toggle('active', fullVoiceMode);
  voicePreview.textContent = fullVoiceMode ? 'SAMARITAN VOICE ACTIVE' : 'TAP MIC TO SPEAK';
  if (fullVoiceMode) initAudioCtx();  // unlock AudioContext while we have a user gesture
});

function setKbdMode(open) {
  kbdOpen = open;
  // Swap panels: show text input OR response panel, never both
  textInputPanel.classList.toggle('open', open);
  // responsePanel visibility is managed independently via .active class
  kbdBtn.classList.toggle('active', open);
  voicePreview.style.visibility = open ? 'hidden' : '';
  if (open) {
    // Save mic state before disabling
    _micStateBeforeKbd = { voiceMode, micMode, wasListening: isListening };
    voiceMode = false;
    if (isListening) {
      const provider = typeof getActiveProvider === 'function' ? getActiveProvider() : sttProviders[STT_PROVIDER];
      if (provider) provider.stop();
    }
  } else {
    textInput.blur();
    voicePreview.textContent = fullVoiceMode ? 'SAMARITAN VOICE ACTIVE' : 'TAP MIC TO SPEAK';
    // Restore mic state from before keyboard was opened
    if (_micStateBeforeKbd && _micStateBeforeKbd.micMode !== 'off') {
      voiceMode = _micStateBeforeKbd.voiceMode;
      if (_micStateBeforeKbd.wasListening && !isStreaming) {
        const provider = typeof getActiveProvider === 'function' ? getActiveProvider() : sttProviders[STT_PROVIDER];
        if (provider) provider.start();
      }
    }
    _micStateBeforeKbd = null;
  }
}

// iOS requires focus() to be called synchronously inside the tap handler
kbdBtn.addEventListener('click', () => {
  resetIdleTimer();
  if (fullVoiceMode) initAudioCtx();  // unlock AudioContext while we have a user gesture
  const opening = !kbdOpen;
  setKbdMode(opening);
  if (opening) {
    textInput.focus();
  }
});

// ── Clock ───────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  clockEl.textContent = now.toTimeString().slice(0, 8);
}
updateClock();
setInterval(updateClock, 1000);

// ── Config ───────────────────────────────────────────────────
const DEBUG                   = false; // show debug/error flash messages at bottom of screen
const IDLE_TIMEOUT_SEC        = 300;   // seconds before screen returns to idle message
const THEME_TRANSITION_MS     = 3000;  // ms for dark/light crossfade (must match CSS transition duration)
const LONG_RESPONSE_THRESHOLD = 10;    // words — responses >= this use terminal display instead of word flash
const TERMINAL_CHAR_DELAY_MS  = 18;    // ms per character in terminal typewriter effect
const CARD_CYCLE_DELAY_MS     = 5000;  // ms each group of 3 cards is shown when cycling
let   TTS_PROVIDER            = 'inworld';              // active TTS provider: 'deepgram' | 'inworld' | 'xai' | 'xai-persistent'
const XAI_VOICE               = 'ara';              // xAI realtime voice: Eve | Ara | Rex | Sal | Leo
let   INWORLD_VOICE           = 'Evelyn';           // Inworld voice name
const DEEPGRAM_TTS_MODEL      = 'aura-asteria-en'; // Deepgram Aura TTS model
// Model to auto-switch to when xai-persistent TTS is selected, and back when leaving.
// Set to null to disable auto-switch (use !model manually instead).
const XAI_PERSISTENT_MODEL    = 'samaritan-voice-fast';  // llmem-gw model key for persistent mode
const INWORLD_MODEL           = 'inworld-tts-1.5-mini'; // Inworld model ID
const INWORLD_SPEAKING_RATE   = 1.3;                // 0.5–1.5× native speed
const INWORLD_TEMPERATURE     = 2.0;                // 0–2; expressiveness

// ── STT config ───────────────────────────────────────────────
let   STT_PROVIDER            = 'deepgram';        // 'webspeech' | 'deepgram'
const DG_MODEL                = 'flux-general-en';  // flux-general-en | nova-3 | nova-2 | enhanced
const DG_ENCODING             = 'linear16';         // linear16 (raw PCM from AudioWorklet)
const DG_EOT_THRESHOLD        = 0.8;                // flux eot_threshold (0.5–0.9): EndOfTurn confidence
const STT_CONFIRM_BEEP        = true;               // audible beep on STT prompt received
const STT_BEEP_FREQ_HZ        = 880;                // beep pitch in Hz (440=A4, 880=A5)
const STT_BEEP_DURATION_MS    = 80;                 // beep length in ms
const STT_BEEP_GAIN           = 0.15;               // beep volume 0–1
// Ambient noise guards
const STT_NOISE_GATE             = 0;                // RMS threshold: 0=disabled. (0.01–0.05 to gate ambient noise, but can break Flux EndOfTurn)
const STT_MIN_WORDS              = 3;               // global: ignore finals with fewer words in ALL modes (filters ambient noise)
const STT_BARGE_MIN_WORDS        = 1;               // barge mode: minimum words to trigger barge-in
const STT_SPEAKER_COOLDOWN_MS    = 1500;            // ms after TTS ends before accepting STT finals
const STT_SPEAKER_MIN_WORDS      = 3;               // ignore finals with fewer words during cooldown
const STT_READY_CHIME            = true;            // play ascending two-tone chime when cooldown clears
const STT_READY_CHIME_FREQ_LO    = 523;             // low note Hz  (C5)
const STT_READY_CHIME_FREQ_HI    = 784;             // high note Hz (G5)
const STT_READY_CHIME_NOTE_MS    = 80;              // duration of each note in ms
const STT_READY_CHIME_GAP_MS     = 40;              // gap between notes in ms
const STT_READY_CHIME_GAIN       = 0.15;            // chime volume 0–1

// Keyword → card-type mapping. Add/remove entries freely.
// type: 'initiative' | 'asset' | 'task' | 'threat'
const KEYWORD_CARDS = {
  'INITIATIVE:': { type: 'initiative' },
  'ASSET:':      { type: 'asset'      },
  'TASK:':       { type: 'task'       },
  'THREAT:':     { type: 'threat'     },
};

// ── Claude relay mode ────────────────────────────────────────
// When active, all STT/text input routes through the MCP Direct
// voice relay to Claude Code instead of llmem-gw's LLM pipeline.
let claudeMode       = false;
let _claudePollTimer = null;
const CLAUDE_RELAY_URL = '/api/claude-relay';  // legacy relay (kept for backward compat)
const CLAUDE_DISPATCH_URL = '/api/claude';    // rc-style tmux dispatch

// ── Location state ───────────────────────────────────────────
let locationEnabled = false;
let _geoWatchId     = null;
let _lastPosition   = null;

// ── Camera state ────────────────────────────────────────────
let cameraState       = 'off';    // 'off' | 'rear' | 'front'
let autoCaptureActive = false;
let _autoCaptureTimer = null;
let pendingPhoto      = null;     // { b64: string, source: 'manual'|'auto' } or null
let pendingAnalysis   = null;     // Promise<string> — eager analysis fired on manual snap
let lastAnalyzedPhoto = null;     // { b64: string } — last auto-capture that was analyzed, for deferred save
let lastUploadedPhoto = null;     // { b64: string } — last manual snap uploaded to Drive, for re-analysis
let _cameraStream     = null;

// Trigger phrases for auto-capture photo analysis (scene description)
const PHOTO_ANALYZE_TRIGGERS = [
  'what do you see', 'what do you think of this', 'what is this',
  'look at this', 'check this out', 'take a look',
  'describe what', 'what am i looking at',
  'can you see', 'do you see',
];
// OCR triggers — full text extraction from screens, documents, labels
const PHOTO_OCR_TRIGGERS = [
  'read this screen', 'read this document', 'read this',
  'read that screen', 'read that document', 'read that',
  'what does this say', 'what does that say',
  'read the text', 'read the label', 'read the ingredients',
];
// Reasoning triggers — deeper analytical interpretation of the photo
const PHOTO_REASON_TRIGGERS = [
  'reason about this photo', 'reason about what you see',
  'reason about this', 'analyze this photo',
  'analyze this', 'think about this photo',
  'think about what you see',
];
const PHOTO_REANALYZE_TRIGGERS = [
  'reanalyze that photo', 're-analyze that photo', 'reanalyze that',
  'read that photo', 'read the text on that', 'read that last photo',
  'read the text on the', 'reason about that photo', 'reason about the last',
  'analyze that photo again', 'look at that photo again',
  'ocr that photo', 'read that again',
  'on that last photo', 'on the last photo',
  'that last photo', 'the last photo',
];
const PHOTO_SAVE_TRIGGERS = [
  'save that photo', 'save the photo', 'keep that photo',
  'save that picture', 'save the picture', 'keep that picture',
  'save that image', 'save the image',
];

function matchesTrigger(text, triggers) {
  const lower = text.toLowerCase();
  return triggers.some(t => lower.includes(t));
}

// Photo analysis mode: 'scene' | 'ocr' | 'reason'
const PHOTO_MODES = ['scene', 'ocr', 'reason'];
const PHOTO_MODE_LABELS = { scene: 'S', ocr: 'O', reason: 'R' };
const PHOTO_MODE_PROMPTS = {
  scene_voice: 'Describe this photo in 2-3 concise sentences. Focus on what is most notable or relevant. Mention text from street signs, store signs, or product names if visible, but do not transcribe screens or documents.',
  scene_text: null,  // falls through to default detailed prompt
  ocr: 'Extract and transcribe ALL visible text in this image. Preserve layout and formatting where possible. Include every word you can read.',
  reason: 'Analyze this image in depth. Describe what you see, infer context and meaning, identify anything notable or unusual, and provide your reasoning about what is happening and why.',
};
const PHOTO_MODE_STATUS = { scene: 'ANALYZING PHOTO', ocr: 'READING TEXT', reason: 'REASONING ABOUT PHOTO' };
const PHOTO_MODE_TAG = { scene: 'Photo analysis', ocr: 'Photo OCR', reason: 'Photo reasoning' };
let photoMode = 'scene';

const photoModeBtn = document.getElementById('photo-mode-btn');
photoModeBtn.addEventListener('click', () => {
  const idx = (PHOTO_MODES.indexOf(photoMode) + 1) % PHOTO_MODES.length;
  photoMode = PHOTO_MODES[idx];
  photoModeBtn.textContent = PHOTO_MODE_LABELS[photoMode];
  photoModeBtn.className = 'cam-btn mode-' + photoMode;
  console.log('[camera] photo mode:', photoMode);
});

function getPhotoPrompt(isVoice) {
  if (photoMode === 'scene') return isVoice ? PHOTO_MODE_PROMPTS.scene_voice : PHOTO_MODE_PROMPTS.scene_text;
  return PHOTO_MODE_PROMPTS[photoMode];
}

const camToggleBtn     = document.getElementById('cam-toggle-btn');
const camCaptureBtn    = document.getElementById('cam-capture-btn');
const autoCapBtn       = document.getElementById('auto-cap-btn');
const camVideo         = document.getElementById('cam-video');
const camViewfinder    = document.getElementById('camera-viewfinder');
const camCanvas        = document.getElementById('cam-canvas');
const captureFlash     = document.getElementById('capture-flash');
const captureIndicator = document.getElementById('capture-indicator');

// ── State ────────────────────────────────────────────────────
let isStreaming    = false;
let isSpeaking     = false;
let _sttCooldownUntil = 0;  // timestamp (ms) — STT finals suppressed until this time in speaker mode
let wordQueue      = [];
let wordAnimating  = false;
let fullResponse   = '';
let idleTimer      = null;
let activeEvtSource = null;  // current SSE stream — closed on each new submit

// ── Utilities ────────────────────────────────────────────────
function setStatus(text, active = false) {
  statusText.textContent = text.toUpperCase();
  statusDot.style.animationPlayState = active ? 'running' : 'paused';
  statusDot.style.opacity = active ? null : '1';
}

function flashError(msg) {
  if (!DEBUG) return;
  errorFlash.textContent = '[ ' + msg.toUpperCase() + ' ]';
  errorFlash.classList.add('show');
  setTimeout(() => errorFlash.classList.remove('show'), 3000);
}
function flashCmd(msg) {
  errorFlash.textContent = '[ ' + msg.toUpperCase() + ' ]';
  errorFlash.classList.add('show');
  setTimeout(() => errorFlash.classList.remove('show'), 3000);
}

// ── Location helpers ─────────────────────────────────────────
function _locationData() {
  if (!locationEnabled || !_lastPosition) return null;
  const { latitude, longitude, accuracy } = _lastPosition.coords;
  return {
    latitude:   parseFloat(latitude.toFixed(4)),
    longitude:  parseFloat(longitude.toFixed(4)),
    accuracy_m: Math.round(accuracy),
  };
}

function cmdLocation(arg) {
  if (!arg) {
    const state = locationEnabled ? 'ON' : 'OFF';
    const coords = _lastPosition
      ? `${_lastPosition.coords.latitude.toFixed(4)},${_lastPosition.coords.longitude.toFixed(4)}`
      : 'no fix';
    flashCmd(`location: ${state} — ${coords}`);
    return;
  }
  if (arg === 'on') {
    if (!navigator.geolocation) { flashError('geolocation not supported'); return; }
    locationEnabled = true;
    _geoWatchId = navigator.geolocation.watchPosition(
      pos => { _lastPosition = pos; },
      err => {
        console.warn('[location] error:', err.message);
        locationEnabled = false;
        _lastPosition = null;
        if (_geoWatchId !== null) { navigator.geolocation.clearWatch(_geoWatchId); _geoWatchId = null; }
        flashError('location error: ' + err.message);
      },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
    );
    flashCmd('location ON — awaiting GPS fix');
  } else if (arg === 'off') {
    locationEnabled = false;
    if (_geoWatchId !== null) { navigator.geolocation.clearWatch(_geoWatchId); _geoWatchId = null; }
    _lastPosition = null;
    flashCmd('location OFF');
  } else {
    flashError('usage: #location <on|off>');
  }
}

// ── Camera functions ────────────────────────────────────────
const CAM_MAX_DIM = 1280;  // max pixel dimension for captured frames
const CAM_JPEG_QUALITY = 0.85;
const AUTO_CAP_INTERVAL = 8000;
const DRIVE_PHOTOS_FOLDER = '1JUe7bjxPAuKKxCC9kV2H9eLVMUFkJStl';

let _camZoom = 1, _camZoomMin = 1, _camZoomMax = 1;

async function startCamera(facingMode) {
  try {
    // Stop existing camera stream if any
    if (_cameraStream) {
      _cameraStream.getTracks().forEach(t => t.stop());
      _cameraStream = null;
    }
    const constraints = {
      video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    };
    _cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    camVideo.srcObject = _cameraStream;
    camViewfinder.classList.add('active');
    // Detect zoom capability
    const track = _cameraStream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.zoom) {
      _camZoomMin = caps.zoom.min;
      _camZoomMax = caps.zoom.max;
      _camZoom = track.getSettings().zoom || 1;
      console.log('[camera] zoom supported:', _camZoomMin, '-', _camZoomMax, 'current:', _camZoom);
    } else {
      _camZoomMin = 1; _camZoomMax = 1; _camZoom = 1;
      console.log('[camera] zoom not supported by this camera');
    }
    console.log('[camera] started:', facingMode);
  } catch (e) {
    console.error('[camera] getUserMedia failed:', e);
    flashError('camera error: ' + e.message);
    cameraState = 'off';
    camToggleBtn.classList.remove('rear', 'front');
    camViewfinder.classList.remove('active');
  }
}

// ── Pinch-to-zoom on camera viewfinder ──────────────────────
(function() {
  let startDist = 0, startZoom = 1;
  function pinchDist(e) {
    const [a, b] = [e.touches[0], e.touches[1]];
    return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
  }
  camViewfinder.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2 && _camZoomMax > _camZoomMin) {
      startDist = pinchDist(e);
      startZoom = _camZoom;
      e.preventDefault();
    }
  }, { passive: false });
  camViewfinder.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && _camZoomMax > _camZoomMin && _cameraStream) {
      const scale = pinchDist(e) / startDist;
      const newZoom = Math.min(_camZoomMax, Math.max(_camZoomMin, startZoom * scale));
      const track = _cameraStream.getVideoTracks()[0];
      if (track) {
        track.applyConstraints({ advanced: [{ zoom: newZoom }] })
          .then(() => { _camZoom = newZoom; })
          .catch(() => {});
      }
      e.preventDefault();
    }
  }, { passive: false });
})();

function stopCamera() {
  if (_cameraStream) {
    _cameraStream.getTracks().forEach(t => t.stop());
    _cameraStream = null;
  }
  camVideo.srcObject = null;
  camViewfinder.classList.remove('active');
  _camZoom = 1; _camZoomMin = 1; _camZoomMax = 1;
  stopAutoCapture();
  console.log('[camera] stopped');
}

function cycleCamera() {
  if (cameraState === 'off') {
    cameraState = 'rear';
    camToggleBtn.classList.remove('front');
    camToggleBtn.classList.add('rear');
    camToggleBtn.textContent = 'REAR';
    startCamera('environment');
  } else if (cameraState === 'rear') {
    cameraState = 'front';
    camToggleBtn.classList.remove('rear');
    camToggleBtn.classList.add('front');
    camToggleBtn.textContent = 'FRONT';
    startCamera('user');
  } else {
    cameraState = 'off';
    camToggleBtn.classList.remove('rear', 'front');
    camToggleBtn.textContent = 'CAM';
    stopCamera();
    clearPendingPhoto();
  }
}

function captureFrame(source) {
  if (cameraState === 'off' || !camVideo.videoWidth) {
    flashError('camera not ready');
    return;
  }
  // Scale down if needed
  let w = camVideo.videoWidth, h = camVideo.videoHeight;
  if (Math.max(w, h) > CAM_MAX_DIM) {
    const scale = CAM_MAX_DIM / Math.max(w, h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  camCanvas.width = w;
  camCanvas.height = h;
  const ctx = camCanvas.getContext('2d');
  ctx.drawImage(camVideo, 0, 0, w, h);
  const b64 = camCanvas.toDataURL('image/jpeg', CAM_JPEG_QUALITY);
  pendingPhoto = { b64: b64, source: source || 'manual' };

  // Visual feedback
  if (source !== 'auto') {
    captureFlash.classList.add('flash');
    setTimeout(() => captureFlash.classList.remove('flash'), 150);
  }
  captureIndicator.classList.add('active');
  camCaptureBtn.classList.add('has-photo');
  console.log(`[camera] frame captured (${source}): ${w}x${h}`);

  // Eager analysis: fire immediately on manual snap using current photo mode
  if (source !== 'auto') {
    const captureMode = photoMode;  // snapshot current mode
    const isVoiceActive = voiceMode || fullVoiceMode;
    const modePrompt = getPhotoPrompt(isVoiceActive);
    setStatus(PHOTO_MODE_STATUS[captureMode], true);
    pendingAnalysis = analyzePhoto(b64, modePrompt).then(result => {
      setStatus('PHOTO READY', false);
      return result;
    }).catch(e => {
      console.error('[camera] eager analysis failed:', e);
      setStatus('PHOTO ANALYSIS FAILED', false);
      return '[Photo analysis failed: ' + e.message + ']';
    });
    // Upload to Drive immediately — don't wait for submit
    // Eidetic memory save is handled server-side: llmem-gw correlates the
    // analysis and upload by image hash and fires eidetic_save automatically.
    uploadPhotoToDrive(b64);
  } else {
    pendingAnalysis = null;
  }
}

function clearPendingPhoto() {
  pendingPhoto = null;
  pendingAnalysis = null;
  captureIndicator.classList.remove('active');
  camCaptureBtn.classList.remove('has-photo');
}

function startAutoCapture() {
  if (cameraState === 'off') { flashError('start camera first'); return; }
  autoCaptureActive = true;
  autoCapBtn.classList.add('active');
  autoCapBtn.textContent = 'AUTO';
  captureFrame('auto');  // immediate first capture
  _autoCaptureTimer = setInterval(() => captureFrame('auto'), AUTO_CAP_INTERVAL);
  flashCmd('auto-capture ON (8s)');
}

function stopAutoCapture() {
  autoCaptureActive = false;
  autoCapBtn.classList.remove('active');
  if (_autoCaptureTimer) { clearInterval(_autoCaptureTimer); _autoCaptureTimer = null; }
}

// Async photo analysis — called after submit, returns analysis text
const PHOTO_ANALYZE_TIMEOUT = 30000;  // 30s timeout for cellular-friendly analysis
async function analyzePhoto(imageB64, promptText) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), PHOTO_ANALYZE_TIMEOUT);
  try {
    const resp = await fetch('/api/analyze-photo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      signal: controller.signal,
      body: JSON.stringify({
        image_b64: imageB64,
        prompt: promptText || 'Describe what you see in this photo in detail. Mention text from street signs, store signs, or product names if visible, but do not transcribe screens or documents.',
        task_type: 'general',
      }),
    });
    if (!resp.ok) throw new Error('analyze-photo: ' + resp.status);
    const data = await resp.json();
    return data.result || '';
  } catch (e) {
    if (e.name === 'AbortError') {
      console.warn('[camera] analyze timed out after ' + PHOTO_ANALYZE_TIMEOUT + 'ms');
      return '[Photo analysis timed out — slow connection]';
    }
    console.error('[camera] analyze failed:', e);
    return '[Photo analysis failed: ' + e.message + ']';
  } finally {
    clearTimeout(timer);
  }
}

// Async Drive upload for snapped captures (not auto-capture)
// Returns { file_id, file_name } on success, null on failure
async function uploadPhotoToDrive(imageB64, source = 'snap') {
  const prefix = source === 'auto' ? 'samaritan_autocap' : 'samaritan_snap';
  const fileName = `${prefix}_${Date.now()}.jpg`;
  const raw = imageB64.includes(',') ? imageB64.split(',')[1] : imageB64;
  try {
    const r = await fetch('/api/drive-upload-photo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({
        image_b64: raw,
        file_name: fileName,
        folder_id: DRIVE_PHOTOS_FOLDER,
      }),
    });
    if (r.ok) {
      const data = await r.json();
      const fileId = data.file_id || '';
      console.log('[camera] uploaded to Drive:', fileName, fileId);
      return { file_id: fileId, file_name: fileName };
    }
    console.warn('[camera] Drive upload failed:', r.status, await r.text());
    return null;
  } catch (e) {
    console.warn('[camera] Drive upload error:', e);
    return null;
  }
}

// Commands starting with # are intercepted client-side and never sent to llmem-gw.
// Add new commands as cases in handleCommand().

function cmdScreenMode(mode) {
  if (mode !== 'dark' && mode !== 'light') {
    flashError('usage: #screen_mode <dark|light>');
    return;
  }
  if (mode === 'dark') {
    document.body.setAttribute('data-theme', 'dark');
  } else {
    document.body.removeAttribute('data-theme');
  }
}

function handleCommand(raw) {
  const parts = raw.trim().split(/\s+/);
  const cmd   = parts[0].toLowerCase();
  const args  = parts.slice(1);
  switch (cmd) {
    case '#screen_mode': cmdScreenMode(args[0]); break;
    case '#mode':
      if (args[0] === 'cognitive') enterCognMode();
      else if (args[0] === 'default') { exitCognMode(); exitClaudeMode(); }
      else if (args[0] === 'chat') enterChatMode();
      else if (args[0] === 'chat-ged') enterChatGedMode();
      else if (args[0] === 'claude') enterClaudeMode();
      else flashError('usage: #mode <cognitive|default|chat|chat-ged|claude>');
      break;
    case '#db':
      if (!args[0]) { flashError('usage: #db <name>'); break; }
      if (cognMode) cognSwitchDb(args[0]);
      else flashError('#db only applies in cognitive mode');
      break;
    case '#inworld_voice':
      if (!args[0]) { flashCmd('Inworld voice: ' + INWORLD_VOICE); break; }
      INWORLD_VOICE = args[0];
      flashCmd('Inworld voice set to: ' + INWORLD_VOICE);
      break;
    case '#location': cmdLocation(args[0]); break;
    case '#camera':
      if (!args[0]) { flashCmd('camera: ' + cameraState); break; }
      if (args[0] === 'rear') { cameraState = 'off'; cycleCamera(); }
      else if (args[0] === 'front') { cameraState = 'off'; cycleCamera(); cycleCamera(); }
      else if (args[0] === 'off') { cameraState = 'off'; stopCamera(); camToggleBtn.classList.remove('rear','front'); camToggleBtn.textContent = 'CAM'; clearPendingPhoto(); }
      else { flashError('usage: #camera <rear|front|off>'); }
      break;
    default: flashError('unknown command: ' + cmd);
  }
}

// ── Mode: Claude relay ──────────────────────────────────────
// Routes all voice/text input to Claude Code via MCP Direct voice relay.
// llmem-gw's LLM pipeline is bypassed — Claude Opus handles everything.

async function _ensureClaudeUp(channel = 'default') {
  // Check if Claude is alive in tmux; if not, auto-start with count-up timer.
  // Returns true if Claude is up, false if startup failed.
  try {
    const r = await fetch(CLAUDE_DISPATCH_URL + '/status?channel=' + encodeURIComponent(channel), { headers: authHeaders() });
    const d = await r.json();
    if (d.enabled) return true;
  } catch (e) { /* fall through to start */ }

  // Count-up timer so the user sees progress
  let secs = 0;
  const timer = setInterval(() => {
    secs++;
    setStatus(`STARTING CLAUDE… ${secs}s`, true);
    voicePreview.textContent = `STARTING CLAUDE… ${secs}s`;
  }, 1000);

  try {
    const startResp = await fetch('/api/ged/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ channel }),
    });
    const startData = await startResp.json();
    if (startData.status === 'started' || startData.status === 'already_running') {
      clearInterval(timer);
      return true;
    }
    // Poll status directly (no relay dependency)
    for (let i = 0; i < 15; i++) {
      await new Promise(r => setTimeout(r, 2000));
      try {
        const recheck = await fetch(
          CLAUDE_DISPATCH_URL + '/status?channel=' + encodeURIComponent(channel),
          { headers: authHeaders() }
        );
        const d = await recheck.json();
        if (d.enabled) { clearInterval(timer); return true; }
      } catch (_) {}
    }
    clearInterval(timer);
    return false;
  } catch (e) {
    clearInterval(timer);
    return false;
  }
}

async function enterClaudeMode() {
  // Always check relay and auto-start if needed — even if already in claude mode

  setStatus('STARTING CLAUDE...', true);

let _claudeAbort = null;  // AbortController for in-flight claude poll

// ── Background poller for follow-up messages ─────────────────
// Picks up outbox messages that arrive OUTSIDE of claudeSubmit()
// (e.g., voice_relay_send() follow-ups after a tool call).
let _bgPolling = false;   // true while background poller is active
let _submitActive = false; // true while claudeSubmit() is running

async function _startBgPoller() {
  if (_bgPolling) return;
  _bgPolling = true;
  while (claudeMode && _bgPolling) {
    // Pause when page is hidden (iOS app switcher) or during active claudeSubmit()
    if (document.hidden || _submitActive) {
      await new Promise(r => setTimeout(r, 1000));
      continue;
    }
    try {
      const resp = await fetch(CLAUDE_DISPATCH_URL + '/poll?wait=5', {
        headers: authHeaders(),
      });
      if (resp.status === 503) {
        // Relay not enabled — back off and retry (server restart, idle timeout, etc.)
        await new Promise(r => setTimeout(r, 10000));
        continue;
      }
      if (!resp.ok) {
        await new Promise(r => setTimeout(r, 5000));
        continue;
      }
      const data = await resp.json();
      if (data.status === 'ok' && data.text) {
        // Follow-up arrived — display and speak it
        const replyText = data.text;
        fullResponse = replyText;

        const wordCount = replyText.trim().split(/\s+/).filter(w => w).length;
        if (wordCount >= LONG_RESPONSE_THRESHOLD) {
          runTerminal(replyText.trim(), () => {});
        } else {
          appendToPanel(replyText);
          enqueueTokens(replyText);
        }

        if (fullVoiceMode) {
          const cleaned = ttsClean(replyText);
          if (cleaned) {
            const sentences = cleaned.match(/[^.!?]+[.!?]+[\s)]*/g) || [cleaned];
            for (let i = 0; i < sentences.length; i++) {
              const s = sentences[i].trim();
              if (s) speakWithSamaritan(s, false, i === sentences.length - 1);
            }
          }
        }
      }
    } catch (e) {
      // Network error — back off then retry
      await new Promise(r => setTimeout(r, 5000));
    }
  }
  _bgPolling = false;
}

function _stopBgPoller() {
  _bgPolling = false;
}

async function claudeSubmit(text) {
  // Cancel any in-flight claude poll from a prior turn
  if (_claudeAbort) { _claudeAbort.abort(); _claudeAbort = null; }
  _claudeAbort = new AbortController();
  const signal = _claudeAbort.signal;
  // Submit to Claude Code via voice relay, poll for response, speak it
  _submitActive = true;
  isStreaming = true;
  resetTtsPipeline();   // clear stale _ttsBusy state from prior cycle
  nextPlayAt = 0;       // reset audio scheduling baseline
  isSpeaking = false;   // clear stale speaking flag
  wordQueue = [];
  fullResponse = '';
  showLoader(true);
  responsePanel.textContent = '';
  responsePanel.classList.remove('active');
  showTerminal(false);

  // Auto-start Claude if not running (no relay dependency — just check tmux)
  const relayOk = await _ensureClaudeUp('default');
  if (!relayOk) {
    flashError('Claude offline — try #mode claude again');
    isStreaming = false;
    showLoader(false);
    return;
  }

  setStatus('CLAUDE THINKING', true);

  try {
    // 0. Photo handling: manual snap, auto-capture trigger, or deferred save
    let claudeText = text;
    const capturedPhoto = pendingPhoto;
    const eagerAnalysis = pendingAnalysis;

    // Check for deferred save command ("save that photo")
    if (matchesTrigger(text, PHOTO_SAVE_TRIGGERS) && lastAnalyzedPhoto) {
      console.log('[camera] claude: deferred save triggered');
      uploadPhotoToDrive(lastAnalyzedPhoto.b64, 'auto').catch(e => console.error('[camera] claude deferred Drive upload error:', e));
      lastAnalyzedPhoto = null;
    } else if (matchesTrigger(text, PHOTO_REANALYZE_TRIGGERS) && (lastUploadedPhoto || lastAnalyzedPhoto)) {
      // Re-analyze last photo with a different mode inferred from trigger phrase
      const rePhoto = lastUploadedPhoto || lastAnalyzedPhoto;
      let reMode = photoMode;
      const lowerText = text.toLowerCase();
      if (matchesTrigger(text, PHOTO_OCR_TRIGGERS) || /\bread\b/.test(lowerText) || /\bocr\b/.test(lowerText) || /\btext\b/.test(lowerText)) reMode = 'ocr';
      else if (matchesTrigger(text, PHOTO_REASON_TRIGGERS) || /\breason\b/.test(lowerText) || /\banalyze\b/.test(lowerText)) reMode = 'reason';
      const isVoice = voiceMode || fullVoiceMode;
      const prompt = reMode === 'scene' ? getPhotoPrompt(isVoice) : PHOTO_MODE_PROMPTS[reMode];
      setStatus(PHOTO_MODE_STATUS[reMode], true);
      const analysis = await analyzePhoto(rePhoto.b64, prompt);
      claudeText = `[${PHOTO_MODE_TAG[reMode]} (re-analysis): ${analysis}]\n\n${text}`;
      console.log(`[camera] claude: re-analysis in ${reMode} mode`);
    } else if (capturedPhoto && capturedPhoto.source !== 'auto') {
      // Manual snap: use eager analysis (already ran with current photoMode prompt)
      clearPendingPhoto();
      let analysis;
      if (eagerAnalysis) {
        setStatus('WAITING FOR PHOTO ANALYSIS', true);
        analysis = await eagerAnalysis;
      } else {
        const isVoice = voiceMode || fullVoiceMode;
        setStatus(PHOTO_MODE_STATUS[photoMode], true);
        analysis = await analyzePhoto(capturedPhoto.b64, getPhotoPrompt(isVoice));
      }
      claudeText = `[${PHOTO_MODE_TAG[photoMode]}: ${analysis}]\n\n${text}`;
      lastUploadedPhoto = { b64: capturedPhoto.b64 };
      console.log('[camera] claude manual snap attached (Drive upload already fired on capture)');
    } else if (capturedPhoto && capturedPhoto.source === 'auto' && (
        matchesTrigger(text, PHOTO_ANALYZE_TRIGGERS) || matchesTrigger(text, PHOTO_OCR_TRIGGERS) || matchesTrigger(text, PHOTO_REASON_TRIGGERS)
    )) {
      // Auto-capture with trigger phrase — voice triggers override button mode upward
      clearPendingPhoto();
      let effectiveMode = photoMode;
      if (matchesTrigger(text, PHOTO_OCR_TRIGGERS)) effectiveMode = 'ocr';
      else if (matchesTrigger(text, PHOTO_REASON_TRIGGERS)) effectiveMode = 'reason';
      const isVoice = voiceMode || fullVoiceMode;
      const prompt = effectiveMode === 'scene' ? getPhotoPrompt(isVoice) : PHOTO_MODE_PROMPTS[effectiveMode];
      setStatus(PHOTO_MODE_STATUS[effectiveMode], true);
      const analysis = await analyzePhoto(capturedPhoto.b64, prompt);
      claudeText = `[${PHOTO_MODE_TAG[effectiveMode]}: ${analysis}]\n\n${text}`;
      lastAnalyzedPhoto = { b64: capturedPhoto.b64 };
      console.log(`[camera] claude: auto-capture ${effectiveMode} (button=${photoMode}), stashed for deferred save`);
