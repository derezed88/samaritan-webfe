    } else if (capturedPhoto && capturedPhoto.source === 'auto') {
      console.log('[camera] claude: auto-capture ignored (no trigger phrase)');
    }

    // 1. Submit to Claude via tmux dispatch (include emotion + location metadata)
    const submitBody = { text: claudeText, source: 'voice' };
    if (window._xaiSttEmotion) {
      submitBody.emotion = window._xaiSttEmotion;
      window._xaiSttEmotion = null;  // consume once
      console.log('[claudeSubmit] emotion attached:', submitBody.emotion);
    } else {
      console.log('[claudeSubmit] no emotion metadata available');
    }
    const _loc = _locationData();
    if (_loc) {
      submitBody.location = _loc;
      console.log('[claudeSubmit] location attached:', submitBody.location);
    }
    console.log('[claudeSubmit] body:', JSON.stringify(submitBody).slice(0, 300));
    let submitResp;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        submitResp = await fetch(CLAUDE_DISPATCH_URL + '/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify(submitBody),
        });
        break;
      } catch (e) {
        if (attempt === 0) { console.warn('[claudeSubmit] submit network error, retrying:', e.message); await new Promise(r => setTimeout(r, 1000)); }
        else throw e;
      }
    }
    if (!submitResp.ok) throw new Error('Dispatch submit failed: ' + submitResp.status);

    // 2. Long-poll for response (up to 60s with retries)
    setStatus('CLAUDE RESPONDING', true);
    showLoader(false);
    let response = null;
    const deadline = Date.now() + 60000;
    while (!response && Date.now() < deadline && !signal.aborted) {
      try {
        const pollResp = await fetch(CLAUDE_DISPATCH_URL + '/poll?wait=10', {
          headers: authHeaders(),
          signal,
        });
        const pollData = await pollResp.json();
        if (pollData.status === 'ok') {
          response = pollData;
          break;
        }
      } catch (pollErr) {
        // Network error (Pinggy drop) — retry unless deadline or aborted
        console.warn('[claudeSubmit] poll network error, retrying:', pollErr.message);
      }
    }

    if (!response) {
      flashError('Claude did not respond in time');
      return;
    }

    // 3. Display + speak response
    const replyText = response.text;
    fullResponse = replyText;

    const wordCount = replyText.trim().split(/\s+/).filter(w => w).length;
    if (wordCount >= LONG_RESPONSE_THRESHOLD) {
      // Long response — use terminal typewriter (same as normal mode)
      runTerminal(replyText.trim(), () => {});
    } else {
      // Short response — word-flash animation
      appendToPanel(replyText);
      enqueueTokens(replyText);
    }

    if (fullVoiceMode) {
      // Resume AudioContext before TTS — it may have been suspended during
      // the long-poll wait (iOS Safari suspends after ~seconds of inactivity)
      initAudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') {
        await audioCtx.resume().catch(() => {});
      }
      // Split into sentences and clean markdown before sending to TTS
      // (Inworld truncates long single-call text; raw markdown breaks TTS)
      const cleaned = ttsClean(replyText);
      if (cleaned) {
        const sentences = cleaned.match(/[^.!?]+[.!?]+[\s)]*/g) || [cleaned];
        for (let i = 0; i < sentences.length; i++) {
          const s = sentences[i].trim();
          if (s) speakWithSamaritan(s, false, i === sentences.length - 1);
        }
      } else {
        speakWithSamaritan('', false, true);  // signal done
      }
    }

  } catch (e) {
    flashError('Claude relay error: ' + e.message);
    console.error('[claude-relay]', e);
  } finally {
    _submitActive = false;
    isStreaming = false;
    isSpeaking = false;  // clear in case TTS path didn't complete cleanly
    showLoader(false);
    setStatus(claudeMode ? 'CLAUDE MODE' : 'IDLE', claudeMode);
    sendBtn.disabled = false;
    // Restart mic if voice mode is active and TTS isn't going to handle it
    if (!fullVoiceMode && voiceMode && micMode !== 'off' && !isListening) {
      setTimeout(() => {
        if (!isStreaming && !isListening) {
          getActiveProvider()?.start();
        }
      }, 500);
    }
  }
}

// ── Keyword card engine ───────────────────────────────────────
// Scans completed response text for KEYWORD: sentences,
// builds typed cards, stacks them on the right, cycles if > 3.

let cardCycleTimer = null;

function buildCardHTML(type, keyword, body) {
  switch (type) {
    case 'initiative':
      return `<div class="kw-card kw-initiative">
        <div class="kw-title-bar">SAMARITAN</div>
        <div class="kw-label-row">
          <span class="kw-keyword-badge">${keyword}</span>
        </div>
        <div class="kw-body" data-typetext="${escAttr(body)}"></div>
        <div class="kw-footer-bar"></div>
      </div>`;

    case 'asset':
      return `<div class="kw-card kw-asset">
        <div class="kw-title-bar">SUBJECT IDENTIFIED</div>
        <div class="kw-subtitle-row">
          <span class="kw-subtitle-label">DESIGNATION:</span>
          <span class="kw-keyword-badge">ASSET</span>
        </div>
        <div class="kw-content" data-typetext="${escAttr(body)}"></div>
      </div>`;

    case 'task':
      return `<div class="kw-card kw-task">
        <div class="kw-title-bar">SAMARITAN</div>
        <div class="kw-subtitle-row">
          <span class="kw-subtitle-label">TASK:</span>
          <span class="kw-keyword-badge">DIRECTIVE</span>
        </div>
        <div class="kw-content" data-typetext="${escAttr(body)}"></div>
      </div>`;

    case 'threat':
      return `<div class="kw-card kw-threat">
        <div class="kw-deviant-bar">
          <span class="kw-deviant-icon"></span>
          <span>/// DEVIANT ///</span>
        </div>
        <div class="kw-title-bar">PRIMARY THREAT</div>
        <div class="kw-rows">
          <div class="kw-row">
            <span class="kw-row-label">PROJECTION</span>
            <span class="kw-row-value">THREAT</span>
          </div>
          <div class="kw-row">
            <span class="kw-row-label">CONCLUSION</span>
            <span class="kw-row-value">ELIMINATE</span>
          </div>
        </div>
        <div class="kw-content" data-typetext="${escAttr(body)}"></div>
      </div>`;

    default: return '';
  }
}

function escAttr(str) {
  return str.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function typeIntoEl(el, text, charDelay, onDone) {
  let i = 0;
  el.textContent = '';
  function tick() {
    if (i < text.length) {
      el.textContent += text[i++];
      setTimeout(tick, charDelay);
    } else {
      if (onDone) onDone();
    }
  }
  tick();
}

function parseKeywordCards(text) {
  // Split the response on any recognised keyword (case-insensitive).
  // Each segment after a keyword is that keyword's body text.
  const keys = Object.keys(KEYWORD_CARDS);
  if (!keys.length) return [];

  // Build a splitter that captures the keyword token
  const splitter = new RegExp(
    '(' + keys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')',
    'i'
  );

  const parts = text.split(splitter);
  // parts = [pre, KW1, body1, KW2, body2, ...]
  const cards = [];
  for (let i = 1; i < parts.length - 1; i += 2) {
    const kw   = parts[i].toUpperCase().trim();
    const body = (parts[i + 1] || '').trim().replace(/\s+/g, ' ');
    if (body && KEYWORD_CARDS[kw]) {
      cards.push({ type: KEYWORD_CARDS[kw].type, keyword: kw, body });
    }
  }
  return cards;
}

function showCardGroup(cardEls, groupIdx, allGroups) {
  // Hide all cards cleanly — remove inline styles so CSS base state takes over
  cardEls.forEach(el => {
    el.classList.remove('visible');
    el.classList.remove('shown');
    el.style.transform = '';
    el.style.opacity   = '';
  });

  // Show current group: add 'shown' (display:block), force reflow, then add 'visible' to trigger transition
  const group = allGroups[groupIdx];
  group.forEach((el, i) => {
    setTimeout(() => {
      el.classList.add('shown');
      // Force reflow so browser registers the display:block before the opacity/transform transition
      void el.offsetWidth;
      el.classList.add('visible');

      // Start typewriter after card is visible
      const bodyEl = el.querySelector('[data-typetext]');
      if (bodyEl && !bodyEl._typed) {
        bodyEl._typed = true;
        typeIntoEl(bodyEl, bodyEl.getAttribute('data-typetext'), TERMINAL_CHAR_DELAY_MS, null);
      }
    }, i * 150);
  });

  // Schedule next group if cycling
  if (allGroups.length > 1) {
    cardCycleTimer = setTimeout(() => {
      const next = (groupIdx + 1) % allGroups.length;
      showCardGroup(cardEls, next, allGroups);
    }, CARD_CYCLE_DELAY_MS);
  }
}

function renderKeywordCards(cards) {
  clearTimeout(cardCycleTimer);
  cardStack.innerHTML = '';
  if (!cards.length) return;

  // Build DOM elements
  const cardEls = cards.map(c => {
    const tmp = document.createElement('div');
    tmp.innerHTML = buildCardHTML(c.type, c.keyword, c.body);
    return tmp.firstElementChild;
  });

  cardEls.forEach(el => cardStack.appendChild(el));

  // Group into sets of 3 and cycle
  const groups = [];
  for (let i = 0; i < cardEls.length; i += 3) {
    groups.push(cardEls.slice(i, i + 3));
  }
  showCardGroup(cardEls, 0, groups);
}

function clearKeywordCards() {
  clearTimeout(cardCycleTimer);
  cardStack.innerHTML = '';
}

function showIdle(show) {
  idleEl.style.display = show ? 'block' : 'none';
}

function showLoader(show, statusText) {
  loaderEl.classList.toggle('active', show);
  const statusEl = document.getElementById('loader-status');
  if (statusEl) statusEl.textContent = statusText || '';
}

// ── Terminal display (long responses) ────────────────────────
function showTerminal(show) {
  terminalPanel.classList.toggle('active', show);
  if (!show) {
    terminalText.textContent = '';
    terminalCursor.style.display = 'none';
  } else {
    terminalCursor.style.display = 'inline-block';
  }
}

let terminalAnimating = false;

function runTerminal(text, onDone) {
  terminalAnimating = true;
  terminalText.textContent = '';
  terminalCursor.style.display = 'inline-block';
  showIdle(false);
  showTerminal(true);

  // Hide the word-flash area while terminal is active
  wordDisplay.classList.remove('visible');
  wordDisplay.textContent = '';
  wordRule.style.width = '0';

  let i = 0;
  function tick() {
    if (i < text.length) {
      terminalText.textContent += text[i++];
      // Auto-scroll to bottom as text grows
      terminalPanel.scrollTop = terminalPanel.scrollHeight;
      setTimeout(tick, TERMINAL_CHAR_DELAY_MS);
    } else {
      // Finished — leave cursor blinking, call done callback
      terminalAnimating = false;
      if (onDone) onDone();
    }
  }
  tick();
}

function showIdleScreen() {
  // Only activate idle screen when nothing is happening
  if (isStreaming || wordAnimating || wordQueue.length > 0) return;
  wordDisplay.classList.remove('visible');
  wordDisplay.textContent = '';
  wordRule.style.width = '0';
  responsePanel.textContent = '';
  responsePanel.classList.remove('active');
  fullResponse = '';
  showTerminal(false);   // clear terminal when idle screen takes over
  clearKeywordCards();
  // blink removed — CONNECTION ESTABLISHED stays static
  showIdle(true);
  setStatus('STANDBY', false);
}

function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleEl.classList.remove('blink');
  idleTimer = setTimeout(showIdleScreen, IDLE_TIMEOUT_SEC * 1000);
}

// ── Word-by-word animation ────────────────────────────────────
//  Samaritan shows ONE word at a time, center screen.
//  Each word fades in, holds, fades out, then next word.
const WORD_FADE   = 180;   // ms opacity transition (set in CSS)
const WORD_HOLD   = 380;   // ms visible hold per word
const WORD_GAP    = 60;    // ms between words

function flashWord(word) {
  return new Promise(resolve => {
    wordDisplay.textContent = word;
    wordRule.style.width = Math.min(word.length * 22, 600) + 'px';
    // Force reflow then fade in
    void wordDisplay.offsetWidth;
    wordDisplay.classList.add('visible');

    setTimeout(() => {
      wordDisplay.classList.remove('visible');
      setTimeout(resolve, WORD_FADE + WORD_GAP);
    }, WORD_HOLD);
  });
}

async function drainWordQueue() {
  if (wordAnimating) return;
  wordAnimating = true;
  showIdle(false);

  while (wordQueue.length > 0) {
    const word = wordQueue.shift();
    if (word.trim()) {
      await flashWord(word.trim());
    }
  }

  // After queue empty — if still streaming, wait for more
  if (isStreaming) {
    // Brief pause then check again
    await new Promise(r => setTimeout(r, 80));
    if (wordQueue.length > 0) {
      wordAnimating = false;
      drainWordQueue();
      return;
    }
  }

  wordAnimating = false;
  if (!isStreaming) {
    wordDisplay.textContent = '';
    wordRule.style.width = '0';
    // Do NOT show idle here — timer fires after IDLE_TIMEOUT_SEC
  }
}

function enqueueTokens(text) {
  // Split incoming text into words (preserving non-space chunks)
  const words = text.split(/(\s+)/).filter(w => w.trim().length > 0);
  wordQueue.push(...words);
  if (!wordAnimating) {
    drainWordQueue();
  }
}

// ── Response panel (accumulated text history) ────────────────
function appendToPanel(text) {
  fullResponse += text;
  // Don't show panel yet — revealed after animation drains or terminal takes over
}

// ── xAI Realtime Voice (TTS) ─────────────────────────────────
/// ── TTS Engine ───────────────────────────────────────────────
// Hybrid approach: llmem-gw handles all reasoning/memory/tools (SSE flow),
// then the completed response text is sent to the TTS provider for audio.
// Switch providers by changing TTS_PROVIDER in the config block above.
//
// To add a new provider, add an entry to ttsProviders below implementing:
//   speak(text, clientSecret, onDone, onError) — start streaming audio
//   stop()                                      — abort any in-progress audio

let audioCtx      = null;  // Web Audio context (created on first user gesture)
let nextPlayAt    = 0;     // AudioContext time for next scheduled PCM chunk
const activeSrcs  = new Set(); // all scheduled BufferSource nodes (for barge-in stop)

// PCM16-LE bytes → AudioBuffer
function pcmBytesToAudioBuf(bytes, sampleRate) {
  const samples = bytes.length / 2;
  const buf  = audioCtx.createBuffer(1, samples, sampleRate);
  const data = buf.getChannelData(0);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  for (let i = 0; i < samples; i++) {
    data[i] = view.getInt16(i * 2, true) / 32768;
  }
  return buf;
}

// PCM16-LE base64 → AudioBuffer for Web Audio API (shared across providers)
function pcm16Base64ToFloat32(b64, sampleRate) {
  const bin   = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return pcmBytesToAudioBuf(bytes, sampleRate);
}

// Schedule an AudioBuffer for gapless sequential playback (shared across providers).
// Returns the wall-clock ms until playback of this buffer completes (for onDone timing).
// Queue of AudioBuffers that arrived while AudioContext was resuming
let _pendingChunks = [];
let _resumingCtx = false;

function scheduleAudioChunk(audioBuf) {
  if (!audioCtx) return 0;
  // iOS Safari can suspend AudioContext mid-session; queue chunks until resumed
  if (audioCtx.state === 'suspended') {
    _pendingChunks.push(audioBuf);
    if (!_resumingCtx) {
      _resumingCtx = true;
      audioCtx.resume().then(() => {
        _resumingCtx = false;
        // Drain queued chunks now that context is running
        while (_pendingChunks.length > 0) {
          _scheduleChunk(_pendingChunks.shift());
        }
      }).catch(() => { _resumingCtx = false; _pendingChunks = []; });
    }
    return 0;
  }
  return _scheduleChunk(audioBuf);
}

function _scheduleChunk(audioBuf) {
  const src = audioCtx.createBufferSource();
  src.buffer = audioBuf;
  src.connect(audioCtx.destination);
  const startAt = nextPlayAt > audioCtx.currentTime
    ? nextPlayAt
    : audioCtx.currentTime + 0.005;
  src.start(startAt);
  nextPlayAt = startAt + audioBuf.duration;
  activeSrcs.add(src);
  src.onended = () => activeSrcs.delete(src);
  // Return ms from now until this chunk finishes playing
  return (startAt + audioBuf.duration - audioCtx.currentTime) * 1000;
}

// Stop all scheduled/playing audio immediately — used for barge-in.
function stopAllAudio() {
  nextPlayAt = 0;
  for (const src of activeSrcs) {
    try { src.stop(); } catch (_) {}
  }
  activeSrcs.clear();
}

// ── Provider registry ─────────────────────────────────────────
const ttsProviders = {

  // ── Deepgram Aura TTS (HTTP streaming PCM) ──────────────────
  // Server proxies to api.deepgram.com/v1/speak — returns raw PCM16-LE at 24kHz.
  // Each chunk of bytes is fed directly to pcmBytesToAudioBuf and scheduled
  // for gapless playback as it arrives (same pattern as Inworld).
  deepgram: {
    _abortCtrl: null,

    speak(text, _clientSecret, onDone, onError) {
      this._abortCtrl = new AbortController();
      const signal = this._abortCtrl.signal;

      (async () => {
        let resp;
        try {
          resp = await fetch('/api/tts/deepgram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHeaders() },
            body: JSON.stringify({ text, model: DEEPGRAM_TTS_MODEL }),
            signal,
          });
        } catch (e) {
          if (e.name !== 'AbortError') onError('deepgram: ' + e.message.slice(0, 30));
          return;
        }
        if (!resp.ok) { onError('deepgram http ' + resp.status); return; }

        // Read streaming PCM16-LE chunks — each chunk is raw samples at 24kHz.
        // Feed directly to pcmBytesToAudioBuf (same helper used by xAI and Inworld).
        const reader = resp.body.getReader();
        let lastChunkEndMs = 0;
        let gotAny = false;
        let errored = false;
        // PCM16 must be fed in even byte counts (2 bytes per sample).
        // Buffer a trailing odd byte across reads.
        let leftover = null;

        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            let bytes = value;
            // Prepend any leftover byte from previous chunk
            if (leftover) {
              const merged = new Uint8Array(leftover.length + bytes.length);
              merged.set(leftover);
              merged.set(bytes, leftover.length);
              bytes = merged;
              leftover = null;
            }
            // If odd number of bytes, save the last byte for next iteration
            if (bytes.length % 2 !== 0) {
              leftover = bytes.subarray(bytes.length - 1);
              bytes = bytes.subarray(0, bytes.length - 1);
            }
            if (bytes.length >= 2) {
              lastChunkEndMs = scheduleAudioChunk(pcmBytesToAudioBuf(bytes, 24000));
              gotAny = true;
            }
          }
        } catch (e) {
          if (e.name !== 'AbortError') { onError('deepgram stream: ' + e.message.slice(0, 30)); errored = true; }
        }

        if (errored || !gotAny) { if (!errored) onError('deepgram: no audio'); return; }
        setTimeout(onDone, lastChunkEndMs + 150);
      })();
    },

    stop() {
      if (this._abortCtrl) { this._abortCtrl.abort(); this._abortCtrl = null; }
      stopAllAudio();
    },
  },

  // ── xAI Realtime API ───────────────────────────────────────
  xai: {
    _ws: null,
    _clientSecret: null,   // ephemeral token for this response
    _cachedVtok:   null,   // pre-fetched token from SSE vtok event

    // Fetch (or reuse cached) ephemeral token. Returns token string or null.
    async _getToken() {
      if (this._clientSecret) return this._clientSecret;
      if (this._cachedVtok) {
        const j = this._cachedVtok; this._cachedVtok = null;
        this._clientSecret = j.client_secret?.value || j.value || j.token;
        if (this._clientSecret) return this._clientSecret;
      }
      try {
        const r = await fetch('/api/voice-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ expires_in: 120 }),
        });
        if (r.ok) {
          const j = await r.json();
          this._clientSecret = j.client_secret?.value || j.value || j.token;
        }
      } catch (_) {}
      return this._clientSecret || null;
    },

    speak(text, _unused, onDone, onError) {
      (async () => {
        const clientSecret = await this._getToken();
        if (!clientSecret) { onError('voice token failed'); return; }
        this._speakWithToken(text, clientSecret, onDone, onError);
      })();
    },

    _speakWithToken(text, clientSecret, onDone, onError) {
      // Voice names must be capitalized per xAI docs (Eve, Ara, Rex, Sal, Leo)
      const voiceName = XAI_VOICE.charAt(0).toUpperCase() + XAI_VOICE.slice(1).toLowerCase();
      let ws;
      try {
        ws = new WebSocket('wss://api.x.ai/v1/realtime',
                           [`xai-client-secret.${clientSecret}`]);
      } catch (e) {
        onError('ws: ' + e.message.slice(0, 40));
        return;
      }
      this._ws = ws;

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: 'session.update',
          session: {
            modalities: ['audio'],
            voice: voiceName,
            output_audio_format: 'audio/pcm',
            turn_detection: null,
          },
        }));
        // "Say this: <text>" — direct command, prevents LLM paraphrasing
        ws.send(JSON.stringify({
          type: 'conversation.item.create',
          item: {
            type: 'message', role: 'user',
            content: [{ type: 'input_text', text: `Say this: ${text}` }],
          },
        }));
        ws.send(JSON.stringify({
          type: 'response.create',
          response: { modalities: ['audio'] },
        }));
      };

      ws.onmessage = (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch (_) { return; }
        switch (msg.type) {
          case 'response.output_audio.delta':
            if (msg.delta) {
              try { scheduleAudioChunk(pcm16Base64ToFloat32(msg.delta, 24000)); }
              catch (e) { onError('pcm: ' + e.message.slice(0, 25)); }
            }
            break;
          case 'response.done':
            ws.close(); this._ws = null; onDone(); break;
          case 'error':
            ws.close(); this._ws = null;
            onError((msg.error?.message || 'voice error').slice(0, 60)); break;
        }
      };

      ws.onerror = () => { this._ws = null; onError('voice ws error'); };

      ws.onclose = (evt) => {
        if (this._ws === ws) this._ws = null;
        if (evt.code !== 1000 && evt.code !== 1005) onError('voice closed: ' + evt.code);
      };
    },

    stop() {
      if (this._ws) { try { this._ws.close(); } catch(_) {} this._ws = null; }
      this._clientSecret = null;
      this._cachedVtok   = null;
      stopAllAudio();
    },
  },

  // ── Inworld TTS (HTTP streaming) ───────────────────────────
  // Server proxies to api.inworld.ai/tts/v1/voice (batch endpoint, returns MP3).
  // clientSecret arg unused — no ephemeral token exchange needed.
  // Inworld streaming TTS — NDJSON stream, each line has base64 audioContent (MP3).
  // Chunks are decoded and scheduled as they arrive for low-latency gapless playback.
  inworld: {
    _abortCtrl: null,

    speak(text, _clientSecret, onDone, onError) {
      this._abortCtrl = new AbortController();
      const signal = this._abortCtrl.signal;

      (async () => {
        let resp;
        for (let _attempt = 0; _attempt < 2; _attempt++) {
          try {
            resp = await fetch('/api/tts/inworld', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...authHeaders() },
              body: JSON.stringify({ text, voice_id: INWORLD_VOICE, model_id: INWORLD_MODEL, speaking_rate: INWORLD_SPEAKING_RATE, temperature: INWORLD_TEMPERATURE }),
              signal,
            });
            break;
          } catch (e) {
            if (e.name === 'AbortError') return;
            if (_attempt === 0) {
              console.warn('[TTS] inworld fetch failed, retrying:', e.message);
              await new Promise(r => setTimeout(r, 500));
            } else {
              onError('inworld: ' + e.message.slice(0, 30));
              return;
            }
          }
        }
        if (!resp.ok) { onError('inworld http ' + resp.status); return; }

        // Read NDJSON stream — each chunk is a self-contained WAV file (RIFF header + PCM16-LE).
        // Strip the 44-byte WAV header and feed raw PCM to pcm16Base64ToFloat32 at 24kHz.
        const WAV_HEADER_BYTES = 44;
        const reader = resp.body.getReader();
        const txtDec = new TextDecoder();
        let buf = '';
        let lastChunkEndMs = 0;
        let gotAny = false;
        let errored = false;

        const scheduleWavChunk = (b64) => {
          const bin = atob(b64);
          if (bin.length <= WAV_HEADER_BYTES) return;
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          // Slice off the 44-byte WAV header — remaining bytes are raw PCM16-LE at 24kHz
          const pcm = bytes.subarray(WAV_HEADER_BYTES);
          lastChunkEndMs = scheduleAudioChunk(pcmBytesToAudioBuf(pcm, 24000));
          gotAny = true;
        };

        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += txtDec.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
              const t = line.trim();
              if (!t) continue;
              try {
                const chunk = JSON.parse(t);
                if (chunk.error) { onError('inworld: ' + String(chunk.error).slice(0, 40)); errored = true; break; }
                const b64 = chunk.result?.audioContent || chunk.audioContent;
                if (b64) scheduleWavChunk(b64);
              } catch (_) {}
            }
            if (errored) break;
          }
        } catch (e) {
          if (e.name !== 'AbortError') onError('inworld stream: ' + e.message.slice(0, 30));
          return;
        }

        if (errored || !gotAny) { if (!errored) onError('inworld: no audio'); return; }
        setTimeout(onDone, lastChunkEndMs + 150);
      })();
    },

    stop() {
      if (this._abortCtrl) { this._abortCtrl.abort(); this._abortCtrl = null; }
      stopAllAudio();
    },
  },

  // ── xAI Realtime API — persistent WebSocket session ────────
  // Same as 'xai' but keeps the WebSocket open across turns to eliminate
  // per-turn handshake overhead (~100-200ms). Token refresh is handled
  // automatically ~30s before expiry. Pairs with samaritan-voice-fast model.
  'xai-persistent': {
    _ws:          null,   // live WebSocket (kept open across turns)
    _tokenExpiry: 0,      // epoch ms when current token expires
    _refreshTimer: null,  // setTimeout handle for proactive refresh
    _pendingQueue: [],    // sentences queued while WS is connecting
    _connecting:  false,  // true while WS handshake in progress
    _currentDone: null,   // onDone callback for the active sentence
    _currentError: null,  // onError callback for the active sentence

    // ── Token / connection management ──────────────────────────
    async _fetchToken() {
      try {
        const r = await fetch('/api/voice-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ expires_in: 120 }),
        });
        if (!r.ok) return null;
        const j = await r.json();
        const secret = j.client_secret?.value || j.value || j.token;
        if (!secret) return null;
        this._tokenExpiry = Date.now() + 90_000; // treat as ~90s to refresh before 120s expiry
        return secret;
      } catch (_) { return null; }
    },

    _scheduleRefresh() {
      if (this._refreshTimer) clearTimeout(this._refreshTimer);
      const msLeft = this._tokenExpiry - Date.now();
      const refreshIn = Math.max(0, msLeft - 30_000); // refresh 30s before expiry
      this._refreshTimer = setTimeout(() => this._reconnect(), refreshIn);
    },

    async _reconnect() {
      // Gracefully replace the WS with a fresh token without dropping pending audio.
      const secret = await this._fetchToken();
      if (!secret) return; // will naturally close and fall back to per-turn xai
      const old = this._ws;
      this._open(secret, () => {
        if (old && old.readyState < 2) old.close(1000, 'token-refresh');
      });
    },

    _open(secret, onReady) {
      this._connecting = true;
      const voiceName = XAI_VOICE.charAt(0).toUpperCase() + XAI_VOICE.slice(1).toLowerCase();
      let ws;
      try {
        ws = new WebSocket('wss://api.x.ai/v1/realtime',
                           [`xai-client-secret.${secret}`]);
      } catch (e) {
        this._connecting = false;
        this._drainQueue('ws open failed: ' + e.message.slice(0, 40));
        return;
      }

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: 'session.update',
          session: {
            modalities: ['audio'],
            voice: voiceName,
            output_audio_format: 'audio/pcm',
            turn_detection: null,
          },
        }));
        this._ws = ws;
        this._connecting = false;
        this._scheduleRefresh();
        if (onReady) onReady();
        this._drainQueue(null);
      };

      ws.onmessage = (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch (_) { return; }
        switch (msg.type) {
          case 'response.output_audio.delta':
            if (msg.delta) {
              try { scheduleAudioChunk(pcm16Base64ToFloat32(msg.delta, 24000)); }
              catch (e) { if (this._currentError) this._currentError('pcm: ' + e.message.slice(0, 25)); }
            }
            break;
          case 'response.done': {
            const cb = this._currentDone;
            this._currentDone = null; this._currentError = null;
            if (cb) cb();
            break;
          }
          case 'error': {
            const cb = this._currentError;
            this._currentDone = null; this._currentError = null;
            if (cb) cb((msg.error?.message || 'voice error').slice(0, 60));
            break;
          }
        }
      };

      ws.onerror = () => {
        if (this._ws === ws) { this._ws = null; this._connecting = false; }
        this._drainQueue('voice ws error');
      };

      ws.onclose = (evt) => {
        if (this._ws === ws) { this._ws = null; this._connecting = false; }
        if (evt.code !== 1000 && evt.code !== 1005 && this._currentError) {
          const cb = this._currentError;
          this._currentDone = null; this._currentError = null;
          cb('voice closed: ' + evt.code);
        }
      };
    },

    _drainQueue(err) {
      // Only used to flush the single sentence queued during WS connection setup.
      // Once connected, speak() calls _sendSentence directly (outer _ttsFlush serialises).
      if (err) {
        for (const item of this._pendingQueue) item.onError(err);
        this._pendingQueue = [];
        return;
      }
      const item = this._pendingQueue.shift();
      if (item) this._sendSentence(item.text, item.onDone, item.onError);
    },

    _sendSentence(text, onDone, onError) {
      this._currentDone  = onDone;
      this._currentError = onError;
      this._ws.send(JSON.stringify({
        type: 'conversation.item.create',
        item: { type: 'message', role: 'user',
                content: [{ type: 'input_text', text: `Say this: ${text}` }] },
      }));
      this._ws.send(JSON.stringify({
        type: 'response.create',
        response: { modalities: ['audio'] },
      }));
    },

    // ── Public API ─────────────────────────────────────────────
    speak(text, _unused, onDone, onError) {
      // Outer _ttsFlush guarantees speak() is only called when xAI is idle,
      // so we can send directly if the WS is open. Queue only during connection setup.
      if (this._ws && this._ws.readyState === WebSocket.OPEN) {
        this._sendSentence(text, onDone, onError);
        return;
      }
      // WS not yet open — queue this sentence and open if not already connecting
      this._pendingQueue.push({ text, onDone, onError });
      if (!this._connecting) {
        (async () => {
          const secret = await this._fetchToken();
          if (!secret) { this._drainQueue('voice token failed'); return; }
          this._open(secret, null);
        })();
      }
      // else: connecting — _drainQueue called from ws.onopen
    },

    // Pre-open the persistent connection (call on provider selection or page load)
    async prefetch() {
      if (this._ws && this._ws.readyState < 2) return; // already open/connecting
      if (this._connecting) return;
      const secret = await this._fetchToken();
      if (secret) this._open(secret, null);
    },

    stop() {
      // Do NOT close the persistent WS — only stop current audio playback.
      // The connection stays alive for the next turn.
      if (this._currentDone)  { this._currentDone  = null; }
      if (this._currentError) { this._currentError = null; }
      this._pendingQueue = [];
      stopAllAudio();
    },

    // Tear down fully (called when switching away from this provider)
    destroy() {
      if (this._refreshTimer) { clearTimeout(this._refreshTimer); this._refreshTimer = null; }
      if (this._ws) { try { this._ws.close(1000, 'provider-change'); } catch (_) {} this._ws = null; }
      this._connecting  = false;
      this._pendingQueue = [];
      this._currentDone  = null;
      this._currentError = null;
      stopAllAudio();
    },
  },

};

// ── Wire voice provider button (after ttsProviders is defined) ───────────────
(function() {
  const PROVIDER_LABELS = { deepgram: 'D', inworld: 'I', xai: 'X', 'xai-persistent': 'XP' };
  const PROVIDER_TITLES = {
    deepgram: 'TTS: Deepgram Aura — tap to switch',
    inworld: 'TTS: Inworld — tap to switch',
    xai: 'TTS: xAI (per-turn) — tap to switch',
    'xai-persistent': 'TTS: xAI persistent (low-latency) — tap to switch',
  };

  function updateVoiceProviderBtn() {
    voiceProviderBtn.textContent = PROVIDER_LABELS[TTS_PROVIDER] ?? TTS_PROVIDER[0].toUpperCase();
    voiceProviderBtn.title = PROVIDER_TITLES[TTS_PROVIDER] ?? `TTS: ${TTS_PROVIDER} — tap to switch`;
    voiceProviderBtn.classList.toggle('xai-persistent', TTS_PROVIDER === 'xai-persistent');
  }

  // Send a silent model-switch command to llmem-gw without disrupting the UI.
  // Skips if a response is currently streaming to avoid collision.
  function sendModelSwitch(modelKey) {
    if (!modelKey || isStreaming) return;
    fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text: `!model ${modelKey}`, client_id: SESSION_ID }),
    }).then(() => {
      // Drain the resulting SSE stream silently so llmem-gw doesn't stall
      const evtSrc = new EventSource(authedUrl(`/api/stream/${SESSION_ID}`));
      evtSrc.onmessage = (e) => {
        try { if (JSON.parse(e.data).type === 'done') evtSrc.close(); } catch (_) {}
      };
      evtSrc.onerror = () => evtSrc.close();
    }).catch(() => {});
  }

  const providerOrder = ['inworld', 'deepgram', 'xai', 'xai-persistent'];
  updateVoiceProviderBtn();

  voiceProviderBtn.addEventListener('click', () => {
    const prev = TTS_PROVIDER;
    const idx = providerOrder.indexOf(TTS_PROVIDER);
    TTS_PROVIDER = providerOrder[(idx + 1) % providerOrder.length];
    updateVoiceProviderBtn();
    if (fullVoiceMode) initAudioCtx();

    // Tear down persistent WS when leaving xai-persistent
    if (prev === 'xai-persistent' && TTS_PROVIDER !== 'xai-persistent') {
      ttsProviders['xai-persistent'].destroy();
      // No auto return-model switch — it caused llmem-gw to create a new session
      // if the in-memory session was evicted between turns. Model stays as-is;
      // user can switch manually with !model if needed.
    }
    // Pre-open persistent WS when entering xai-persistent
    if (TTS_PROVIDER === 'xai-persistent') {
      ttsProviders['xai-persistent'].prefetch();
      if (XAI_PERSISTENT_MODEL) sendModelSwitch(XAI_PERSISTENT_MODEL);
    }
  });
})();

// ── ttsClean — strip markdown/markers before sending text to TTS ──
function ttsClean(t) {
  return t
    .replace(/<<[^>]*>>\s*(?::\s*)?/g, '') // <<topic>> routing tags
    .replace(/\[thinking[^\]]*\]/gi, '')   // [thinking…] markers
    .replace(/\[[^\]]*[▶◀][^\]]*\]/g, '')  // [tool ▶ name] and [tool ◀ result]
    .replace(/#{1,6}\s*/g, '')             // markdown headings
    .replace(/\*{1,3}([^*]*)\*{1,3}/g, '$1')  // bold/italic **x** *x* ***x***
    .replace(/_{1,3}([^_]*)_{1,3}/g, '$1')    // underline/italic __x__ _x_
    .replace(/~~([^~]*)~~/g, '$1')         // strikethrough
    .replace(/`{1,3}[^`]*`{1,3}/g, '')    // inline code and code blocks
    .replace(/'{3}/g, '')                  // triple single-quotes (code fence variant)
    .replace(/^[-*_]{3,}\s*$/gm, '')       // horizontal rules ---, ***, ___ (own line)
    .replace(/\s[-]{3,}\s/g, ' ')          // inline --- sequences
    .replace(/^\s*[-*+]\s+/gm, '')         // unordered list bullets
    .replace(/^\s*\d+\.\s+/gm, '')         // ordered list numbers
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')  // links and images → label only
    .replace(/[|\\]/g, ' ')                // table pipes, backslashes
    .replace(/[—–]/g, ', ')               // em dash, en dash → pause
    .replace(/…/g, '...')                  // ellipsis char → literal dots
    .replace(/[""]/g, '"')                 // smart double quotes → straight
    .replace(/['']/g, "'")                 // smart single quotes → straight apostrophe
    .replace(/&[a-z]+;/gi, ' ')            // HTML entities
    .replace(/[<>]/g, ' ')                 // angle brackets
    .replace(/[^\x20-\x7E\s]/g, ' ')      // strip remaining non-ASCII
    .replace(/\n+/g, ' ')
    .replace(/\s{2,}/g, ' ')               // collapse multiple spaces
    .trim();
}

// ── TTS sentence pipeline ─────────────────────────────────────
// Sentences are queued as they arrive from SSE tok events.
// Each sentence is spoken in order; the next starts as soon as the
// previous finishes (gapless via scheduleAudioChunk / nextPlayAt).
// speakWithSamaritan() is now called once per sentence from the SSE
// tok handler, and once more at 'done' for any remaining buffer.

let _ttsSentenceQueue = [];    // sentences waiting to speak
let _ttsBusy          = false; // true while a provider.speak() is in flight
let _ttsWasKbd        = false; // passed through to waitForDrainThenListen
let _ttsDone          = false; // true after SSE 'done' — no more sentences coming

function _ttsFlush() {
  if (_ttsBusy || _ttsSentenceQueue.length === 0) return;
  const sentence = _ttsSentenceQueue.shift();
  const provider = ttsProviders[TTS_PROVIDER];
  const gen = _ttsGeneration;        // capture generation for stale-callback guard
  _ttsBusy = true;
  isSpeaking = true;
  provider.speak(
    sentence,
    null,
    () => {                          // onDone for this sentence
      if (gen !== _ttsGeneration) return;  // stale callback from prior turn — discard
      _ttsBusy = false;
      if (_ttsSentenceQueue.length > 0) {
        _ttsFlush();                 // speak next sentence immediately
      } else if (_ttsDone) {
        // All sentences spoken and SSE done — poll until Web Audio drains,
        // then clear isSpeaking. Needed for xAI where response.done arrives
        // before all scheduled PCM chunks finish playing.
        (function waitForAudio() {
          if (gen !== _ttsGeneration) return;
          if (activeSrcs.size > 0) {
            setTimeout(waitForAudio, 100);
          } else {
            isSpeaking = false;
            if (micMode === 'speaker' || micMode === 'deepgram-di' || micMode === 'xai') startSpeakerCooldown();
            waitForDrainThenListen(_ttsWasKbd);
          }
        })();
      }
      // else: SSE still streaming — more sentences may arrive, wait
    },
    (err) => {                       // onError for this sentence
      if (gen !== _ttsGeneration) return;  // stale callback from prior turn — discard
      _ttsBusy = false;
      console.warn('[TTS] sentence error:', err, 'remaining queue:', _ttsSentenceQueue.length);
      // Skip failed sentence and continue with remaining queue
      if (_ttsSentenceQueue.length > 0) {
        _ttsFlush();
      } else if (_ttsDone) {
        isSpeaking = false;
        if (micMode === 'speaker' || micMode === 'deepgram-di' || micMode === 'xai') startSpeakerCooldown();
        waitForDrainThenListen(_ttsWasKbd);
      } else {
        isSpeaking = false;
      }
    },
  );
}

async function speakWithSamaritan(sentence, wasKbd, isLast) {
  // If nothing to speak and this is the last sentence, just signal done immediately.
  if (!sentence && isLast && !_ttsBusy && _ttsSentenceQueue.length === 0) {
    _ttsDone = true;
    isSpeaking = false;
    if (micMode === 'speaker' || micMode === 'deepgram-di' || micMode === 'xai') startSpeakerCooldown();
    waitForDrainThenListen(wasKbd);
    return;
  }

  // AudioContext must be pre-unlocked by a user gesture.
  // On iOS Safari, contexts created outside a gesture start suspended.
  // initAudioCtx() handles creation + resume + statechange listener.
  initAudioCtx();

  _ttsWasKbd = wasKbd;
  if (isLast) _ttsDone = true;

  if (!isSpeaking) {
    setStatus('SAMARITAN SPEAKING', true);
    voicePreview.textContent = fullVoiceMode ? 'SAMARITAN SPEAKING…' : 'TAP MIC TO SPEAK';
  }

  if (sentence) _ttsSentenceQueue.push(sentence);
  _ttsFlush();

  // Edge: isLast with empty sentence and queue already drained (silent response)
  if (isLast && !_ttsBusy && _ttsSentenceQueue.length === 0 && !isSpeaking) {
    isSpeaking = false;
    waitForDrainThenListen(wasKbd);
  }
}

// Reset TTS pipeline state at the start of each submit
let _ttsGeneration = 0;  // increments each reset — stale callbacks check this to self-discard
function resetTtsPipeline() {
  // Cancel any in-flight TTS (Inworld fetch or xAI WebSocket)
  const provider = ttsProviders[TTS_PROVIDER];
  if (provider?.stop) provider.stop();  // xAI.stop() also clears its own token state
  _ttsSentenceQueue = [];
  _ttsBusy          = false;
  _ttsDone          = false;
  isSpeaking        = false;
  _ttsGeneration++;
}

// ── Submit ───────────────────────────────────────────────────
async function submit(textOverride) {
  const text = (textOverride || textInput.value).trim();
  if (!text) return;
  // If a prior stream is still open (e.g. after barge-in), force-close it now
  if (activeEvtSource) { activeEvtSource.close(); activeEvtSource = null; isStreaming = false; }
  if (isStreaming) return;

  // Intercept #commands — handle locally, never forward to llmem-gw
  if (text.startsWith('#')) {
    textInput.value = '';
    if (kbdOpen) setTimeout(() => textInput.focus(), 50);
    handleCommand(text);
    return;
  }

  // Claude mode — route to voice relay instead of llmem-gw
  if (claudeMode) {
    textInput.value = '';
    claudeSubmit(text);
    return;
  }

  resetIdleTimer();   // user is active — reset idle countdown
  const wasKbd = kbdOpen;
  textInput.value = '';
  textInput.blur();          // dismiss iOS keyboard immediately
  if (kbdOpen) {
    _micStateBeforeKbd = null;  // don't restore mic — submit flow handles post-response restart
    setKbdMode(false);
  }
  voicePreview.textContent = fullVoiceMode ? 'SAMARITAN VOICE ACTIVE' : 'TAP MIC TO SPEAK';
  isStreaming = true;
  wordQueue   = [];
  fullResponse = '';
  nextPlayAt  = 0;
  resetTtsPipeline();
  responsePanel.textContent = '';
  responsePanel.classList.remove('active');
  showTerminal(false);   // clear any previous long response
  clearKeywordCards();   // clear any previous keyword cards

  setStatus('PROCESSING', true);
  showIdle(false);
  showLoader(true);
  sendBtn.disabled = true;

  // Prefetch xAI voice token in parallel — only needed for per-turn xAI provider
  if (fullVoiceMode && TTS_PROVIDER === 'xai') {
    fetch('/api/voice-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ expires_in: 120 }),
    }).then(r => r.ok ? r.json() : null)
      .then(j => { if (j) ttsProviders.xai._cachedVtok = j; })
      .catch(() => {});
  }
  // For xai-persistent, ensure the connection is alive (no-op if already open)
  if (fullVoiceMode && TTS_PROVIDER === 'xai-persistent') {
    ttsProviders['xai-persistent'].prefetch();
  }

  try {
    // 0. Photo handling: manual snap, auto-capture trigger, or deferred save
    let submitText = text;
    const capturedPhoto = pendingPhoto;
    const eagerAnalysis = pendingAnalysis;

    // Check for deferred save command ("save that photo")
    if (matchesTrigger(text, PHOTO_SAVE_TRIGGERS) && lastAnalyzedPhoto) {
      console.log('[camera] deferred save triggered, uploading last analyzed photo');
      uploadPhotoToDrive(lastAnalyzedPhoto.b64, 'auto').catch(e => console.error('[camera] deferred Drive upload error:', e));
      lastAnalyzedPhoto = null;
      // Don't attach photo analysis — just pass the save command through as text
    } else if (matchesTrigger(text, PHOTO_REANALYZE_TRIGGERS) && (lastUploadedPhoto || lastAnalyzedPhoto)) {
      // Re-analyze last photo with a different mode inferred from trigger phrase
      const rePhoto = lastUploadedPhoto || lastAnalyzedPhoto;
      let reMode = photoMode;
      const lowerText = text.toLowerCase();
      if (matchesTrigger(text, PHOTO_OCR_TRIGGERS) || /\bread\b/.test(lowerText) || /\bocr\b/.test(lowerText) || /\btext\b/.test(lowerText)) reMode = 'ocr';
      else if (matchesTrigger(text, PHOTO_REASON_TRIGGERS) || /\breason\b/.test(lowerText) || /\banalyze\b/.test(lowerText)) reMode = 'reason';
      const isVoice = voiceMode || fullVoiceMode;
      const prompt = reMode === 'scene' ? getPhotoPrompt(isVoice) : PHOTO_MODE_PROMPTS[reMode];
      setStatus(PHOTO_MODE_STATUS[reMode], true);
      const analysis = await analyzePhoto(rePhoto.b64, prompt);
      submitText = `[${PHOTO_MODE_TAG[reMode]} (re-analysis): ${analysis}]\n\n${text}`;
      console.log(`[camera] re-analysis in ${reMode} mode`);
    } else if (capturedPhoto && capturedPhoto.source !== 'auto') {
      // Manual snap: always analyze and attach, always upload to Drive
      clearPendingPhoto();
      let analysis;
      if (eagerAnalysis) {
        setStatus('WAITING FOR PHOTO ANALYSIS', true);
        analysis = await eagerAnalysis;
      } else {
        const isVoice = voiceMode || fullVoiceMode;
        setStatus(PHOTO_MODE_STATUS[photoMode], true);
        analysis = await analyzePhoto(capturedPhoto.b64, getPhotoPrompt(isVoice));
      }
      submitText = `[${PHOTO_MODE_TAG[photoMode]}: ${analysis}]\n\n${text}`;
      lastUploadedPhoto = { b64: capturedPhoto.b64 };
      console.log('[camera] manual snap attached (Drive upload already fired on capture)');
    } else if (capturedPhoto && capturedPhoto.source === 'auto' && (
        matchesTrigger(text, PHOTO_ANALYZE_TRIGGERS) || matchesTrigger(text, PHOTO_OCR_TRIGGERS) || matchesTrigger(text, PHOTO_REASON_TRIGGERS)
    )) {
      // Auto-capture with trigger phrase — voice triggers override button mode upward
      clearPendingPhoto();
      let effectiveMode = photoMode;
      if (matchesTrigger(text, PHOTO_OCR_TRIGGERS)) effectiveMode = 'ocr';
      else if (matchesTrigger(text, PHOTO_REASON_TRIGGERS)) effectiveMode = 'reason';
      const isVoice = voiceMode || fullVoiceMode;
      const prompt = effectiveMode === 'scene' ? getPhotoPrompt(isVoice) : PHOTO_MODE_PROMPTS[effectiveMode];
      setStatus(PHOTO_MODE_STATUS[effectiveMode], true);
      const analysis = await analyzePhoto(capturedPhoto.b64, prompt);
      submitText = `[${PHOTO_MODE_TAG[effectiveMode]}: ${analysis}]\n\n${text}`;
      lastAnalyzedPhoto = { b64: capturedPhoto.b64 };
      console.log(`[camera] auto-capture ${effectiveMode} (button=${photoMode}), stashed for deferred save`);
    } else if (capturedPhoto && capturedPhoto.source === 'auto') {
      // Auto-capture but no trigger phrase: silently discard, keep frame for next prompt
      console.log('[camera] auto-capture ignored (no trigger phrase)');
    }

    // 1. Submit to llmem-gw via our proxy (retry once — Safari drops first post-load request)
    let submitResp;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        if (attempt > 0) await new Promise(r => setTimeout(r, 600));
        submitResp = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ text: submitText, client_id: SESSION_ID, location: _locationData() }),
        });
        if (submitResp.ok) break;
      } catch (_) { if (attempt === 2) throw new Error('Submit failed after retries'); }
    }
    if (!submitResp?.ok) {
      throw new Error('Submit failed: ' + submitResp?.status);
    }

    showLoader(false);
    setStatus('RECEIVING', true);

    // 2. Open SSE stream — pass token via query param (EventSource can't set headers)
    const evtSource = new EventSource(authedUrl(`/api/stream/${SESSION_ID}`));
    activeEvtSource = evtSource;

    // Use onmessage (unnamed events) for cross-browser compatibility
    let streamDone = false;
    let ttsBuf = '';  // accumulates tok text until a sentence boundary
    const mySessionId = SESSION_ID;  // capture at open time; stale streams self-discard

    // Sentence boundary regex: end of sentence followed by space or end-of-string
    const SENT_RE = /[.!?][)"']?\s+|[.!?][)"']?$/;

    // Strip <<topic>> (optional ": ") prefix from LLM responses (topic-routing schema).
    // Accumulates tokens until the prefix pattern is fully matched or ruled out.
    let _pfxBuf = '';       // pending chars while resolving prefix
    let _pfxDone = false;   // true once prefix strip decision is settled for this turn
    function processToken(raw) {
      if (_pfxDone) { emitToken(raw); return; }
      _pfxBuf += raw;
      // Not a prefix at all — flush immediately
      if (!_pfxBuf.startsWith('<')) {
        _pfxDone = true; emitToken(_pfxBuf); _pfxBuf = ''; return;
      }
      // Try to match one or more <<tag>> prefixes with optional ": " separators
      const m = _pfxBuf.match(/^(<<[^>]*>>\s*(?::\s*)?)+/);
      if (m && m[0].includes('>>')) {
        // Matched — strip all leading tags, emit whatever follows
        _pfxDone = true;
        const rest = _pfxBuf.slice(m[0].length);
        _pfxBuf = '';
        if (rest) emitToken(rest);
        return;
      }
      // Safety valve: if buffer is long but no match yet, flush as-is
      if (_pfxBuf.length > 80) {
        _pfxDone = true; emitToken(_pfxBuf); _pfxBuf = '';
      }
      // Otherwise keep accumulating
    }
    function emitToken(text) {
      if (!text) return;
      appendToPanel(text);
      enqueueTokens(text);
      if (fullVoiceMode) {
        ttsBuf += text;
        // Sentence-level splitting for ALL providers (Inworld truncates long text)
        let m;
        while ((m = SENT_RE.exec(ttsBuf)) !== null) {
          const end = m.index + m[0].length;
          const sentence = ttsClean(ttsBuf.slice(0, end));
          ttsBuf = ttsBuf.slice(end);
          if (sentence) speakWithSamaritan(sentence, wasKbd, false);
        }
      }
    }

    // ttsClean() is now at module level (used by both SSE and claude mode paths)

    function flushTtsBuf(isLast) {
      if (!fullVoiceMode) return;
      const clean = ttsClean(ttsBuf);
      console.log('[TTS] flushTtsBuf isLast=%s busy=%s queue=%d speaking=%s clean=%s',
        isLast, _ttsBusy, _ttsSentenceQueue.length, isSpeaking, clean.slice(0, 60));
      ttsBuf = '';
      if (clean) speakWithSamaritan(clean, wasKbd, isLast);
      else if (isLast) speakWithSamaritan('', wasKbd, true);  // signal done even if nothing to speak
    }

    evtSource.onmessage = (e) => {
      if (streamDone || mySessionId !== SESSION_ID) { evtSource.close(); return; }
      try {
        const data = JSON.parse(e.data);
        if (data.type === 'tok') {
          processToken(data.text || '');
        } else if (data.type === 'flush') {
          // Intermediate checkpoint from llmem-gw (tool call in progress).
          // Intermediate checkpoint — tool round-trip done, final answer coming next.
          // Display tokens, reset TTS buffer (pre-flush content = markers, not speech).
          const token = data.text || '';
          if (token) { appendToPanel(token); enqueueTokens(token); }
          ttsBuf = '';  // discard pre-flush content from TTS (thinking/tool markers)
        } else if (data.type === 'progress') {
          showLoader(true, data.text || 'Still working…');
          if (fullVoiceMode) speakWithSamaritan(data.text || 'Still working…', wasKbd, false);
        } else if (data.type === 'vtok') {
          // xAI voice token pre-delivered over SSE — store directly on xAI provider
          ttsProviders.xai._cachedVtok = data.token;
        } else if (data.type === 'done') {
          streamDone = true;
          evtSource.close(); activeEvtSource = null;
          isStreaming = false;
          showLoader(false);
          sendBtn.disabled = false;

          const kwCards = parseKeywordCards(fullResponse);
          if (kwCards.length) renderKeywordCards(kwCards);

          if (fullVoiceMode) {
            // Flush any remaining buffer as the final sentence
            flushTtsBuf(true);
            wordQueue = [];
            wordAnimating = false;
          } else {
            const wordCount = fullResponse.trim().split(/\s+/).filter(w => w).length;
            if (wordCount >= LONG_RESPONSE_THRESHOLD) {
              wordQueue = [];
              wordAnimating = false;
              runTerminal(fullResponse.trim(), () => waitForDrainThenListen(wasKbd));
            } else {
              waitForDrainThenListen(wasKbd);
            }
          }
        } else if (data.type === 'error') {
          streamDone = true;
          evtSource.close(); activeEvtSource = null;
          isStreaming = false;
          showLoader(false);
          showIdle(false);
          sendBtn.disabled = false;
          flashError(data.message || 'stream error');
          // Always recover mic if voice was active — don't leave UI in dead ERROR state
          if (voiceMode || fullVoiceMode) {
            waitForDrainThenListen(wasKbd);
          } else {
            setStatus('ERROR', false);
          }
        }
      } catch (_) {}
    };

    // Native onerror (connection drop or auto-reconnect)
    evtSource.onerror = () => {
      if (streamDone) return;
      // CLOSED = permanent drop; CONNECTING = browser auto-reconnecting (treat same — abort)
      evtSource.close(); activeEvtSource = null;
      isStreaming = false;
      showLoader(false);
      showIdle(false);
      sendBtn.disabled = false;
      if (voiceMode || fullVoiceMode) {
        waitForDrainThenListen(wasKbd);
      } else {
        setStatus('STANDBY', false);
      }
    };

  } catch (err) {
    isStreaming = false;
    showLoader(false);
    showIdle(false);
    setStatus('ERROR', false);
    sendBtn.disabled = false;
    flashError(err.message || 'unknown error');
  }
}

// ── Event listeners ──────────────────────────────────────────
sendBtn.addEventListener('click', () => { if (fullVoiceMode) initAudioCtx(); submit(); });
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submit();
});

// ── Auto-restart mic after response drains ───────────────────
// Called when the 'done' SSE event fires. Polls until the word
// animation queue is empty, then restarts recognition if in voice mode.
function waitForDrainThenListen(wasKbd) {
  if (wordAnimating || wordQueue.length > 0) {
    setTimeout(() => waitForDrainThenListen(wasKbd), 150);
    return;
  }
  // Queue drained (or terminal finished) — settle UI and start idle countdown
  showIdle(false);     // hide idle message until timeout fires
  // Show accumulated response text now that animation is done (if terminal not active)
  if (!terminalPanel.classList.contains('active') && fullResponse) {
    responsePanel.textContent = fullResponse;
    responsePanel.classList.add('active');
    responsePanel.scrollTop = responsePanel.scrollHeight;
  }
  // Terminal panel intentionally left visible — persists until next submit
  resetIdleTimer();    // idle screen appears only after IDLE_TIMEOUT_SEC of inactivity

  if (fullVoiceMode && !wasKbd && micMode !== 'off' && !micBtn.classList.contains('unsupported')) {
    // Full-voice mode (voice input): wait for audio to finish then reopen mic.
    const audioEndMs = audioCtx
      ? Math.max(0, (nextPlayAt - audioCtx.currentTime) * 1000)
      : 0;
    // In speaker/diarize mode, also wait for the STT cooldown to expire (prevents echo pickup).
    const cooldownMs = (micMode === 'speaker' || micMode === 'deepgram-di' || micMode === 'xai')
      ? Math.max(0, _sttCooldownUntil - Date.now())
      : 0;
    const delayMs = Math.max(audioEndMs + 400, cooldownMs);
    setStatus('STANDBY', false);
    setTimeout(() => {
      nextPlayAt = 0;
      if (!isStreaming && !isListening) {
        voiceMode = true;
        getActiveProvider()?.start();
      }
    }, delayMs);
    return;
  }

  setStatus('STANDBY', false);
  if (wasKbd) {
    // Keyboard mode: reopen input panel so user can type the next message
    setTimeout(() => {
      setKbdMode(true);
      textInput.focus();
    }, 300);
  } else if (voiceMode && !micBtn.classList.contains('unsupported')) {
    // Voice mode: restart mic
    setTimeout(() => {
      if (!isStreaming && !isListening) {
        getActiveProvider()?.start();
      }
    }, 400);
  }
}

// ── Voice Input — STT provider registry ──────────────────────
// Each provider implements: start(), stop()
// Shared state used by both providers:
let isListening = false;

function onSttStart() {
  isListening = true;
  _sttRestartAttempted = false;  // successful start — reset restart guard
  micBtn.classList.add('listening');
  micIcon.textContent = '●';   // listening indicator; mode label restored on stop
  voicePreview.textContent = '…';
  setStatus('LISTENING', true);
}


function onSttPartial(text) {
  voicePreview.textContent = text.toUpperCase().slice(0, 60) || '…';
  // Barge-in: in 'barge' or 'xai-b' mode — stop TTS immediately when speech is heard.
  // Require actual transcript text to avoid false barge-in from ambient noise
  // triggering StartOfTurn with empty/short partials.
  if (isSpeaking && (micMode === 'barge' || micMode === 'xai-b') && text.trim().split(/\s+/).filter(Boolean).length >= STT_BARGE_MIN_WORDS) {
    console.log('[TTS] barge-in triggered:', text.trim().slice(0, 40));
    stopAllAudio();
    resetTtsPipeline();
    // Kill the active SSE stream so onSttFinal's isStreaming guard doesn't block the new submit
    if (activeEvtSource) { activeEvtSource.close(); activeEvtSource = null; }
    isStreaming = false;
    // xAI-b: submit immediately on barge-in — don't wait for response.done
    // which may arrive too late or not at all. Mark submitted so the delayed
    // response.done handler is a no-op.
    if (micMode === 'xai-b') {
      _submittedThisTurn = true;
      if (_fallbackTimer) { clearTimeout(_fallbackTimer); _fallbackTimer = null; }
      setTimeout(() => onSttFinal(text), 0);
    }
  }
}

function beepConfirm() {
  if (!STT_CONFIRM_BEEP) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = STT_BEEP_FREQ_HZ;
    osc.type = 'sine';
    gain.gain.setValueAtTime(STT_BEEP_GAIN, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + STT_BEEP_DURATION_MS / 1000);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + STT_BEEP_DURATION_MS / 1000);
    osc.onended = () => ctx.close();
  } catch (_) {}
}

function beepReady() {
  // Ascending two-tone chime: signals cooldown cleared, mic open in speaker mode
  if (!STT_READY_CHIME) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const noteSec  = STT_READY_CHIME_NOTE_MS / 1000;
    const gapSec   = STT_READY_CHIME_GAP_MS  / 1000;
    [STT_READY_CHIME_FREQ_LO, STT_READY_CHIME_FREQ_HI].forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t0 = ctx.currentTime + i * (noteSec + gapSec);
      gain.gain.setValueAtTime(STT_READY_CHIME_GAIN, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + noteSec);
      osc.start(t0);
      osc.stop(t0 + noteSec);
      if (i === 1) osc.onended = () => ctx.close();
    });
  } catch (_) {}
}

function startSpeakerCooldown() {
  // Called whenever TTS ends in speaker mode — sets cooldown and schedules ready chime
  _sttCooldownUntil = Date.now() + STT_SPEAKER_COOLDOWN_MS;
  setTimeout(beepReady, STT_SPEAKER_COOLDOWN_MS);
}

function onSttFinal(text) {
  const query = text.trim();
  if (!query) return;
  const wordCount = query.split(/\s+/).length;
  // Global minimum word filter — catches ambient noise across all mic modes
  // Barge-in modes use their own lighter filter (STT_BARGE_MIN_WORDS = 1)
  if (micMode === 'barge' || micMode === 'xai-b') {
    if (wordCount < STT_BARGE_MIN_WORDS) {
      console.log('[STT] barge skip (too few words):', query);
      return;
    }
  } else if (wordCount < STT_MIN_WORDS) {
    console.log('[STT] noise skip (< ' + STT_MIN_WORDS + ' words):', query);
    return;
  }
  // Drop transcript if agent is still processing a prior turn — prevents
  // mid-ramble pauses from firing a second submit and getting a 0-char response.
  // Barge-in only exempted when TTS is actually playing (isSpeaking); while
  // waiting for LLM response (isStreaming, !isSpeaking) there's nothing to barge into.
  // Claude mode exception: allow new submits (claudeSubmit handles cancellation internally).
  if (isStreaming && !claudeMode && !((micMode === 'barge' || micMode === 'xai-b') && isSpeaking)) return;
  // In speaker/diarize mode: suppress while TTS is playing or during post-TTS cooldown.
  if (micMode === 'speaker' || micMode === 'deepgram-di' || micMode === 'xai') {
    if (isSpeaking) return;
    // Also suppress during cooldown unconditionally — catches Deepgram finals that
    // arrive after isSpeaking clears but were captured while audio was still playing.
    if (Date.now() < _sttCooldownUntil) return;
  }
  beepConfirm();
  if (kbdOpen) {
    textInput.value = (textInput.value + ' ' + query).trim();
  } else {
    submit(query);
  }
}

function onSttStop() {
  // If voiceMode is still true, micMode is active, AND we're currently listening
  // (meaning a new provider already started), this is a stale stop — skip entirely.
  if (voiceMode && micMode !== 'off' && isListening) return;
  isListening = false;
  micBtn.classList.remove('listening');
  micIcon.textContent = MIC_MODE_LABELS[micMode];  // restore current mode label
  if (!isStreaming) {
    setStatus('STANDBY', false);
    if (!kbdOpen) voicePreview.textContent = 'TAP MIC TO SPEAK';
  }
}

// ── Provider: Web Speech API ──────────────────────────────────
const _ws = (() => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;

  const rec = new SpeechRecognition();
  rec.continuous      = false;
  rec.interimResults  = true;
  rec.lang            = 'en-US';
  rec.maxAlternatives = 1;

  let pendingTranscript = '';
  let didSubmit = false;

  rec.onstart = () => onSttStart();

  rec.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += t; else interim += t;
    }
    const heard = (final || interim).trim();
    if (heard) pendingTranscript = heard;
    onSttPartial(heard);
    if (final) { didSubmit = true; pendingTranscript = ''; onSttFinal(final); }
  };

  rec.onerror = (e) => {
    if (e.error !== 'no-speech') flashError('mic: ' + e.error);
    onSttStop();
  };

  rec.onend = () => {
    if (!didSubmit && pendingTranscript && !kbdOpen && !isStreaming) {
      didSubmit = true;
      onSttFinal(pendingTranscript);
    }
    pendingTranscript = '';
    didSubmit = false;
    onSttStop();
  };

  return {
    start() { try { rec.start(); } catch (e) { flashError('mic: ' + e.message.slice(0, 30)); } },
    stop()  { try { rec.stop();  } catch (_) {} },
  };
})();

// ── Provider: Deepgram (browser WebSocket + AudioWorklet PCM) ─
const _dg = (() => {
  let dgKey    = null;   // fetched once from /api/stt-token
  let dgWs     = null;
  let audioCtxDg = null;
  let workletNode = null;
  let mediaStream = null;
  let active   = false;

  // Inline AudioWorklet processor as a Blob URL — sends 256-sample PCM chunks
  const WORKLET_CODE = `
class PcmCapture extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(ch.buffer, [ch.buffer]);
    return true;
  }
}
registerProcessor('pcm-capture', PcmCapture);`;

  async function startDg() {
    active = true;
    onSttStart();
    try {

      // Get mic + AudioContext first so we know the real sample rate before connecting
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { noiseSuppression: true, echoCancellation: true, autoGainControl: true },
          video: false,
        });
      } catch (e) {
        flashError('mic denied: ' + e.message.slice(0, 30));
        active = false; onSttStop(); return;
      }
      audioCtxDg = new AudioContext();
      const actualRate = audioCtxDg.sampleRate;

      // Route through server proxy — Deepgram requires Authorization header
      // which browsers can't set on WebSocket; proxy injects it server-side.
      const params = new URLSearchParams({
        model:              DG_MODEL,
        encoding:           DG_ENCODING,
        sample_rate:        actualRate,
        eot_threshold:      DG_EOT_THRESHOLD,
        token:              _apiKey,
      });
      const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      dgWs = new WebSocket(`${wsProto}//${location.host}/api/stt-proxy?${params}`);
      dgWs.binaryType = 'arraybuffer';
      dgWs.onopen = async () => {
        const source = audioCtxDg.createMediaStreamSource(mediaStream);

        // Try AudioWorklet first; fall back to ScriptProcessorNode for iOS Safari
        let usedWorklet = false;
        try {
          const blob    = new Blob([WORKLET_CODE], { type: 'application/javascript' });
          const blobUrl = URL.createObjectURL(blob);
          await audioCtxDg.audioWorklet.addModule(blobUrl);
          URL.revokeObjectURL(blobUrl);
          workletNode = new AudioWorkletNode(audioCtxDg, 'pcm-capture');
          workletNode.port.onmessage = (e) => sendPcm(new Float32Array(e.data));
          source.connect(workletNode);
          usedWorklet = true;
        } catch (_) {}
        if (!usedWorklet) {
          // ScriptProcessorNode fallback for browsers without AudioWorklet support
          const spn = audioCtxDg.createScriptProcessor(4096, 1, 1);
          spn.onaudioprocess = (ev) => sendPcm(ev.inputBuffer.getChannelData(0));
          source.connect(spn);
          spn.connect(audioCtxDg.destination); // required to keep spn alive (silent output)
          workletNode = spn;
        }
        // After all async setup, resume if iOS suspended the context.
        // Called here (inside onopen callback) rather than before WS creation
        // to avoid hanging the initial fresh-page-load gesture chain.
        if (audioCtxDg && audioCtxDg.state === 'suspended') {
          audioCtxDg.resume().catch(() => {});
        }
      };

      // Flux requires ~80ms chunks for optimal performance.
      // Buffer incoming PCM and flush once we have enough samples.
      let _pcmBuf = [];
      let _pcmBufLen = 0;
      function sendPcm(f32) {
        if (!dgWs || dgWs.readyState !== WebSocket.OPEN) return;
        // In speaker mode, drop mic audio while TTS is playing or cooldown is active.
        // This prevents Deepgram from transcribing speaker output at all.
        if (micMode === 'speaker' && (isSpeaking || Date.now() < _sttCooldownUntil)) {
          _pcmBuf = []; _pcmBufLen = 0;  // discard any buffered audio too
          return;
        }
        _pcmBuf.push(f32);
        _pcmBufLen += f32.length;
        const targetSamples = Math.round((audioCtxDg.sampleRate || 48000) * 0.08); // 80ms
        if (_pcmBufLen < targetSamples) return;
        // Flatten buffered chunks
        const merged = new Float32Array(_pcmBufLen);
        let offset = 0;
        for (const chunk of _pcmBuf) { merged.set(chunk, offset); offset += chunk.length; }
        _pcmBuf = [];
        _pcmBufLen = 0;
        // Noise gate: compute RMS and skip if below threshold (filters ambient noise)
        if (STT_NOISE_GATE > 0) {
          let sumSq = 0;
          for (let i = 0; i < merged.length; i++) sumSq += merged[i] * merged[i];
          if (Math.sqrt(sumSq / merged.length) < STT_NOISE_GATE) return;
        }
        const i16 = new Int16Array(merged.length);
        for (let i = 0; i < merged.length; i++)
          i16[i] = Math.max(-32768, Math.min(32767, merged[i] * 32768));
        dgWs.send(i16.buffer);
      }

      dgWs.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch (_) { return; }
        if (msg.type !== 'TurnInfo') return;
        const transcript = (msg.transcript || '').trim();
        if (msg.event === 'StartOfTurn') {
          // User started speaking — clear preview but do NOT barge-in yet.
          // Wait for Update/EndOfTurn with enough words to confirm real speech,
          // otherwise ambient noise StartOfTurn kills TTS prematurely.
          onSttPartial('');
        } else if (msg.event === 'Update') {
          if (transcript) onSttPartial(transcript);
        } else if (msg.event === 'EndOfTurn') {
          if (transcript) { onSttPartial(transcript); onSttFinal(transcript); }
        }
      };
      dgWs.onerror = (ev) => { flashError('DG WS error'); stopDg(); };
      dgWs.onclose = (ev) => {
        flashError('DG closed ' + ev.code);
        if (active) { active = false; stopDg(); }
      };
    } catch (err) {
      flashError('DG catch: ' + String(err).slice(0, 40));
      active = false;
      onSttStop();
    }
  }

  function stopDg() {
    active = false;
    _pcmBuf = []; _pcmBufLen = 0;
    if (workletNode){ try { workletNode.disconnect(); } catch (_) {} workletNode = null; }
    if (mediaStream){ mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioCtxDg) { try { audioCtxDg.close(); }  catch (_) {} audioCtxDg = null; }
    if (dgWs) {
      try {
        if (dgWs.readyState === WebSocket.OPEN) dgWs.send(JSON.stringify({ type: 'CloseStream' }));
        dgWs.close();
      } catch (_) {}
      dgWs = null;
    }
    onSttStop();
  }

  return { start: startDg, stop: stopDg };
})();

// ── Provider: Deepgram Diarization (nova-3 + diarize=true) ───
const _dgDi = (() => {
  let dgWs       = null;
  let audioCtxDg = null;
  let workletNode = null;
  let mediaStream = null;
  let active      = false;

  // Accumulate words by speaker for the current speech_final segment
  let _speakerWords = [];  // [{speaker, word}]
  let _pendingDiTranscript = null;  // held during cooldown, submitted when cooldown clears

  function _buildTranscript(words) {
    // Group consecutive words by same speaker, emit "Speaker N: text" blocks
    if (!words.length) return '';
    const blocks = [];
    let curSpeaker = words[0].speaker;
    let curWords   = [words[0].word];
    for (let i = 1; i < words.length; i++) {
      if (words[i].speaker === curSpeaker) {
        curWords.push(words[i].word);
      } else {
        blocks.push(`[Speaker ${curSpeaker + 1}]: ${curWords.join(' ')}`);
        curSpeaker = words[i].speaker;
        curWords   = [words[i].word];
      }
    }
    blocks.push(`[Speaker ${curSpeaker + 1}]: ${curWords.join(' ')}`);
    return blocks.join('\n');
  }

  const WORKLET_CODE_DI = `
class PcmCaptureDi extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(ch.buffer, [ch.buffer]);
    return true;
  }
}
registerProcessor('pcm-capture-di', PcmCaptureDi);`;

  async function startDgDi() {
    active = true;
    _speakerWords = [];
    _pendingDiTranscript = null;
    onSttStart();
    try {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { noiseSuppression: true, echoCancellation: true, autoGainControl: true },
          video: false,
        });
      } catch (e) {
        flashError('mic denied: ' + e.message.slice(0, 30));
        active = false; onSttStop(); return;
      }
      audioCtxDg = new AudioContext();
      const actualRate = audioCtxDg.sampleRate;

      const params = new URLSearchParams({
        model:            'nova-3',
        encoding:         'linear16',
        sample_rate:      actualRate,
        diarize:          'true',
        utterance_end_ms: '3000',
        interim_results:  'true',
        smart_format:     'true',
        token:            _apiKey,
      });
      const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      dgWs = new WebSocket(`${wsProto}//${location.host}/api/stt-proxy?${params}`);
      dgWs.binaryType = 'arraybuffer';

      dgWs.onopen = async () => {
        const source = audioCtxDg.createMediaStreamSource(mediaStream);
        let usedWorklet = false;
        try {
          const blob    = new Blob([WORKLET_CODE_DI], { type: 'application/javascript' });
          const blobUrl = URL.createObjectURL(blob);
          await audioCtxDg.audioWorklet.addModule(blobUrl);
          URL.revokeObjectURL(blobUrl);
          workletNode = new AudioWorkletNode(audioCtxDg, 'pcm-capture-di');
          workletNode.port.onmessage = (e) => sendPcmDi(new Float32Array(e.data));
          source.connect(workletNode);
          usedWorklet = true;
        } catch (_) {}
        if (!usedWorklet) {
          const spn = audioCtxDg.createScriptProcessor(4096, 1, 1);
          spn.onaudioprocess = (ev) => sendPcmDi(ev.inputBuffer.getChannelData(0));
          source.connect(spn);
          spn.connect(audioCtxDg.destination);
          workletNode = spn;
        }
        if (audioCtxDg && audioCtxDg.state === 'suspended') audioCtxDg.resume().catch(() => {});
      };

      let _pcmBuf = [], _pcmBufLen = 0;
      function sendPcmDi(f32) {
        if (!dgWs || dgWs.readyState !== WebSocket.OPEN) return;
        // Always send audio to keep the DG connection alive — onSttFinal guards submission.
        _pcmBuf.push(f32);
        _pcmBufLen += f32.length;
        const targetSamples = Math.round((audioCtxDg.sampleRate || 48000) * 0.08);
        if (_pcmBufLen < targetSamples) return;
        const merged = new Float32Array(_pcmBufLen);
        let offset = 0;
        for (const chunk of _pcmBuf) { merged.set(chunk, offset); offset += chunk.length; }
        _pcmBuf = []; _pcmBufLen = 0;
        const i16 = new Int16Array(merged.length);
        for (let i = 0; i < merged.length; i++)
          i16[i] = Math.max(-32768, Math.min(32767, merged[i] * 32768));
        dgWs.send(i16.buffer);
      }

      let _diFlushTimer = null;
      let _diAccumulated = '';  // accumulate across speech_final events

      function flushDiWords() {
        if (!active || !_speakerWords.length) return;
        const transcript = _buildTranscript(_speakerWords);
        _speakerWords = [];
        onSttPartial(transcript.split('\n').pop() || '');

        // Accumulate transcript segments — don't submit immediately
        _diAccumulated = _diAccumulated ? _diAccumulated + ' ' + transcript : transcript;

        // Debounce: wait 2.5s of silence after last speech_final before submitting
        if (_diFlushTimer) clearTimeout(_diFlushTimer);
        _diFlushTimer = setTimeout(() => {
          _diFlushTimer = null;
          if (!_diAccumulated) return;
          const full = _diAccumulated;
          _diAccumulated = '';
          const cooldownRemaining = _sttCooldownUntil - Date.now();
          if (cooldownRemaining > 0) {
            _pendingDiTranscript = full;
            setTimeout(() => {
              if (_pendingDiTranscript) {
                const t = _pendingDiTranscript;
                _pendingDiTranscript = null;
                onSttFinal(t);
              }
            }, cooldownRemaining);
          } else {
            _pendingDiTranscript = null;
            onSttFinal(full);
          }
        }, 2500);
      }

      dgWs.onmessage = (e) => {
        if (!active) return;  // discard in-flight data after stop
        let msg;
        try { msg = JSON.parse(e.data); } catch (_) { return; }
        const alt = (msg.channel && msg.channel.alternatives && msg.channel.alternatives[0]) || null;
        if (!alt) return;

        if (msg.type === 'Results') {
          const partial = (alt.transcript || '').trim();
          if (!msg.speech_final) {
            // Rolling interim — show partial text only
            if (partial) onSttPartial(partial);
          } else {
            // speech_final:true — accumulate diarized words
            const words = alt.words || [];
            for (const w of words) {
              if (w.word) _speakerWords.push({ speaker: w.speaker || 0, word: w.word });
            }
            flushDiWords();
          }
        } else if (msg.type === 'UtteranceEnd') {
          // Safety-net flush if speech_final didn't already clear the buffer
          flushDiWords();
        }
      };

      dgWs.onerror = () => { flashError('DG-DI WS error'); stopDgDi(); };
      dgWs.onclose = () => { if (active) { active = false; stopDgDi(); } };

    } catch (err) {
      flashError('DG-DI: ' + String(err).slice(0, 40));
      active = false;
      onSttStop();
    }
  }

  function stopDgDi() {
    active = false;
    _speakerWords = [];
    _pendingDiTranscript = null;
    if (workletNode) { try { workletNode.disconnect(); } catch (_) {} workletNode = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioCtxDg)  { try { audioCtxDg.close(); } catch (_) {} audioCtxDg = null; }
    if (dgWs) {
      try {
        if (dgWs.readyState === WebSocket.OPEN) dgWs.send(JSON.stringify({ type: 'CloseStream' }));
        dgWs.close();
      } catch (_) {}
