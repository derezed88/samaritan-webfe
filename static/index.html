      dgWs = null;
    }
    onSttStop();
  }

  return { start: startDgDi, stop: stopDgDi };
})();

// ── Provider: xAI Realtime (STT + prosody/emotion tagging) ──
// Uses the xAI Grok Voice Agent API (OpenAI Realtime API compatible)
// as an STT provider. Streams mic audio via WebSocket, receives transcript
// plus emotion metadata inferred from voice prosody.
const _xaiStt = (() => {
  let ws         = null;
  let audioCtxX  = null;
  let workletNode = null;
  let mediaStream = null;
  let active      = false;
  let _responseText = '';
  let _tokenCache = null;
  let _submittedThisTurn = false;
  let _directTranscript = '';  // stashed transcription for fallback
  let _fallbackTimer = null;   // submit after timeout if response.done is slow

  // Store last emotion metadata for claudeSubmit to pick up
  window._xaiSttEmotion = null;

  const WORKLET_CODE_XAI = `
class PcmCaptureXai extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(ch.buffer, [ch.buffer]);
    return true;
  }
}
registerProcessor('pcm-capture-xai', PcmCaptureXai);`;

  async function getToken() {
    // Always fetch a fresh token — ephemeral tokens expire quickly
    _tokenCache = null;
    try {
      console.log('[xAI STT] fetching fresh voice token...');
      const r = await fetch('/api/voice-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ expires_in: 120 }),
      });
      console.log('[xAI STT] token response status:', r.status);
      if (r.ok) {
        const j = await r.json();
        console.log('[xAI STT] token response keys:', Object.keys(j));
        _tokenCache = j.client_secret?.value || j.value || j.token;
      } else {
        const errText = await r.text();
        console.error('[xAI STT] token fetch failed:', r.status, errText);
      }
    } catch (e) { console.error('[xAI STT] token fetch error:', e); }
    return _tokenCache || null;
  }

  const XAI_TARGET_RATE = 24000;

  // Downsample Float32 from srcRate to dstRate (simple linear interpolation)
  function downsample(f32, srcRate, dstRate) {
    if (srcRate === dstRate) return f32;
    const ratio = srcRate / dstRate;
    const outLen = Math.round(f32.length / ratio);
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const srcIdx = i * ratio;
      const lo = Math.floor(srcIdx);
      const hi = Math.min(lo + 1, f32.length - 1);
      const frac = srcIdx - lo;
      out[i] = f32[lo] * (1 - frac) + f32[hi] * frac;
    }
    return out;
  }

  // Convert Float32 PCM to base64 PCM16-LE for xAI (with downsampling)
  function f32ToBase64Pcm16(f32, srcRate) {
    const resampled = downsample(f32, srcRate, XAI_TARGET_RATE);
    const i16 = new Int16Array(resampled.length);
    for (let i = 0; i < resampled.length; i++)
      i16[i] = Math.max(-32768, Math.min(32767, resampled[i] * 32768));
    const bytes = new Uint8Array(i16.buffer);
    let b64 = '';
    const CHUNK = 8192;
    for (let i = 0; i < bytes.length; i += CHUNK)
      b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    return btoa(b64);
  }

  let _sessionReady = false;  // gate audio sending until session.updated received
  let _startedAt = 0;         // timestamp for auto-retry on quick WS close
  let _retryCount = 0;

  let _isRetry = false;

  async function startXai() {
    console.log('[xAI STT] startXai() called, retry:', _isRetry);
    active = true;
    _sessionReady = false;
    if (!_isRetry) onSttStart();  // only set visual on first attempt
    _isRetry = false;
    window._xaiSttEmotion = null;

    try {
      // Create AudioContext + get mic FIRST (synchronously from user gesture)
      // before any async work that would exhaust the gesture on iOS Safari.
      // On retry, reuse existing if still valid.
      if (!audioCtxX || audioCtxX.state === 'closed') {
        audioCtxX = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtxX.state === 'suspended') {
        audioCtxX.resume().catch(() => {});
      }
      if (!mediaStream || !mediaStream.active) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: { noiseSuppression: true, echoCancellation: true, autoGainControl: true },
            video: false,
          });
        } catch (e) {
          flashError('mic denied: ' + e.message.slice(0, 30));
          active = false; onSttStop(); return;
        }
      }

      const token = await getToken();
      console.log('[xAI STT] got token:', token ? 'yes (' + token.slice(0, 10) + '...)' : 'NO');
      if (!token) { flashError('xAI voice token failed'); active = false; onSttStop(); return; }

      // Open WebSocket to xAI realtime API
      _startedAt = Date.now();
      console.log('[xAI STT] opening WebSocket to wss://api.x.ai/v1/realtime');
      ws = new WebSocket('wss://api.x.ai/v1/realtime',
                         [`xai-client-secret.${token}`]);

      // Connection timeout — if WS doesn't open in 10s, fail visibly
      const wsTimeout = setTimeout(() => {
        if (ws && ws.readyState === WebSocket.CONNECTING) {
          console.error('[xAI STT] WebSocket connection timeout');
          flashError('xAI STT: connection timeout');
          stopXai();
        }
      }, 10000);

      ws.onopen = async () => {
        clearTimeout(wsTimeout);
        console.log('[xAI STT] WebSocket connected, mic rate:', audioCtxX.sampleRate, '→ target:', XAI_TARGET_RATE, ', sending session.update');
        // Configure session: text-only response, server VAD, transcription + emotion
        ws.send(JSON.stringify({
          type: 'session.update',
          session: {
            modalities: ['text'],
            instructions: 'You are a speech transcription and emotion analysis system. ' +
              'Listen to the user\'s speech and output ONLY a valid JSON object with these fields: ' +
              '{"transcript": "exact words the user spoke", "emotion": "primary emotion detected from voice tone/prosody", ' +
              '"confidence": 0.0-1.0, "prosody": "brief description of vocal qualities like pace, pitch, energy"}. ' +
              'If you cannot detect any clear emotion, use "neutral" with confidence 0.5. ' +
              'Do not add any text outside the JSON object. Do not paraphrase the transcript.',
            input_audio_format: 'pcm16',
            input_audio_sample_rate: XAI_TARGET_RATE,
            turn_detection: {
              type: 'server_vad',
              threshold: 0.5,
              silence_duration_ms: 700,
            },
          },
        }));
        // NOTE: mic capture setup happens AFTER session.updated is received (see onmessage handler)
        // to avoid the race condition where audio is sent before the server is configured
      };

      // ScriptProcessor fallback for browsers without AudioWorklet (e.g. older iOS Safari)
      function _setupScriptProcessor(source) {
        const spn = audioCtxX.createScriptProcessor(4096, 1, 1);
        spn.onaudioprocess = (ev) => sendAudio(ev.inputBuffer.getChannelData(0));
        source.connect(spn);
        spn.connect(audioCtxX.destination);
        workletNode = spn;
        console.log('[xAI STT] mic capture via ScriptProcessor fallback');
      }

      // Buffer and send audio chunks (~80ms like Deepgram)
      let _pcmBuf = [];
      let _pcmBufLen = 0;
      function sendAudio(f32) {
        if (!_sessionReady || !ws || ws.readyState !== WebSocket.OPEN) return;
        // Speaker/xai mode: suppress mic while TTS plays
        if ((micMode === 'speaker' || micMode === 'xai') && (isSpeaking || Date.now() < _sttCooldownUntil)) {
          _pcmBuf = []; _pcmBufLen = 0;
          return;
        }
        _pcmBuf.push(f32);
        _pcmBufLen += f32.length;
        const targetSamples = Math.round((audioCtxX.sampleRate || 48000) * 0.08);
        if (_pcmBufLen < targetSamples) return;
        const merged = new Float32Array(_pcmBufLen);
        let offset = 0;
        for (const chunk of _pcmBuf) { merged.set(chunk, offset); offset += chunk.length; }
        _pcmBuf = []; _pcmBufLen = 0;
        // Noise gate
        if (STT_NOISE_GATE > 0) {
          let sumSq = 0;
          for (let i = 0; i < merged.length; i++) sumSq += merged[i] * merged[i];
          if (Math.sqrt(sumSq / merged.length) < STT_NOISE_GATE) return;
        }
        ws.send(JSON.stringify({
          type: 'input_audio_buffer.append',
          audio: f32ToBase64Pcm16(merged, audioCtxX.sampleRate),
        }));
      }

      ws.onmessage = (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch (_) { return; }
        console.log('[xAI STT] msg:', msg.type, msg.type === 'error' ? msg.error : '');
        switch (msg.type) {
          case 'session.updated':
            if (!_sessionReady) {
              _sessionReady = true;
              _retryCount = 0;  // successful session — reset retry counter
              console.log('[xAI STT] session configured, starting mic capture');
              // NOW set up mic capture — server is ready to receive audio
              const source = audioCtxX.createMediaStreamSource(mediaStream);
              let usedWorklet = false;
              try {
                const blob    = new Blob([WORKLET_CODE_XAI], { type: 'application/javascript' });
                const blobUrl = URL.createObjectURL(blob);
                audioCtxX.audioWorklet.addModule(blobUrl).then(() => {
                  URL.revokeObjectURL(blobUrl);
                  workletNode = new AudioWorkletNode(audioCtxX, 'pcm-capture-xai');
                  workletNode.port.onmessage = (e) => sendAudio(new Float32Array(e.data));
                  source.connect(workletNode);
                  console.log('[xAI STT] mic capture via AudioWorklet');
                }).catch(() => {
                  _setupScriptProcessor(source);
                });
                usedWorklet = true;  // attempted worklet path
              } catch (_) {}
              if (!usedWorklet) {
                _setupScriptProcessor(source);
              }
              if (audioCtxX && audioCtxX.state === 'suspended') {
                audioCtxX.resume().catch(() => {});
              }
            }
            break;
          case 'input_audio_buffer.speech_started':
            onSttPartial('');
            _responseText = '';
            _submittedThisTurn = false;
            _directTranscript = '';
            if (_fallbackTimer) { clearTimeout(_fallbackTimer); _fallbackTimer = null; }
            // xAI-b barge-in: VAD says user is speaking while TTS plays — stop TTS now.
            // Don't wait for transcript text; xAI has no incremental partials.
            if (isSpeaking && micMode === 'xai-b') {
              console.log('[TTS] xai-b barge-in on speech_started');
              stopAllAudio();
              resetTtsPipeline();
              if (activeEvtSource) { activeEvtSource.close(); activeEvtSource = null; }
              isStreaming = false;
            }
            break;
          case 'input_audio_buffer.speech_stopped':
            // VAD detected end of speech — server will auto-commit and respond
            break;
          case 'conversation.item.input_audio_transcription.completed': {
            // Direct transcription — use for preview only; wait for response.done
            // which carries both transcript and emotion metadata
            const directTranscript = (msg.transcript || '').trim();
            console.log('[xAI STT] direct transcription (preview):', directTranscript);
            if (directTranscript) {
              _directTranscript = directTranscript;  // stash for model response handler
              onSttPartial(directTranscript);
              // No fallback timer — wait for response.done which carries emotion.
              // If response.done never arrives (15s timeout), fallback submits.
              if (_fallbackTimer) clearTimeout(_fallbackTimer);
              _fallbackTimer = setTimeout(() => {
                if (!_submittedThisTurn && _directTranscript) {
                  console.log('[xAI STT] fallback submit (response.done timeout)');
                  _submittedThisTurn = true;
                  onSttFinal(_directTranscript);
                  _directTranscript = '';
                }
              }, 15000);
            }
            break;
          }
          case 'response.text.delta':
          case 'response.output_audio_transcript.delta':
            if (msg.delta) {
              _responseText += msg.delta;
              // Show partial text as it streams
              const partial = _responseText.trim();
              try {
                const m = partial.match(/"transcript"\s*:\s*"([^"]+)"/);
                if (m && m[1]) onSttPartial(m[1]);
              } catch (_) {}
            }
            break;
          case 'response.text.done':
          case 'response.output_audio_transcript.done':
          case 'response.done': {
            // Model response — may contain emotion JSON (even if transcript already submitted)
            const raw = _responseText.trim();
            _responseText = '';
            if (!raw) break;
            console.log('[xAI STT] model response:', raw.slice(0, 300));
            try {
              // Try strict JSON first, then regex fallback for unquoted values
              let parsed = null;
              const jsonMatch = raw.match(/\{[\s\S]*\}/);
              if (jsonMatch) {
                try { parsed = JSON.parse(jsonMatch[0]); } catch (_) {}
                if (!parsed) {
                  // Regex fallback: extract fields from loose/unquoted JSON
                  parsed = {};
                  const em = raw.match(/emotion\s*:\s*([^,}]+)/);
                  const co = raw.match(/confidence\s*:\s*([\d.]+)/);
                  const pr = raw.match(/prosody\s*:\s*(.+?)(?:\s*}\s*$)/);
                  const tr = raw.match(/transcript\s*:\s*["']?(.+?)["']?\s*(?:,\s*(?:emotion|confidence|prosody)|}\s*$)/);
                  if (em) parsed.emotion = em[1].trim().replace(/^["']|["']$/g, '');
                  if (co) parsed.confidence = parseFloat(co[1]);
                  if (pr) parsed.prosody = pr[1].trim().replace(/^["']|["']$/g, '');
                  if (tr) parsed.transcript = tr[1].trim().replace(/^["']|["']$/g, '');
                  console.log('[xAI STT] parsed via regex fallback:', parsed);
                }
              }
              if (parsed) {
                // Cancel fallback timer — we have the full response now
                if (_fallbackTimer) { clearTimeout(_fallbackTimer); _fallbackTimer = null; }
                // Always extract emotion metadata from model response
                if (parsed.emotion) {
                  window._xaiSttEmotion = {
                    emotion: parsed.emotion,
                    confidence: parsed.confidence || 0.5,
                    prosody: parsed.prosody || '',
                  };
                  console.log('[xAI STT] emotion:', window._xaiSttEmotion);
                }
                // Use model transcript, or fall back to direct transcription
                const transcript = (parsed.transcript || _directTranscript || '').trim();
                _directTranscript = '';
                if (transcript && !_submittedThisTurn) {
                  _submittedThisTurn = true;
                  onSttPartial(transcript);
                  onSttFinal(transcript);
                }
              } else if (!_submittedThisTurn) {
                // No JSON — strip any wrapper and use as transcript
                let fallback = _directTranscript || raw;
                fallback = fallback.replace(/^\s*\{?\s*transcript\s*:\s*["']?/i, '').replace(/["']?\s*\}?\s*$/, '').trim();
                if (fallback) {
                  _submittedThisTurn = true;
                  _directTranscript = '';
                  onSttPartial(fallback);
                  onSttFinal(fallback);
                }
              }
            } catch (_) {
              if (!_submittedThisTurn) {
                let fallback = _directTranscript || raw;
                fallback = fallback.replace(/^\s*\{?\s*transcript\s*:\s*["']?/i, '').replace(/["']?\s*\}?\s*$/, '').trim();
                if (fallback) {
                  _submittedThisTurn = true;
                  _directTranscript = '';
                  onSttPartial(fallback);
                  onSttFinal(fallback);
                }
              }
            }
            break;
          }
          case 'error':
            console.error('[xAI STT] error:', msg.error);
            flashError('xAI STT: ' + (msg.error?.message || 'error').slice(0, 40));
            break;
        }
      };

      ws.onerror = (e) => { console.error('[xAI STT] WS error:', e); };
      ws.onclose = (evt) => {
        console.log('[xAI STT] WS closed, code:', evt.code, 'reason:', evt.reason,
          'uptime:', Date.now() - _startedAt, 'ms, retries:', _retryCount);
        if (!active) return;
        // Auto-retry up to 3 times if WS closed within 5s (iOS Safari first-load issue)
        if (Date.now() - _startedAt < 5000 && _retryCount < 3) {
          _retryCount++;
          console.log('[xAI STT] quick close — auto-retrying (' + _retryCount + '/3)');
          // Clean up WS + worklet only — preserve AudioContext + mediaStream for retry
          if (workletNode) { try { workletNode.disconnect(); } catch (_) {} workletNode = null; }
          ws = null;
          _sessionReady = false;
          _tokenCache = null;  // force fresh token on retry
          _isRetry = true;
          // Brief delay so old WS fully tears down before new one opens
          setTimeout(() => { if (active) startXai(); }, 500 * _retryCount);  // 500ms, 1s, 1.5s
          return;
        }
        active = false;
        _retryCount = 0;
        stopXai();
      };
    } catch (err) {
      console.error('[xAI STT] catch:', err);
      flashError('xAI STT: ' + String(err).slice(0, 40));
      active = false;
      onSttStop();
    }
  }

  function stopXai() {
    active = false;
    if (workletNode) { try { workletNode.disconnect(); } catch (_) {} workletNode = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioCtxX)   { try { audioCtxX.close(); } catch (_) {} audioCtxX = null; }
    if (ws) {
      try { ws.close(); } catch (_) {}
      ws = null;
    }
    _tokenCache = null;
    onSttStop();
  }

  return { start: startXai, stop: stopXai };
})();

// ── STT provider map & mic button wiring ─────────────────────
const sttProviders = { webspeech: _ws, deepgram: _dg, 'deepgram-di': _dgDi, xai: _xaiStt };

// STT provider toggle button (reuse same pattern as TTS)
const sttProviderBtn = document.getElementById('stt-provider-btn');
(function() {
  function updateSttBtn() {
    sttProviderBtn.textContent = STT_PROVIDER.toUpperCase();
  }
  const order = Object.keys(sttProviders).filter(k => sttProviders[k]);
  updateSttBtn();
  sttProviderBtn.addEventListener('click', () => {
    if (isListening) return;   // don't switch mid-listen
    const idx = order.indexOf(STT_PROVIDER);
    STT_PROVIDER = order[(idx + 1) % order.length];
    updateSttBtn();
  });
})();

// Returns the active STT provider: deepgram-di and xai modes force their provider
function getActiveProvider() {
  if (micMode === 'deepgram-di') return _dgDi;
  if (micMode === 'xai' || micMode === 'xai-b') return _xaiStt;
  return sttProviders[STT_PROVIDER];
}

// ── Mic button ───────────────────────────────────────────────
if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
  micBtn.classList.add('unsupported');
  micBtn.title = 'Voice requires HTTPS';
  voicePreview.textContent = 'HTTPS REQUIRED FOR MIC';
} else {
  micBtn.addEventListener('click', () => {
    if (micBtn.classList.contains('unsupported')) return;
    resetIdleTimer();
    initAudioCtx();  // re-unlock AudioContext after iOS audio interruption

    // If already in an active mode and currently listening, tap means cycle.
    // If STT dropped (iOS notification, WS close), try ONE restart before cycling.
    if (micMode !== 'off' && !isListening && !isStreaming && !_sttRestartAttempted) {
      _sttRestartAttempted = true;  // prevent repeated restart attempts
      const provider = getActiveProvider();
      if (!provider) { flashError('STT provider unavailable'); return; }
      voiceMode = true;
      provider.start();
      return;
    }
    _sttRestartAttempted = false;  // reset on cycle

    // Otherwise cycle: off → barge → speaker → deepgram-di → off
    // Don't cycle while actively streaming LLM response (isStreaming).
    if (isStreaming) return;
    const prevProvider = getActiveProvider();
    const next = MIC_MODES[(MIC_MODES.indexOf(micMode) + 1) % MIC_MODES.length];
    setMicMode(next);
    if (next === 'off') {
      voiceMode = false;
      if (isListening && prevProvider) prevProvider.stop();
    } else {
      voiceMode = true;
      const provider = getActiveProvider();
      if (!provider) { flashError('STT provider unavailable'); return; }
      // If the provider changed (e.g. speaker→deepgram-di), stop old and start new.
      if (prevProvider && prevProvider !== provider && isListening) {
        prevProvider.stop();   // onSttStop() sets isListening=false
        provider.start();      // onSttStart() will restore listening visual
      } else if (!isListening) {
        provider.start();
      }
    }
  });
  // Mark unsupported if webspeech default and not available
  if (STT_PROVIDER === 'webspeech' && !_ws) {
    micBtn.classList.add('unsupported');
    micBtn.title = 'Voice input not supported in this browser — switch to Deepgram';
  }
}

// (iOS background/foreground recovery handled by mic-reconnect-overlay below)

// ── Initial state ─────────────────────────────────────────────
showIdle(true);
showLoader(false);
setStatus('STANDBY', false);
resetIdleTimer();   // start idle countdown immediately on page load
// Do NOT focus the text input on load — prevents iOS keyboard from popping up

// Auto-enable GPS on iPhone Safari — battery-cheap, always-useful context
if (/iPhone/.test(navigator.userAgent) && navigator.geolocation) {
  cmdLocation('on');
}
</script>

<script>
// ── iOS background recovery: auto-reload ─────────────────────
// iOS kills the hardware mic when Safari backgrounds. In-page getUserMedia
// recovery always returns a silent ghost track. Reload is the only reliable fix.
// We save UI state to sessionStorage so it can be restored after reload.
(function() {
  const RELOAD_KEY = 'sam_reload_state';

  // On page load: if we reloaded due to backgrounding, restore state + start STT.
  const savedJson = sessionStorage.getItem(RELOAD_KEY);
  if (savedJson) {
    sessionStorage.removeItem(RELOAD_KEY);
    try {
      const saved = JSON.parse(savedJson);
      // Delay to let page fully initialise, then restore state.
      setTimeout(() => {
        // Restore TTS provider — click the button until we reach the saved provider.
        // Using click() ensures destroy/prefetch side-effects fire correctly.
        if (saved.ttsProvider && ttsProviders[saved.ttsProvider] && saved.ttsProvider !== TTS_PROVIDER) {
          const order = ['inworld', 'deepgram', 'xai', 'xai-persistent'];
          const steps = (order.indexOf(saved.ttsProvider) - order.indexOf(TTS_PROVIDER) + order.length) % order.length;
          for (let i = 0; i < steps; i++) voiceProviderBtn.click();
        }
        // Restore fullVoiceMode
        if (saved.fullVoiceMode && !fullVoiceMode) {
          fullVoiceBtn.click();  // toggles fullVoiceMode + updates button
        }
        // Restore claude mode (before mic, so STT routes correctly)
        if (saved.claudeMode) {
          enterClaudeMode();
        }
        // Restore location watch
        if (saved.locationEnabled) {
          cmdLocation('on');
        }
        // Restore camera state
        if (saved.cameraState && saved.cameraState !== 'off') {
          // Cycle to saved state
          cycleCamera();  // off → rear
          if (saved.cameraState === 'front') cycleCamera();  // rear → front
          if (saved.autoCaptureActive) startAutoCapture();
        }
        // Restore mic mode + start STT (extra delay so async TTS init settles first)
        if (!micBtn.classList.contains('unsupported') && saved.micMode && saved.micMode !== 'off') {
          setMicMode(saved.micMode);
          const provider = getActiveProvider();
          if (provider) {
            setTimeout(() => {
              voiceMode = true;
              provider.start();
            }, 400);
          }
        }
      }, 800);
    } catch (_) {}
  }

  // On return from background with mic active: save state and reload.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    initAudioCtx();  // always resume TTS AudioContext
    if (micMode === 'off' || isStreaming) return;
    // Save current state so it's restored after reload.
    sessionStorage.setItem(RELOAD_KEY, JSON.stringify({
      micMode,
      ttsProvider: TTS_PROVIDER,
      fullVoiceMode,
      claudeMode,
      locationEnabled,
      cameraState,
      autoCaptureActive,
    }));
    location.reload();
  });
})();
</script>

<script>
// ═══════════════════════════════════════════════════════════
//  COGNITIVE MODE — real-time llmem-gw monitoring
// ═══════════════════════════════════════════════════════════
// Activated by #mode cognitive, deactivated by #mode default.
// Overlays a terminal-style chat + auto-refreshing dashboard
// + Samaritan-style cards with live countdowns on the right.

const cognContainer   = document.getElementById('cogn-container');
const cognChat        = document.getElementById('cogn-chat');
const cognInput       = document.getElementById('cogn-input');
const cognSendBtn     = document.getElementById('cogn-send');
const cognDashContent = document.getElementById('cogn-dash-content');
const cognDashAge     = document.getElementById('cogn-dash-age');
const cognClockEl     = document.getElementById('cogn-clock');
const cognCardStack   = document.getElementById('cogn-card-stack');
const cognDataStack   = document.getElementById('cogn-data-stack');
const cognToolsCol    = document.getElementById('cogn-tools-col');
const cognMemContent  = document.getElementById('cogn-mem-content');

let cognMode           = false;
let cognPollTimer      = null;
let cognClockTimer     = null;   // 1s — drives clock + countdown ticks
let cognPollInProgress = false;
let cognPollCount      = 0;
let cognLastPlan       = '';
let cognLastCogn       = '';

// Parsed timer data — keyed by timer name
// Each value: { status, interval, last_run, next_run, next_run_ts, last_run_ts, runs, dur }
let cognTimerData  = {};
// Parsed !cogn feedback — keyed by timer name
// Each value: { ratio, strength, maxStr, streak, verdictIcon }
let cognFeedback   = {};

// ── Cognitive loop definitions for cards ────────────────────
const COGN_LOOPS = [
  { timer: 'reflection',    label: 'REFLECTION' },
  { timer: 'prospective',   label: 'PROSPECTIVE' },
  { timer: 'contradiction', label: 'CONTRADICTION' },
  { timer: 'temporal_inference', label: 'TEMPORAL' },
];

// ── Poll session IDs (separate from user chat session) ──────
// Derive cognitive SIDs from SESSION_ID so each tab gets isolated llmem-gw sessions
const _cognSuffix   = SESSION_ID.replace(/^sam-/, '');
const COGN_SID_T = 'cogn-timers-' + _cognSuffix;
const COGN_SID_M = 'cogn-mem-' + _cognSuffix;
const COGN_SID_P = 'cogn-plan-' + _cognSuffix;
const COGN_SID_C = 'cogn-cogn-' + _cognSuffix;
const COGN_SID_DG = 'cogn-dc-g-' + _cognSuffix;
const COGN_SID_DB = 'cogn-dc-b-' + _cognSuffix;
const COGN_SID_DT = 'cogn-dc-t-' + _cognSuffix;
// All session IDs used by cognitive mode (for db switching)
const COGN_ALL_SIDS = [COGN_SID_T, COGN_SID_M, COGN_SID_P, COGN_SID_C,
                       COGN_SID_DG, COGN_SID_DB, COGN_SID_DT];

let cognDb = null;  // currently active db for cognitive sessions

// ── Helpers ─────────────────────────────────────────────────
function cognUpdateClock() {
  cognClockEl.textContent = new Date().toTimeString().slice(0, 8);
}

async function cognCmd(cmd, sid) {
  try {
    const r = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text: cmd, client_id: sid, wait: true }),
    });
    if (!r.ok) return '(error: HTTP ' + r.status + ')';
    const j = await r.json();
    return j.text || '(no data)';
  } catch (e) {
    return '(error: ' + e.message + ')';
  }
}

// ── Switch db on all cognitive sessions ─────────────────────
async function cognSwitchDb(name) {
  if (!name) return;
  cognDb = name;
  // Switch all cognitive sessions AND the main chat session
  const allSids = [...COGN_ALL_SIDS, SESSION_ID];
  await Promise.all(allSids.map(sid => cognCmd('!db switch ' + name, sid)));
  cognAppendMsg('system', 'DB switched to [' + name + '] on all sessions.');
  // Trigger immediate poll to refresh all panels
  cognPoll();
}

// ── Timer table parser ──────────────────────────────────────
// Parses the formatted text table from !timers into structured data.
function parseTimerTable(text) {
  const result = {};
  for (const line of text.split('\n')) {
    // Match rows: name  <icon>status  interval  last_run  next_run  runs  dur
    // Status keywords: sleeping, running, disabled, starting, error
    // last_run and next_run may be "HH:MM:SS" (1 token) or "MM-DD HH:MM" (2 tokens)
    const TS = '(?:\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}|\\S+)';
    const m = line.match(
      new RegExp('^(\\S+)\\s+.*?(sleeping|running|disabled|starting|error)\\s+(\\S+)\\s+(' + TS + ')\\s+(' + TS + ')\\s+(\\d+)\\s+(\\S+)')
    );
    if (!m) continue;
    const name    = m[1];
    const lastRun = m[4].trim();
    const nextRun = m[5].trim();
    result[name] = {
      status:   m[2],
      interval: m[3],
      last_run: lastRun,
      next_run: nextRun,
      runs:     parseInt(m[6]),
      dur:      m[7],
      next_run_ts: parseTimerTs(nextRun),
      last_run_ts: parseTimerTs(lastRun),
    };
  }
  return result;
}

// Convert timer timestamp ("HH:MM:SS" today, "MM-DD HH:MM" other, "never") → Date | null
function parseTimerTs(s) {
  if (!s || s === 'never' || s === '-') return null;
  const now = new Date();
  // HH:MM:SS (today)
  const hms = s.match(/^(\d{2}):(\d{2}):(\d{2})$/);
  if (hms) {
    const d = new Date(now);
    d.setHours(+hms[1], +hms[2], +hms[3], 0);
    if (d.getTime() < now.getTime() - 60000) d.setDate(d.getDate() + 1);  // past → tomorrow
    return d;
  }
  // MM-DD HH:MM (other day)
  const mdhm = s.match(/^(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
  if (mdhm) {
    return new Date(now.getFullYear(), +mdhm[1] - 1, +mdhm[2], +mdhm[3], +mdhm[4], 0);
  }
  return null;
}

// ── !cogn output parser — extract feedback per loop ─────────
function parseCognFeedback(text) {
  const fb = {};
  const sectionMap = {
    'Reflection Loop':          'reflection',
    'Prospective Memory Loop':  'prospective',
    'Contradiction Scanner':    'contradiction',
  };
  let cur = null;
  for (const line of text.split('\n')) {
    for (const [hdr, key] of Object.entries(sectionMap)) {
      if (line.includes(hdr)) { cur = key; break; }
    }
    if (cur && line.includes('feedback:')) {
      const r  = line.match(/ratio=([\d.]+|n\/a)/);
      const s  = line.match(/strength=(\d+)\/(\d+)/);
      const st = line.match(/streak=(\d+)/);
      // Detect verdict icon class
      let cls = '';
      if (line.includes('\u2713') || line.includes('useful'))     cls = 'fb-ok';
      else if (line.includes('\u2193') || line.includes('low'))   cls = 'fb-low';
      else if (line.includes('\u2717') || line.includes('THROTTLE') || line.includes('EXTINGUISH')) cls = 'fb-bad';
      fb[cur] = {
        ratio:    r  ? r[1]  : '?',
        strength: s  ? s[1]  : '?',
        maxStr:   s  ? s[2]  : '10',
        streak:   st ? st[1] : '0',
        cls,
      };
      cur = null;  // consume — only first feedback line per section
    }
  }
  return fb;
}

// ── Countdown formatter ─────────────────────────────────────
function fmtCountdown(target) {
  if (!target) return '--:--:--';
  const diff = Math.max(0, Math.floor((target.getTime() - Date.now()) / 1000));
  if (diff === 0) return '0:00:00';
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function calcProgress(lastTs, nextTs) {
  if (!lastTs || !nextTs) return 0;
  const now  = Date.now();
  const total = nextTs.getTime() - lastTs.getTime();
  if (total <= 0) return 0;
  return Math.min(1, Math.max(0, (now - lastTs.getTime()) / total));
}

// ── Data card definitions ───────────────────────────────────
// Left stack: goals, beliefs, prospective, plans
const COGN_DATA_CARDS_LEFT = [
  { id: 'cogn-dc-goals',  label: 'GOALS',       cmd: '!cogn goals',  sid: COGN_SID_DG,  color: '#8b5cf6', lines: 3 },
  { id: 'cogn-dc-beliefs',label: 'BELIEFS',      cmd: '!cogn flags',  sid: COGN_SID_DB,  color: '#0ea5e9', lines: 3 },
  { id: 'cogn-dc-prosp',  label: 'PROSPECTIVE',  cmd: '!cogn',        sid: COGN_SID_C,   color: '#f59e0b', lines: 3 },
  { id: 'cogn-dc-plans',  label: 'PLANS',        cmd: '!plan',        sid: COGN_SID_P,   color: '#22c55e', lines: 3 },
];
// Right stack (under cognition timer cards): toolstats
const COGN_DATA_CARDS_RIGHT = [
  { id: 'cogn-dc-tools',  label: 'TOOLSTATS',    cmd: '!toolstats',   sid: COGN_SID_DT,  color: '#6b7280', lines: 5, fill: true },
];
const COGN_DATA_CARDS = [...COGN_DATA_CARDS_LEFT, ...COGN_DATA_CARDS_RIGHT];
// Store current line-count per card for +/- resize
const cognDcLines = {};

// Default height per line in data card body (9px font * 1.5 line-height ≈ 14px)
const DC_LINE_H = 14;

function cognDcResize(cardId, delta) {
  const body = document.querySelector('#' + cardId + ' .cogn-dc-body');
  if (!body) return;
  const cur = cognDcLines[cardId] || 3;
  const next = Math.max(1, Math.min(30, cur + delta));
  cognDcLines[cardId] = next;
  body.style.maxHeight = (next * DC_LINE_H) + 'px';
}

// Cached data card text (updated every 30s)
const cognDcText = {};

// ── Card generation ─────────────────────────────────────────
function _buildDcCard(dc) {
  cognDcLines[dc.id] = dc.lines;
  const div = document.createElement('div');
  div.className = 'cogn-dc' + (dc.fill ? ' cogn-dc-fill' : '');
  div.id = dc.id;
  const controls = dc.fill ? '' :
    '<span class="cogn-dc-controls">' +
      '<button class="cogn-dc-btn" data-card="' + dc.id + '" data-delta="-2">\u2212</button>' +
      '<button class="cogn-dc-btn" data-card="' + dc.id + '" data-delta="2">+</button>' +
    '</span>';
  const bodyStyle = dc.fill ? '' : 'max-height:' + (dc.lines * DC_LINE_H) + 'px';
  div.innerHTML =
    '<div class="cogn-dc-header" style="background:' + dc.color + '">' +
      '<span class="cogn-dc-title">' + dc.label + '</span>' +
      controls +
    '</div>' +
    '<div class="cogn-dc-body"' + (bodyStyle ? ' style="' + bodyStyle + '"' : '') + '>LOADING...</div>';
  return div;
}

function cognBuildCards() {
  cognCardStack.innerHTML = '';
  cognDataStack.innerHTML = '';
  cognToolsCol.innerHTML = '';

  // Left stack: data cards (goals, beliefs, prospective, plans)
  for (const dc of COGN_DATA_CARDS_LEFT) {
    cognDataStack.appendChild(_buildDcCard(dc));
  }

  // Toolstats — own column, left of cognition cards
  for (const dc of COGN_DATA_CARDS_RIGHT) {
    cognToolsCol.appendChild(_buildDcCard(dc));
  }

  // Right stack: cognition timer cards
  for (const loop of COGN_LOOPS) {
    const div = document.createElement('div');
    div.className = 'cogn-card';
    div.id = 'cogn-card-' + loop.timer;
    div.innerHTML =
      '<div class="cogn-card-header">' +
        '<span class="cogn-card-icon"></span>' +
        '<span>/// COGNITION ///</span>' +
      '</div>' +
      '<div class="cogn-card-title">' + loop.label + '</div>' +
      '<div class="cogn-card-rows">' +
        '<div class="cogn-card-row"><span class="cogn-card-label">STATUS</span>'   +
          '<span class="cogn-card-val" data-f="status">\u2014</span></div>' +
        '<div class="cogn-card-row"><span class="cogn-card-label">COUNTDOWN</span>' +
          '<span class="cogn-card-val cv-countdown" data-f="countdown">--:--:--</span></div>' +
        '<div class="cogn-card-row"><span class="cogn-card-label">INTERVAL</span>' +
          '<span class="cogn-card-val" data-f="interval">\u2014</span></div>' +
        '<div class="cogn-card-row"><span class="cogn-card-label">RUNS</span>'     +
          '<span class="cogn-card-val" data-f="runs">\u2014</span></div>' +
        '<div class="cogn-card-row"><span class="cogn-card-label">LAST DUR</span>' +
          '<span class="cogn-card-val" data-f="dur">\u2014</span></div>' +
      '</div>' +
      '<div class="cogn-card-progress"><div class="cogn-card-progress-bar"></div></div>';
    cognCardStack.appendChild(div);
  }

  // Wire +/- buttons on both stacks
  document.querySelectorAll('.cogn-dc-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      cognDcResize(btn.dataset.card, parseInt(btn.dataset.delta));
    });
  });
}

// ── Card update (called after each poll + every 1s for countdowns)
function cognUpdateCards() {
  for (const loop of COGN_LOOPS) {
    const card = document.getElementById('cogn-card-' + loop.timer);
    if (!card) continue;
    const t = cognTimerData[loop.timer];

    const valOf = (f) => card.querySelector('[data-f="' + f + '"]');
    const icon  = card.querySelector('.cogn-card-icon');
    const prog  = card.querySelector('.cogn-card-progress-bar');

    if (!t) {
      // Timer not found — might not be registered yet
      valOf('status').textContent   = 'NO DATA';
      valOf('countdown').textContent = '--:--:--';
      card.className = 'cogn-card';
      icon.className = 'cogn-card-icon';
      continue;
    }

    // Status
    const sv = valOf('status');
    sv.textContent = t.status.toUpperCase();
    sv.className = 'cogn-card-val cv-status-' + t.status;

    // Card border accent
    card.classList.remove('card-running', 'card-error');
    if (t.status === 'running') card.classList.add('card-running');
    if (t.status === 'error')   card.classList.add('card-error');

    // Icon
    icon.className = 'cogn-card-icon ci-' + t.status;

    // Countdown
    const cd = valOf('countdown');
    if (t.status === 'disabled') {
      cd.textContent = 'DISABLED';
    } else if (t.status === 'running') {
      cd.textContent = 'RUNNING';
    } else {
      cd.textContent = fmtCountdown(t.next_run_ts);
    }

    // Static fields
    valOf('interval').textContent = t.interval;
    valOf('runs').textContent     = t.runs;
    valOf('dur').textContent      = t.dur;

    // Progress bar
    if (prog) {
      const pct = calcProgress(t.last_run_ts, t.next_run_ts);
      prog.style.width = (pct * 100).toFixed(1) + '%';
    }

  }
}

// ── Dashboard polling (every 10s) ───────────────────────────
async function cognPoll() {
  if (cognPollInProgress || !cognMode) return;
  cognPollInProgress = true;
  cognPollCount++;
  try {
    // Run commands sequentially (SSE streams share browser connection pool)
    const timersText = await cognCmd('!timers', COGN_SID_T);
    if (!cognMode) return;
    const memText = await cognCmd('!memstats', COGN_SID_M);
    if (!cognMode) return;

    const extendedPoll = (cognPollCount % 3 === 1);
    if (extendedPoll) {
      cognLastPlan = await cognCmd('!plan', COGN_SID_P);
      if (!cognMode) return;
      cognLastCogn = await cognCmd('!cogn', COGN_SID_C);
      if (!cognMode) return;
      cognDcText['cogn-dc-goals']   = await cognCmd('!cogn goals', COGN_SID_DG);
      if (!cognMode) return;
      cognDcText['cogn-dc-beliefs'] = await cognCmd('!cogn flags', COGN_SID_DB);
      if (!cognMode) return;
      cognDcText['cogn-dc-tools']   = await cognCmd('!toolstats',  COGN_SID_DT);
      if (!cognMode) return;

      cognFeedback = parseCognFeedback(cognLastCogn);
      cognDcText['cogn-dc-prosp']   = cognLastCogn;
      cognDcText['cogn-dc-plans']   = cognLastPlan;
      cognUpdateDataCards();
    }

    // Parse timer table → structured data for countdown cards
    cognTimerData = parseTimerTable(timersText);
    cognUpdateCards();

    // Dashboard: timers only
    cognDashContent.textContent = timersText;

    // Memstats: separate right panel
    cognMemContent.textContent = memText;
    cognDashAge.textContent = 'UPDATED ' + new Date().toTimeString().slice(0, 8);
  } catch (e) {
    cognDashAge.textContent = 'POLL ERROR: ' + e.message;
  } finally {
    cognPollInProgress = false;
  }
}

// ── Update data cards with polled text ──────────────────────
function cognUpdateDataCards() {
  for (const dc of COGN_DATA_CARDS) {
    const body = document.querySelector('#' + dc.id + ' .cogn-dc-body');
    if (!body) continue;
    const text = cognDcText[dc.id];
    if (text) body.textContent = text;
  }
}

// ── 1s tick — clock + countdown + progress bars ─────────────
function cognTick() {
  if (!cognMode) return;
  cognUpdateClock();
  cognUpdateCards();
}

// ── Chat log ────────────────────────────────────────────────
function cognAppendMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'cogn-msg cogn-msg-' + role;
  if (role === 'system') {
    div.textContent = text;
  } else {
    const pfx = document.createElement('span');
    pfx.className = 'cogn-msg-prefix';
    pfx.textContent = role === 'user' ? '\u25b6 ' : '\u25c0 ';
    const txt = document.createElement('span');
    txt.className = 'cogn-msg-text';
    txt.textContent = text;
    div.appendChild(pfx);
    div.appendChild(txt);
    if (role === 'assistant') {
      const cur = document.createElement('span');
      cur.className = 'cogn-cursor';
      div.appendChild(cur);
    }
  }
  cognChat.appendChild(div);
  cognChat.scrollTop = cognChat.scrollHeight;
  return div;
}

// ── Chat submit (SSE streaming into chat log) ───────────────
async function cognChatSubmit(text) {
  cognAppendMsg('user', text);
  cognSendBtn.disabled = true;

  if (activeEvtSource) { activeEvtSource.close(); activeEvtSource = null; }
  isStreaming = true;

  try {
    let submitResp;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        if (attempt > 0) await new Promise(r => setTimeout(r, 600));
        submitResp = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ text: text, client_id: SESSION_ID, location: _locationData() }),
        });
        if (submitResp.ok) break;
      } catch (_) { if (attempt === 2) throw new Error('Submit failed after retries'); }
    }
    if (!submitResp?.ok) throw new Error('Submit failed: ' + (submitResp?.status || 'network'));
  } catch (e) {
    cognAppendMsg('system', 'SUBMIT ERROR: ' + e.message);
    isStreaming = false;
    cognSendBtn.disabled = false;
    return;
  }

  const evtSource = new EventSource(authedUrl('/api/stream/' + SESSION_ID));
  activeEvtSource = evtSource;
  const mySessionId = SESSION_ID;

  const msgEl   = cognAppendMsg('assistant', '');
  const textEl  = msgEl.querySelector('.cogn-msg-text');
  const cursorEl = msgEl.querySelector('.cogn-cursor');
  let fullText = '';

  let _pfxBuf = '', _pfxDone = false;
  function stripPfx(raw) {
    if (_pfxDone) return raw;
    _pfxBuf += raw;
    if (!_pfxBuf.startsWith('<')) { _pfxDone = true; const r = _pfxBuf; _pfxBuf = ''; return r; }
    const m = _pfxBuf.match(/^(<<[^>]*>>\s*(?::\s*)?)+/);
    if (m && m[0].includes('>>')) { _pfxDone = true; const r = _pfxBuf.slice(m[0].length); _pfxBuf = ''; return r; }
    if (_pfxBuf.length > 80) { _pfxDone = true; const r = _pfxBuf; _pfxBuf = ''; return r; }
    return '';
  }

  evtSource.onmessage = (e) => {
    if (mySessionId !== SESSION_ID) { evtSource.close(); return; }
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'tok' || data.type === 'flush') {
        const cleaned = stripPfx(data.text || '');
        if (cleaned) {
          fullText += cleaned;
          textEl.textContent = fullText;
          cognChat.scrollTop = cognChat.scrollHeight;
        }
      } else if (data.type === 'done') {
        evtSource.close(); activeEvtSource = null;
        isStreaming = false;
        cognSendBtn.disabled = false;
        if (cursorEl) cursorEl.classList.add('off');
        cognPoll();
      } else if (data.type === 'error') {
        evtSource.close(); activeEvtSource = null;
        isStreaming = false;
        cognSendBtn.disabled = false;
        if (cursorEl) cursorEl.classList.add('off');
        if (data.message) cognAppendMsg('system', 'ERROR: ' + data.message);
      }
    } catch (_) {}
  };

  evtSource.onerror = () => {
    evtSource.close(); activeEvtSource = null;
    isStreaming = false;
    cognSendBtn.disabled = false;
    if (cursorEl) cursorEl.classList.add('off');
  };
}

// ── Input handling ──────────────────────────────────────────
function cognDoSubmit() {
  const text = cognInput.value.trim();
  if (!text) return;
  cognInput.value = '';
  if (text.startsWith('#')) { handleCommand(text); return; }
  cognChatSubmit(text);
}

cognSendBtn.addEventListener('click', () => cognDoSubmit());
cognInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') cognDoSubmit();
});

// ── Mode enter / exit ───────────────────────────────────────
function enterCognMode() {
  if (cognMode) return;
  cognMode = true;

  if (typeof isListening !== 'undefined' && isListening) {
    if (typeof getActiveProvider === 'function') getActiveProvider()?.stop();
  }
  if (activeEvtSource) { activeEvtSource.close(); activeEvtSource = null; isStreaming = false; }

  document.getElementById('layout').style.display = 'none';
  cognContainer.classList.add('active');

  // Build card DOM
  cognBuildCards();

  // Start 1s tick (clock + countdowns) and 10s poll
  cognTick();
  cognClockTimer = setInterval(cognTick, 1000);
  cognPollCount = 0;
  cognLastPlan = '';
  cognLastCogn = '';
  cognTimerData = {};
  cognFeedback = {};

  cognInput.focus();
  cognAppendMsg('system', 'COGNITIVE MODE ACTIVE \u2014 monitoring llmem-gw at 10s resolution.');
  cognAppendMsg('system', 'Type #mode default to return. Use #db <name> to switch database.');

  // Detect active db from main session, then sync all cognitive sessions
  (async () => {
    let initDb = cognDb;
    if (!initDb) {
      // Parse db name from !memstats output: "db: **<name>**" or "db: <name>"
      const ms = await cognCmd('!memstats', SESSION_ID);
      const m = ms.match(/\bdb:\s*\*{0,2}(\w+)\*{0,2}/);
      initDb = m ? m[1] : 'default';
    }
    cognDb = initDb;
    await Promise.all(COGN_ALL_SIDS.map(sid => cognCmd('!db switch ' + initDb, sid)));
    cognAppendMsg('system', 'Cognitive sessions synced to DB: [' + initDb + ']');
    cognPoll();
    cognPollTimer = setInterval(cognPoll, 10000);
  })();
}

function exitCognMode() {
  if (!cognMode) return;
  cognMode = false;

  clearInterval(cognPollTimer);  cognPollTimer = null;
  clearInterval(cognClockTimer); cognClockTimer = null;

  if (activeEvtSource) { activeEvtSource.close(); activeEvtSource = null; isStreaming = false; }

  cognContainer.classList.remove('active');
  document.getElementById('layout').style.display = 'flex';

  cognChat.innerHTML = '';
  cognCardStack.innerHTML = '';
  cognDataStack.innerHTML = '';
  cognToolsCol.innerHTML = '';
  cognDashContent.textContent = 'INITIALIZING...';
  cognDashAge.textContent = '';
  cognMemContent.textContent = 'LOADING...';
  cognTimerData = {};
  cognFeedback = {};
  for (const k in cognDcText) delete cognDcText[k];
  for (const k in cognDcLines) delete cognDcLines[k];

  showIdle(true);
  setStatus('STANDBY', false);
  resetIdleTimer();
}
</script>
