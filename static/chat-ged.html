<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GED Study — Lee v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
    onload="window._katexReady=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typo-js@1.2.4/typo.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
    window._mermaid = mermaid;
    window._mermaidReady = true;
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #FAFAFA;
      --bg-alt:       #F3F3F5;
      --text:         #1A1A1A;
      --text-muted:   #6B7280;
      --accent:       #7C3AED;
      --accent-light: #EDE9FE;
      --border:       #E5E7EB;
      --bubble-user:  #7C3AED;
      --bubble-asst:  #F3F3F5;
      --input-bg:     #FFFFFF;
      --shadow:       rgba(0,0,0,0.08);
      --sidebar-w:    260px;
    }

    [data-theme="dark"] {
      --bg:           #1A1A1A;
      --bg-alt:       #111111;
      --text:         #E5E5E5;
      --text-muted:   #9CA3AF;
      --accent:       #A78BFA;
      --accent-light: #2D1F5E;
      --border:       #2D2D2D;
      --bubble-user:  #A78BFA;
      --bubble-asst:  #242424;
      --input-bg:     #1F1F1F;
      --shadow:       rgba(0,0,0,0.3);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100%;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, min-width 0.25s ease, opacity 0.2s ease;
      overflow: hidden;
      z-index: 10;
      flex-shrink: 0;
    }
    #sidebar.collapsed {
      width: 0;
      min-width: 0;
      opacity: 0;
      pointer-events: none;
    }

    #sidebar-inner {
      width: var(--sidebar-w);
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 4px 12px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #new-chat-btn {
      width: 100%;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.15s;
    }
    #new-chat-btn:hover { opacity: 0.88; }

    #sidebar-section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 12px 16px 6px;
      flex-shrink: 0;
    }

    #db-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px;
    }

    .db-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text);
      transition: background 0.12s;
      overflow: hidden;
      user-select: none;
    }
    .db-row:hover { background: var(--border); }
    .db-row.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
    .db-row-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .db-row-icon { flex-shrink: 0; font-size: 13px; opacity: 0.6; }
    .ged-subject-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      user-select: none;
      transition: background 0.1s;
    }
    .ged-subject-row:hover { background: var(--border); color: var(--text); }
    .ged-subject-row.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
    .db-trash {
      flex-shrink: 0;
      background: none;
      border: none;
      padding: 2px 4px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.1s, color 0.1s;
    }
    .db-row:hover .db-trash { opacity: 1; }
    .db-trash:hover { color: #EF4444; }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }

    #hamburger {
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    #hamburger:hover { color: var(--text); }
    #hamburger span {
      display: block;
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }

    #current-db-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Chat area ── */
    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 8px;
    }

    #chat-messages {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Empty state / Subject picker ── */
    #empty-state {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #empty-state.hidden { opacity: 0; pointer-events: none; display: none; }
    #empty-state h1 {
      font-size: 30px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    #empty-state p { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; }
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      max-width: 640px;
      width: 90%;
    }
    .subject-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 28px 16px;
      border-radius: 14px;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
      user-select: none;
    }
    .subject-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 20px var(--shadow);
      transform: translateY(-2px);
    }
    .subject-card-icon { font-size: 36px; line-height: 1; }
    .subject-card-label { font-size: 15px; font-weight: 500; color: var(--text); }

    /* Hide chat + input + topbar when subject not yet chosen */
    body.empty-mode #chat-scroll { display: none; }
    body.empty-mode #input-area { display: none; }
    body.empty-mode #topbar { display: none; }

    /* ── Message bubbles ── */
    .msg-row {
      display: flex;
      flex-direction: column;
    }
    .msg-row.user { align-items: flex-end; }
    .msg-row.assistant { align-items: flex-start; }

    .msg-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 16px;
      max-width: 85%;
      word-break: break-word;
    }
    .msg-row.user .msg-bubble {
      background: var(--bubble-user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .msg-bubble {
      background: var(--bubble-asst);
      color: var(--text);
      border-bottom-left-radius: 4px;
      max-width: 100%;
    }

    /* Answer choices: letter + value in aligned rows */
    .answer-choices {
      margin: 8px 0;
    }
    .answer-row {
      display: flex;
      align-items: baseline;
      margin: 5px 0;
      line-height: 1.6;
    }
    .answer-letter {
      font-weight: 600;
      width: 2em;
      flex-shrink: 0;
    }
    .answer-value {
      margin-left: 0.5em;
    }
    /* Force KaTeX inside answer values to render inline and left-aligned */
    .answer-value .katex-display {
      display: inline !important;
      margin: 0 !important;
      padding: 0 !important;
      text-align: left !important;
    }
    .answer-value .katex-display > .katex {
      text-align: left !important;
    }
    .answer-value .katex {
      font-size: 1.1em;
    }

    /* Markdown inside bubbles */
    .msg-bubble strong { font-weight: 600; }
    .msg-bubble em { font-style: italic; }
    .msg-bubble code {
      font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 0.88em;
      background: rgba(0,0,0,0.08);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .msg-row.user .msg-bubble code { background: rgba(255,255,255,0.2); }
    .msg-bubble pre {
      background: rgba(0,0,0,0.07);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
      line-height: 1.5;
    }
    [data-theme="dark"] .msg-bubble pre { background: rgba(0,0,0,0.3); }
    .msg-bubble pre code { background: none; padding: 0; }
    .msg-bubble p + p { margin-top: 10px; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 6px 0; }
    .msg-bubble li { margin: 3px 0; }
    .msg-bubble table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
    .msg-bubble th, .msg-bubble td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    .msg-bubble th { background: var(--bg-alt, rgba(0,0,0,0.04)); font-weight: 600; }
    [data-theme="dark"] .msg-bubble th { background: rgba(255,255,255,0.06); }
    .mermaid-chart { margin: 10px 0; padding-bottom: 20px; overflow: visible; }
    .mermaid-chart svg { max-width: 100%; height: auto; overflow: visible; }
    .svg-diagram { margin: 10px 0; text-align: center; overflow: visible; }
    .svg-diagram svg { max-width: 100%; height: auto; overflow: visible; }
    .svg-diagram svg text { fill: #000 !important; }

    .memory-sep {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 6px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin: 4px 0;
    }

    /* Typing cursor */
    .streaming-cursor::after {
      content: '▋';
      animation: blink 1s step-end infinite;
      color: var(--accent);
      font-size: 0.9em;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Input area ── */
    #input-area {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 12px 16px 16px;
      flex-shrink: 0;
    }

    /* Centered layout when no messages */
    #input-wrapper {
      max-width: 720px;
      margin: 0 auto;
    }

    /* (empty-mode hides chat + input via rules above) */

    #input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 8px 6px 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

    #text-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      resize: none;
      line-height: 1.5;
      max-height: calc(6 * 1.5 * 15px);
      overflow-y: auto;
      padding: 4px 0;
    }
    #text-input::placeholder { color: var(--text-muted); }

    .input-btn {
      background: none;
      border: none;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s, background 0.12s;
      flex-shrink: 0;
    }
    .input-btn:hover { color: var(--text); background: var(--border); }
    .input-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #send-btn {
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
    }
    #send-btn:hover { opacity: 0.88; background: var(--accent); color: #fff; }
    #send-btn:disabled { opacity: 0.35; }

    #mic-btn.active { color: #EF4444; }
    #mic-btn.active svg { animation: pulse-red 1.5s ease-in-out infinite; }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #tts-btn.active { color: var(--accent); }

    #toolbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px 0;
    }

    #model-select {
      font-family: inherit;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      outline: none;
    }
    #model-select:focus { border-color: var(--accent); }

    #status-text {
      font-size: 12px;
      color: var(--text-muted);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Scrollbar ── */
    #chat-scroll::-webkit-scrollbar { width: 4px; }
    #chat-scroll::-webkit-scrollbar-track { background: transparent; }
    #chat-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #db-list::-webkit-scrollbar { width: 4px; }
    #db-list::-webkit-scrollbar-track { background: transparent; }
    #db-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      :root { --sidebar-w: 80vw; }
      #sidebar:not(.collapsed) {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 50;
        box-shadow: 4px 0 20px rgba(0,0,0,0.15);
      }
      #sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 40;
      }
      #sidebar-overlay.visible { display: block; }
      #chat-messages { padding: 16px 12px 8px; }
      .msg-bubble { font-size: 15px; }
    }
  </style>
</head>
<body class="empty-mode">

  <!-- Sidebar overlay for mobile -->
  <div id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-inner">
      <div id="sidebar-header" style="display:none">
        <button id="new-chat-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Chat
        </button>
      </div>
      <div id="sidebar-section-label" style="display:none">Chats</div>
      <div id="db-list" style="display:none">
        <!-- DB rows hidden in GED mode -->
      </div>
      <!-- GED Subject Quick-Switch -->
      <div class="sidebar-section-label" style="margin-top:4px">GED Subjects</div>
      <div id="ged-subject-list">
        <div class="ged-subject-row" data-model="ged-math">📐 Math</div>
        <div class="ged-subject-row" data-model="ged-rla-reading">📖 Reading</div>
        <div class="ged-subject-row" data-model="ged-rla-writing">✏️ Writing</div>
        <div class="ged-subject-row" data-model="ged-science">🔬 Science</div>
        <div class="ged-subject-row" data-model="ged-social">🌍 Social Studies</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div id="main">
    <!-- Top bar -->
    <div id="topbar">
      <button id="hamburger" title="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
      <div id="current-db-label">—</div>
    </div>

    <!-- Chat scroll area -->
    <div id="chat-scroll">
      <div id="chat-messages"></div>
    </div>

    <!-- Subject picker (shown until a subject is chosen) -->
    <div id="empty-state">
      <h1>GED Study</h1>
      <p id="empty-subtitle">Choose a subject to begin</p>
      <div class="subject-grid">
        <div class="subject-card" data-model="ged-math">
          <span class="subject-card-icon">📐</span>
          <span class="subject-card-label">Math</span>
        </div>
        <div class="subject-card" data-model="ged-rla-reading">
          <span class="subject-card-icon">📖</span>
          <span class="subject-card-label">Reading</span>
        </div>
        <div class="subject-card" data-model="ged-rla-writing">
          <span class="subject-card-icon">✏️</span>
          <span class="subject-card-label">Writing</span>
        </div>
        <div class="subject-card" data-model="ged-science">
          <span class="subject-card-icon">🔬</span>
          <span class="subject-card-label">Science</span>
        </div>
        <div class="subject-card" data-model="ged-social">
          <span class="subject-card-icon">🌍</span>
          <span class="subject-card-label">Social Studies</span>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div id="input-area">
      <div id="input-wrapper">
        <div id="input-row">
          <textarea id="text-input" rows="1" placeholder="Message Claude..." autocomplete="off" spellcheck="true"></textarea>
          <button class="input-btn" id="mic-btn" title="Voice input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button class="input-btn" id="tts-btn" title="Toggle voice output">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          </button>
          <button class="input-btn" id="send-btn" title="Send (Enter)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
        <div id="toolbar-row">
          <select id="model-select" title="Select model">
            <option value="">Loading…</option>
          </select>
          <div id="status-text"></div>
        </div>
      </div>
    </div>
  </div>

<script>
'use strict';

// ── Auth ──────────────────────────────────────────────────────
// Auth is handled by the session cookie set at /login — no Bearer header needed.
// The _apiKey is kept only for the SSE ?token= fallback (EventSource can't set headers).
const _apiKey = '%%SAMARITAN_API_KEY%%';
function authHeaders() { return {}; }

// ── Session ID ────────────────────────────────────────────────
const SESSION_KEY = 'chat_session_id';
let SESSION_ID = sessionStorage.getItem(SESSION_KEY);
if (!SESSION_ID) {
  SESSION_ID = 'chat-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  sessionStorage.setItem(SESSION_KEY, SESSION_ID);
}

// ── Theme ─────────────────────────────────────────────────────
(function applyTheme() {
  const h = new Date().getHours();
  document.documentElement.setAttribute('data-theme', (h < 7 || h >= 20) ? 'dark' : 'light');
})();

// ── DOM refs ──────────────────────────────────────────────────
const sidebar       = document.getElementById('sidebar');
const sidebarOvl    = document.getElementById('sidebar-overlay');
const hamburger     = document.getElementById('hamburger');
const newChatBtn    = document.getElementById('new-chat-btn');
const dbList        = document.getElementById('db-list');
const currentDbLbl  = document.getElementById('current-db-label');
const chatMessages  = document.getElementById('chat-messages');

// ── Claude dispatch mode ──────────────────────────────────────
// All input routes through rc-style tmux dispatch to Claude Code.
// No voice relay polling loop — messages sent via tmux send-keys.
const CLAUDE_DISPATCH_URL = '/api/claude';
let claudeMode = true;  // chat-ged always routes through Claude Code
let claudeChannel = 'default';  // set when subject is selected

// Map GED model keys to dispatch channel names
const _CLAUDE_CHANNEL_MAP = {
  'ged-math':        'ged-math',
  'ged-rla-reading': 'ged-reading',
  'ged-rla-writing': 'ged-writing',
  'ged-science':     'ged-science',
  'ged-social':      'ged-social',
};

async function claudeSubmit(text) {
  if (!claudeMode || isStreaming) return;
  if (claudeChannel === 'default') {
    setStatus('Select a subject first');
    setTimeout(() => setStatus('🟣 Claude mode — select a subject'), 2000);
    return;
  }
  if (gedBackend !== 'claude') { return await geminiSubmit(text); }
  isStreaming = true;
  sendBtn.disabled = true;

  // Auto-start workspace if Claude isn't running
  try {
    const statusResp = await fetch(
      CLAUDE_DISPATCH_URL + '/status?channel=' + encodeURIComponent(claudeChannel),
      { headers: authHeaders() }
    );
    const statusData = await statusResp.json();
    if (!statusData.enabled) {
      // Count-up timer so the user sees progress, not a frozen screen
      let _startSecs = 0;
      const _startTimer = setInterval(() => {
        _startSecs++;
        setStatus(`Starting tutor… ${_startSecs}s`);
      }, 1000);

      // Fire the launch request — may take up to 60s for cold start
      let startData;
      try {
        const startResp = await fetch('/api/ged/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ channel: claudeChannel }),
        });
        startData = await startResp.json();
      } catch (e) {
        clearInterval(_startTimer);
        setStatus('Could not reach server');
        isStreaming = false;
        sendBtn.disabled = false;
        return;
      }

      if (startData.status === 'started' || startData.status === 'already_running') {
        clearInterval(_startTimer);
        setStatus('Tutor ready!');
      } else if (startData.status === 'timeout') {
        // Server-side polling ran out — continue polling from frontend
        let ready = false;
        for (let i = 0; i < 15; i++) {
          await new Promise(r => setTimeout(r, 2000));
          try {
            const recheck = await fetch(
              CLAUDE_DISPATCH_URL + '/status?channel=' + encodeURIComponent(claudeChannel),
              { headers: authHeaders() }
            );
            const recheckData = await recheck.json();
            if (recheckData.enabled) { ready = true; break; }
          } catch (_) {}
        }
        clearInterval(_startTimer);
        if (!ready) {
          setStatus('Tutor is still starting — send your message again in a moment');
          isStreaming = false;
          sendBtn.disabled = false;
          return;
        }
        setStatus('Tutor ready!');
      } else {
        setStatus('Could not start tutor: ' + (startData.error || startData.status));
        isStreaming = false;
        sendBtn.disabled = false;
        return;
      }
    }
  } catch (e) {
    // Status check failed — proceed anyway, submit will fail with 503 if dispatch is down
  }

  setStatus('Claude thinking…');
  addMessage('user', text);
  const asst = addMessage('assistant', '', true);

  try {
    // Retry submit up to 3 times (mobile network can drop momentarily)
    let submitResp;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        if (attempt > 0) await new Promise(r => setTimeout(r, 1000));
        submitResp = await fetch(CLAUDE_DISPATCH_URL + '/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ text, source: 'chat-ged', channel: claudeChannel }),
        });
        if (submitResp.ok) break;
      } catch (e) {
        if (attempt === 2) throw new Error('Dispatch submit failed after 3 retries');
      }
    }
    if (!submitResp?.ok) throw new Error('Dispatch submit failed: ' + submitResp?.status);

    setStatus('Claude responding…');
    let response = null;
    const deadline = Date.now() + 90000;
    while (!response && Date.now() < deadline) {
      try {
        const pollResp = await fetch(
          CLAUDE_DISPATCH_URL + '/poll?wait=10&channel=' + encodeURIComponent(claudeChannel),
          { headers: authHeaders() }
        );
        const pollData = await pollResp.json();
        if (pollData.status === 'ok') {
          response = pollData;
          break;
        }
      } catch (pollErr) {
        // Network error (Pinggy drop) — retry
        console.warn('[dispatch] poll error, retrying:', pollErr.message);
      }
    }

    if (response) {
      // Fix math split across lines, then render
      let cleaned = response.text;
      cleaned = cleaned.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => '$$' + expr.replace(/\s*\n\s*/g, ' ').trim() + '$$');
      asst.innerHTML = renderMarkdown(cleaned);
      fixAnswerChoices(asst);  // restructure DOM before KaTeX renders
      renderMath(asst);        // KaTeX converts $$ to .katex-display
      renderMermaid(asst);
      scrollToBottom();
      if (ttsEnabled) speakText(response.text);
      gedHistory.push({ role: 'user', text });
      gedHistory.push({ role: 'assistant', text: response.text });
    } else {
      asst.innerHTML = '<em>Claude did not respond in time.</em>';
    }
  } catch (e) {
    asst.innerHTML = '<em>Claude error: ' + e.message + '</em>';
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    setStatus(claudeMode ? '🟣 Claude' : '');
  }
}

// ── Gemini fallback submit ────────────────────────────────────
async function geminiSubmit(text) {
  if (isStreaming) return;
  isStreaming = true;
  sendBtn.disabled = true;
  setStatus('✦ Gemini thinking…');
  addMessage('user', text);
  const asst = addMessage('assistant', '', true);
  try {
    const resp = await fetch('/api/ged/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text, channel: claudeChannel, history: gedHistory.slice(-10) }),
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    let cleaned = data.text;
    cleaned = cleaned.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => '$$' + expr.replace(/\s*\n\s*/g, ' ').trim() + '$$');
    asst.innerHTML = renderMarkdown(cleaned);
    fixAnswerChoices(asst);
    renderMath(asst);
    renderMermaid(asst);
    scrollToBottom();
    if (ttsEnabled) speakText(data.text);
    gedHistory.push({ role: 'user', text });
    gedHistory.push({ role: 'assistant', text: data.text });
  } catch (e) {
    asst.innerHTML = '<em>Gemini error: ' + e.message + '</em>';
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    setStatus('✦ Gemini 2.5 Flash');
  }
}

// ── Simple markdown renderer ──────────────────────────────────
// Run KaTeX auto-render on a DOM element after its innerHTML is set.
function renderMath(el) {
  if (!window._katexReady || typeof renderMathInElement === 'undefined') return;
  renderMathInElement(el, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '\\(', right: '\\)', display: false },
    ],
    throwOnError: false,
  });
  // Fix answer choices: convert display math to inline on lines starting with A) B) C) D)
  // KaTeX renders $$...$$ as block-level .katex-display, which centers the math away from
  // the answer letter. We find those and convert them to inline.
  // fixAnswerChoices is called BEFORE renderMath by the caller,
  // so KaTeX renders inside .answer-value spans (forced inline via CSS).
}

// Fix answer choices: DOM-based approach that handles both:
// 1. Single <p> with <br>-separated choices: <p>A) ...<br>B) ...<br>C) ...<br>D) ...</p>
// 2. Separate <p> per choice: <p>A) ...</p><p>B) ...</p>...
// Must run BEFORE renderMath so $$ delimiters are still in text.
function fixAnswerChoices(el) {
  // Find <p> elements that contain answer choice patterns (A) B) C) D) after <br> tags).
  // Choices may be mixed with question text and hints in the same <p>.
  const allP = Array.from(el.querySelectorAll('p'));

  for (let i = 0; i < allP.length; i++) {
    const p = allP[i];
    const html = p.innerHTML;
    if (!html.includes('<br>')) continue;

    const parts = html.split(/<br\s*\/?>/).map(s => s.trim());
    const choiceIndices = [];
    parts.forEach((s, idx) => { if (/^[A-D][):.]\s/.test(s)) choiceIndices.push(idx); });
    if (choiceIndices.length < 2) continue;

    // Split the <p> into: before choices, choice grid, after choices
    const firstChoice = choiceIndices[0];
    const lastChoice = choiceIndices[choiceIndices.length - 1];

    const beforeParts = parts.slice(0, firstChoice).filter(Boolean);
    const choiceParts = parts.filter(s => /^[A-D][):.]\s/.test(s));
    const afterParts = parts.slice(lastChoice + 1).filter(Boolean);

    // Build replacement
    let replacement = '';
    if (beforeParts.length) {
      replacement += '<p>' + beforeParts.join('<br>') + '</p>';
    }

    replacement += '<div class="answer-choices">';
    choiceParts.forEach(ch => {
      const letter = ch.slice(0, 2);
      const value = ch.slice(2).trim();
      replacement += '<div class="answer-row"><span class="answer-letter">' +
        letter + '</span><span class="answer-value">' + value + '</span></div>';
    });
    replacement += '</div>';

    if (afterParts.length) {
      replacement += '<p>' + afterParts.join('<br>') + '</p>';
    }

    // Replace the <p> with the split content
    const wrapper = document.createElement('div');
    wrapper.innerHTML = replacement;
    while (wrapper.firstChild) {
      p.parentNode.insertBefore(wrapper.firstChild, p);
    }
    p.remove();
  }

  // Also handle Case 2: consecutive <p> elements each with one choice
  const freshP = Array.from(el.querySelectorAll('p'));
  for (let i = 0; i < freshP.length; i++) {
    const p = freshP[i];
    if (!/^[A-D][):.]\s/.test(p.textContent.trim())) continue;
    const group = [p];
    let next = p.nextElementSibling;
    while (next && next.tagName === 'P' && /^[A-D][):.]\s/.test(next.textContent.trim())) {
      group.push(next);
      next = next.nextElementSibling;
    }
    if (group.length < 2) continue;
    const container = document.createElement('div');
    container.className = 'answer-choices';
    group.forEach(gp => {
      const row = document.createElement('div');
      row.className = 'answer-row';
      const gpHtml = gp.innerHTML.trim();
      row.innerHTML = '<span class="answer-letter">' + gpHtml.slice(0, 2) +
        '</span><span class="answer-value">' + gpHtml.slice(2).trim() + '</span>';
      container.appendChild(row);
    });
    group[0].replaceWith(container);
    group.slice(1).forEach(gp => gp.remove());
    i += group.length - 1;
  }

  // Convert $$ to \( \) inside .answer-value spans so KaTeX renders INLINE, not display.
  el.querySelectorAll('.answer-value').forEach(v => {
    v.innerHTML = v.innerHTML.replace(/\$\$([\s\S]*?)\$\$/g, '\\($1\\)');
  });
}

// Render Mermaid diagrams inside a DOM element.
async function renderMermaid(el) {
  if (!window._mermaidReady || !window._mermaid) {
    console.warn('Mermaid not ready:', !!window._mermaidReady, !!window._mermaid);
    return;
  }
  // Find all code blocks — check both fenced mermaid and unfenced with mermaid keywords
  const allPres = el.querySelectorAll('pre');
  for (const pre of allPres) {
    const code = pre.querySelector('code');
    if (!code) continue;
    let src = code.textContent.trim();
    if (!src) continue;
    const isMermaidClass = code.classList.contains('language-mermaid');
    const isMermaidContent = /^(xychart-beta|xychart|pie|flowchart|graph|sequenceDiagram|gantt)\b/.test(src);
    if (!isMermaidClass && !isMermaidContent) continue;
    // Fix common xychart syntax issues from LLM output:
    // 0. xychart-beta → xychart (v11 dropped -beta)
    src = src.replace(/\bxychart-beta\b/g, 'xychart');
    // 1. Common typos in keywords
    src = src.replace(/\btitie\b/g, 'title').replace(/\btitel\b/g, 'title');
    src = src.replace(/\bx-axs\b/g, 'x-axis').replace(/\by-axs\b/g, 'y-axis');
    // 2. x-axis ["quoted" "values"] → x-axis ["quoted", "values"] (missing commas)
    src = src.replace(/(x-axis\s*\[)([^\]]+)\]/g, (m, prefix, inner) => {
      const fixed = inner.replace(/"\s+"/g, '", "').replace(/([a-zA-Z0-9°%)]+)\s+(?=")/g, '$1, ');
      return prefix + fixed + ']';
    });
    // 3. Remove special chars that break parsing (°, parentheses in labels)
    src = src.replace(/°/g, 'deg').replace(/\(([^)]*)\)/g, '$1');
    // 4. "bar series "Name"\n  data [...]" → "bar [...]" (invalid v11 syntax)
    src = src.replace(/bar\s+series\s+"[^"]*"\s*\n\s*data\s*/g, 'bar ');
    src = src.replace(/line\s+series\s+"[^"]*"\s*\n\s*data\s*/g, 'line ');
    // 5. x-axis/y-axis title handling (v11 doesn't support quoted titles on most axis forms)
    // 5a. x-axis "Title" [data...] → x-axis [data...]  (title + bracket on same line)
    src = src.replace(/x-axis[ \t]+"[^"]*"[ \t]*(\[[^\]]+\])/g, 'x-axis $1');
    // 5b. x-axis "Title"\n (title-only, no data) → x-axis\n
    src = src.replace(/x-axis\s+"[^"]*"\s*\n/g, 'x-axis\n');
    // 5c. y-axis "Title" (title-only, no numeric range) → remove line (auto-scale)
    src = src.replace(/^[ \t]*y-axis[ \t]+"[^"]*"[ \t]*$/mg, '');
    // 5d. bare y-axis keyword with no range (result of old strip) → remove line
    src = src.replace(/^[ \t]*y-axis[ \t]*$/mg, '');
    // 6. Duplicate bar lines → keep only the one with actual data values
    const barLines = src.split('\n').filter(l => /^\s*bar\s*\[/.test(l));
    if (barLines.length > 1) {
      // Keep the last bar line (usually has the actual values), remove others
      let kept = false;
      src = src.split('\n').reverse().map(l => {
        if (/^\s*bar\s*\[/.test(l)) {
          if (kept) return null;
          kept = true;
        }
        return l;
      }).reverse().filter(l => l !== null).join('\n');
    }
    try {
      const id = 'mermaid-' + Math.random().toString(36).slice(2, 10);
      const { svg } = await window._mermaid.render(id, src);
      const div = document.createElement('div');
      div.className = 'mermaid-chart';
      div.innerHTML = svg;
      pre.replaceWith(div);
    } catch (e) {
      // Show error inline so user can see what went wrong
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'color:red;font-size:12px;margin:4px 0';
      errDiv.textContent = 'Chart error: ' + (e.message || e);
      pre.after(errDiv);
      console.warn('Mermaid render failed:', src.slice(0, 100), e);
    }
  }
  // Fallback: detect unfenced mermaid in plain text (model forgot code fences)
  const html = el.innerHTML;
  const mermaidInText = html.match(/(xychart\s+title\s+[^<]+(?:<br>.*?(?:bar|line)\s*\[[^\]]+\]))/s);
  if (mermaidInText) {
    // Extract the mermaid block from HTML, convert <br> back to newlines
    const raw = mermaidInText[1].replace(/<br\s*\/?>/g, '\n').replace(/<[^>]+>/g, '').trim();
    try {
      let src = raw;
      src = src.replace(/\btitie\b/g, 'title');
      src = src.replace(/(x-axis\s*\[)([^\]]+)\]/g, (m, prefix, inner) => {
        return prefix + inner.replace(/"\s+"/g, '", "').replace(/([a-zA-Z0-9°%)]+)\s+(?=")/g, '$1, ') + ']';
      });
      src = src.replace(/°/g, 'deg').replace(/\(([^)]*)\)/g, '$1');
      const id = 'mermaid-' + Math.random().toString(36).slice(2, 10);
      const { svg } = await window._mermaid.render(id, src);
      const div = document.createElement('div');
      div.className = 'mermaid-chart';
      div.innerHTML = svg;
      // Replace the text in innerHTML
      el.innerHTML = html.replace(mermaidInText[0], div.outerHTML);
    } catch (e) {
      console.warn('Mermaid inline fallback failed:', e);
    }
  }
}

// Wrap bare math expressions (e.g. 2^3, x^2) in $...$ so KaTeX renders them.
// Protects existing math zones and code blocks from double-wrapping.
function preprocessMath(text) {
  // Fix math delimiters split across lines — collapse all newlines inside math to spaces
  // Handles $$, \(, \[ with any amount of whitespace/newlines in content
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, function(_, expr) { return '$$' + expr.replace(/\s*\n\s*/g, ' ').trim() + '$$'; });
  text = text.replace(/\\\(([\s\S]+?)\\\)/g, function(_, expr) { return '\\(' + expr.replace(/\s*\n\s*/g, ' ').trim() + '\\)'; });
  text = text.replace(/\\\[([\s\S]+?)\\\]/g, function(_, expr) { return '\\[' + expr.replace(/\s*\n\s*/g, ' ').trim() + '\\]'; });
  // Fix JSON decoding artifact: \t (tab) from \times, \theta etc.
  text = text.replace(/\t/g, '\\t');
  const saved = [];
  text = text.replace(/```[\s\S]*?```|`[^`]+`|\$\$[\s\S]*?\$\$|\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g, function(m) {
    const idx = saved.length; saved.push(m); return '\x01M' + idx + '\x01';
  });
  // Convert $...$ → \(...\) when content looks like math
  // Matches: variables (x, y, n), expressions with operators, LaTeX commands
  text = text.replace(/\$([^$\n]+)\$/g, function(m, inner) {
    // Skip if it looks like currency: $20, $5.99, etc. (pure number, no LaTeX)
    if (/^\d/.test(inner.trim()) && !/[\\{^_]/.test(inner)) return m;
    // Convert if: has LaTeX chars, is a single letter (variable), or has math operators
    if (/[\\{^_]/.test(inner) || /^[a-zA-Z]$/.test(inner.trim()) || /[+\-=<>]/.test(inner)) {
      return '\\(' + inner + '\\)';
    }
    return m;
  });
  // Wrap math operators in \(...\).
  // Handles both bare ("times") and already-backslashed ("\times").
  // (?<!\w) avoids subwords like "dividend", "sometimes".
  // \\? optionally consumes an existing preceding backslash.
  // Uses string concat — NOT template literals — to avoid \t tab-escape ambiguity.
  text = text.replace(/(?<!\w)\\?(times|div|cdot|pm|leq|geq|neq|approx|infty|rightarrow|leftarrow|equiv|subset|mod)(?!\w)/g,
    function(m, cmd) { return '\\(' + '\\' + cmd + '\\)'; });
  // \cup and \cap only when preceded by backslash (avoid matching English words "cup", "cap")
  text = text.replace(/\\(cup|cap)(?!\w)/g,
    function(m, cmd) { return '\\(' + '\\' + cmd + '\\)'; });
  // Wrap bare exponents: 2^3 → \(2^3\)
  text = text.replace(/([a-zA-Z]?[0-9]+|[a-zA-Z])\^(\{[^}]+\}|[0-9]+[a-zA-Z]?|[a-zA-Z])/g,
    function(m) { return '\\(' + m + '\\)'; });
  // Restore protected zones
  text = text.replace(/\x01M(\d+)\x01/g, function(_, i) { return saved[i]; });
  return text;
}

function renderMarkdown(text) {
  // Escape HTML
  const esc = (s) => s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Extract unfenced SVG blocks BEFORE HTML escaping (model may omit ```svg fences)
  const svgBlocks = [];
  text = text.replace(/<svg[\s\S]*?<\/svg>/gi, (svg) => {
    const idx = svgBlocks.length;
    svgBlocks.push(`<div class="svg-diagram">${svg.trim()}</div>`);
    return `\x00SVG${idx}\x00`;
  });

  // Process code blocks first (triple backtick) — preserve language class for mermaid etc.
  const codeBlocks = [];
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    if (lang === 'svg') {
      // SVG blocks rendered directly (geometry diagrams) — inject raw SVG
      codeBlocks.push(`<div class="svg-diagram">${code.trim()}</div>`);
    } else {
      const cls = lang ? ` class="language-${lang}"` : '';
      codeBlocks.push(`<pre><code${cls}>${esc(code.trim())}</code></pre>`);
    }
    return `\x00CODE${idx}\x00`;
  });

  // Inline code
  text = text.replace(/`([^`]+)`/g, (_, code) => `<code>${esc(code)}</code>`);

  // Protect all $$...$$ math blocks from markdown processing
  const mathBlocks = [];
  text = text.replace(/\$\$[\s\S]*?\$\$/g, (m) => {
    const idx = mathBlocks.length; mathBlocks.push(m); return `\x00MATH${idx}\x00`;
  });

  // Pre-process: force newline before pipe-table header that's inline with text
  text = text.replace(/([^\n|])([ \t]*\|[^|\n]+\|)/g, '$1\n$2');
  // Split concatenated pipe-table rows onto separate lines.
  // Detect: a line starting with | that has more pipes than a single row should.
  // Strategy: find the first row (header), count its columns, then split remaining content.
  text = text.split('\n').map(line => {
    const trimmed = line.trim();
    if (!trimmed.startsWith('|') || !trimmed.endsWith('|')) return line;
    const parts = trimmed.split('|').filter(s => s !== undefined);
    // parts includes empty strings at start/end from leading/trailing |
    // A single row "| a | b | c |" has parts: ["", " a ", " b ", " c ", ""]
    // Two concatenated "| a | b | | c | d |" has more parts with an empty one in the middle
    // Look for empty-or-whitespace parts in the middle — those are row boundaries
    const cells = parts.slice(1, -1); // remove leading/trailing empties
    const emptyIdx = [];
    cells.forEach((c, i) => { if (c.trim() === '') emptyIdx.push(i); });
    if (emptyIdx.length === 0) return line;
    // Split at empty cell positions — these are the "| |" row boundaries
    let rows = [];
    let start = 0;
    for (const idx of emptyIdx) {
      const rowCells = cells.slice(start, idx);
      if (rowCells.length > 0) rows.push('| ' + rowCells.join('|') + ' |');
      start = idx + 1;
    }
    // Remaining cells after last split
    const remaining = cells.slice(start);
    if (remaining.length > 0) rows.push('| ' + remaining.join('|') + ' |');
    return rows.length > 1 ? rows.join('\n') : line;
  }).join('\n');

  // Pre-process: convert hybrid tables (pipe header + tab-separated body) into full pipe tables
  text = text.replace(/(^\|.+\|[ \t]*$\n)((?:^[^\n|]*\t[^\n]*$\n?)+)/gm, (m, header, body) => {
    const bodyLines = body.trim().split('\n').map(line => {
      const cells = line.split('\t').map(c => c.trim());
      return '| ' + cells.join(' | ') + ' |';
    });
    return header + bodyLines.join('\n') + '\n';
  });

  // Markdown pipe tables  ( | col | col | ) — extract BEFORE bold/italic
  // Tolerates blank lines between header/separator/body rows
  const tablePlaceholders = [];
  text = text.replace(/(^[ \t]*\|.+\|[ \t]*$(?:\n(?:[ \t]*\|.+\|[ \t]*$|[ \t]*$))*)/gm, (block) => {
    const rows = block.trim().split('\n').map(r => r.trim()).filter(r => r && r.includes('|'));
    // Need at least a header + one data row
    // Filter separator rows: lines containing only |, -, :, and whitespace
    const dataRows = rows.filter(r => !/^[|\s:\-]+$/.test(r));
    if (dataRows.length < 2) return block;
    let html = '<table>';
    dataRows.forEach((row, i) => {
      const cells = row.split('|').slice(1, -1);
      if (cells.length === 0) return;
      const tag = i === 0 ? 'th' : 'td';
      html += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
    });
    html += '</table>';
    const idx = tablePlaceholders.length;
    tablePlaceholders.push(html);
    return `\x00TBL${idx}\x00`;
  });

  // Space-aligned text tables — 2+ consecutive lines with internal multi-space alignment → monospace
  text = text.replace(/((?:^.{10,}  .+$\n?){2,})/gm, (block) => {
    if (block.includes('\x00TBL') || block.includes('<pre>')) return block;
    const lines = block.trim().split('\n');
    const aligned = lines.filter(l => /\S {2,}\S/.test(l));
    if (aligned.length >= 2 && aligned.length >= lines.length * 0.5) {
      const idx = tablePlaceholders.length;
      tablePlaceholders.push('<pre>' + esc(block.trim()) + '</pre>');
      return `\x00TBL${idx}\x00`;
    }
    return block;
  });

  // Bold and italic
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
  text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
  text = text.replace(/_([^_]+)_/g, '<em>$1</em>');

  // Headings
  text = text.replace(/^### (.+)$/gm, '<strong>$1</strong>');
  text = text.replace(/^## (.+)$/gm, '<strong>$1</strong>');
  text = text.replace(/^# (.+)$/gm, '<strong>$1</strong>');

  // Ordered lists — ensure paragraph break before numbered items, then bold the number
  // Force double newline before any "N. " that follows text (handles \n, space, or no separator)
  text = text.replace(/(\S[^\n]*)\n(1\. )/g, '$1\n\n$2');
  text = text.replace(/(\S) +(1\. )/g, '$1\n\n$2');
  text = text.replace(/^(\d+)\. (.+)$/gm, '<strong>$1.</strong> $2');

  // Collapse ALL double newlines between consecutive answer choices (repeat until stable)
  let prev;
  do {
    prev = text;
    text = text.replace(/([A-D][):.]\s[^\n]*)\n\n([A-D][):.]\s)/g, '$1\n$2');
  } while (text !== prev);

  // Unordered lists
  text = text.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');

  // Paragraphs: double newline
  const paras = text.split(/\n{2,}/);
  text = paras.map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<ul>') || p.startsWith('\x00TBL') || p.startsWith('<pre>') || p.startsWith('\x00CODE')) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');

  // Restore code blocks — convert table-like code blocks to styled <table>
  text = text.replace(/\x00CODE(\d+)\x00/g, (_, i) => {
    const block = codeBlocks[parseInt(i)];
    // Skip mermaid and SVG blocks
    if (block.includes('language-mermaid') || block.includes('svg-diagram')) return block;
    const codeMatch = block.match(/<pre><code[^>]*>([\s\S]*?)<\/code><\/pre>/);
    if (codeMatch) {
      const raw = codeMatch[1].replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
      const lines = raw.split('\n').filter(l => l.trim());
      if (lines.length < 2) return block;

      // Detect format: pipe-separated or space-aligned
      const pipeLines = lines.filter(l => l.includes('|'));
      const isPipeTable = pipeLines.length >= lines.length * 0.5;
      const aligned = lines.filter(l => /\S {2,}\S/.test(l));
      const isSpaceAligned = aligned.length >= lines.length * 0.5;

      if (isPipeTable) {
        // Pipe-separated: split on | and build table
        // Filter out separator rows (---|---)
        const dataLines = lines.filter(l => !/^[|\s:\-]+$/.test(l));
        if (dataLines.length < 2) return block;
        let html = '<table>';
        dataLines.forEach((line, i) => {
          // Split on | and trim — handle both "| a | b |" and "a | b" formats
          let cells = line.split('|').map(c => c.trim()).filter(c => c !== '');
          const tag = i === 0 ? 'th' : 'td';
          html += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
        });
        html += '</table>';
        return html;
      } else if (isSpaceAligned) {
        // Space-aligned: split on 2+ spaces, filter separator rows
        const dataLines = lines.filter(l => !/^[\s\-_=]+$/.test(l));
        if (dataLines.length < 2) return block;
        let html = '<table>';
        dataLines.forEach((line, i) => {
          const cells = line.split(/  {1,}/).filter(c => c.trim());
          const tag = i === 0 ? 'th' : 'td';
          html += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
        });
        html += '</table>';
        return html;
      }
    }
    return block;
  });
  text = text.replace(/\x00TBL(\d+)\x00/g, (_, i) => '</p>' + tablePlaceholders[parseInt(i)] + '<p>');
  text = text.replace(/\x00MATH(\d+)\x00/g, (_, i) => mathBlocks[parseInt(i)]);
  text = text.replace(/\x00SVG(\d+)\x00/g, (_, i) => svgBlocks[parseInt(i)]);

  // Answer choice formatting is handled post-render in fixAnswerChoices()

  return text;
}

function exitEmptyMode() {
  if (!document.body.classList.contains('empty-mode')) return;
  document.body.classList.remove('empty-mode');
  emptyState.classList.add('hidden');
}

function addMessage(role, text, streaming = false) {
  exitEmptyMode();
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'Assistant';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (streaming) bubble.classList.add('streaming-cursor');

  if (role === 'user') {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = renderMarkdown(text);
    fixAnswerChoices(bubble);
    renderMath(bubble);
  }

  row.appendChild(label);
  row.appendChild(bubble);
  chatMessages.appendChild(row);
  scrollToBottom();
  return bubble;
}

  chatMessages.innerHTML = '';
  document.body.classList.add('empty-mode');

}

  dbList.innerHTML = '';
  knownDbs.forEach(name => {
    const row = document.createElement('div');
    row.className = 'db-row' + (name === currentDb ? ' active' : '');
    row.dataset.db = name;

    row.appendChild(icon);

      const trash = document.createElement('button');
      trash.className = 'db-trash';
      trash.title = 'Delete chat';
      trash.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

}

// ── API helpers ───────────────────────────────────────────────
// runCommand: submit a command and return the full streamed text response.
// Uses a unique per-call client_id so it never collides with the main chat stream.
// Uses fetch-based SSE reading instead of EventSource — EventSource auto-reconnects
// after the server closes the connection (which it does after sending 'done'), causing
// a spurious onerror that races with the message handler. fetch reads until EOF cleanly.
async function runCommand(cmd, timeoutMs = 15000) {
  const id = SESSION_ID + '-cmd-' + Date.now().toString(36);
  await fetch('/api/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: cmd, client_id: id }),
  });

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  let reader = null;
  try {
    const resp = await fetch(
      `/api/stream/${encodeURIComponent(id)}?token=${encodeURIComponent(_apiKey)}`,
      { signal: ctrl.signal }
    );
    reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        let msg; try { msg = JSON.parse(line.slice(5).trim()); } catch (_) { continue; }
        if (msg.type === 'tok' || msg.type === 'flush') full += (msg.text || '');
        else if (msg.type === 'done') { clearTimeout(timer); reader.cancel(); return full; }
        else if (msg.type === 'error') throw new Error(msg.message || 'stream error');
      }
    }
    return full;
  } finally {
    clearTimeout(timer);
    if (reader) try { reader.cancel(); } catch (_) {}
  }
}

// ── Model list ────────────────────────────────────────────────
// Parse !model output:
//   Available models:
//     key          model_id (current)
//     key2         model_id2
//     key3         model_id3  [disabled]
function parseModelList(text) {
  const models = [];
  let current = null;
  for (const line of text.split('\n')) {
    // Match lines like "  key   model_id (current)" or "  key   model_id  [disabled]"
    const m = line.match(/^\s+([a-zA-Z0-9_\-\.]+)\s+(\S.*?)(\s+\(current\))?(\s+\[disabled\])?\s*$/);
    if (!m) continue;
    const key     = m[1];
    const label   = m[2].trim();
    const isCur   = !!m[3];
    const disabled = !!m[4];
    if (disabled) continue;  // skip disabled models
    models.push({ key, label });
    if (isCur) current = key;
  }
  return { models, current };
}

let currentModel = 'default-chat';

async function loadModelList() {
  try {
    // Use throwaway session for the list — model list is global.
    // currentModel is already set by switchSessionModel; pre-select it in the dropdown.
    const text = await runCommand('!model');
    const { models } = parseModelList(text);
    modelSelect.innerHTML = '';
    if (models.length === 0) {
      modelSelect.innerHTML = '<option value="">No models</option>';
      return;
    }
    for (const { key } of models) {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = key;
      if (key === currentModel) opt.selected = true;
      modelSelect.appendChild(opt);
    }
  } catch (e) {
    modelSelect.innerHTML = '<option value="">Error</option>';
  }
}

// ── Memory display ────────────────────────────────────────────
// Strip llmem-gw metadata from !memory list output:
//   [ N] imp=X [tag] content       → show content
//   [content] imp= []              → show content
//   [content] imp=session [N] role → show content
// Skips header/footer lines.
// Known LaTeX commands that may be stored without backslash
const _LATEX_CMDS = 'frac|sqrt|sum|int|prod|lim|sin|cos|tan|log|ln|exp|binom|cdot|times|pm|pi|alpha|beta|gamma|delta|theta|sigma|omega|mu|lambda|epsilon|phi|infty|partial|hat|bar|vec|overline|underline|text|mathrm|mathbf';
const _LATEX_RE = new RegExp(`(?<!\\\\)\\b(${_LATEX_CMDS})\\b(?=\\s*[_{])`, 'g');

// Strip leading [ (and trailing ] if fully wrapped) from a content string.
// Preserves real markdown links which always contain ]( somewhere.
function _stripBrackets(s) {
  if (!s.startsWith('[')) return s;
  if (s.includes('](')) return s;      // looks like [text](url) — keep
  s = s.slice(1);                       // strip leading [
  if (s.endsWith(']')) s = s.slice(0, -1); // strip trailing ] if fully wrapped
  return s;
}

// Apply LaTeX/math post-processing to assistant content
function _processAssistantContent(text) {
  text = text.replace(/\t/g, '\\t');
  text = text.replace(_LATEX_RE, '\\$1');
  text = text.replace(/(?<!\\[\(\[])\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '\\(\\frac{$1}{$2}\\)');
  text = text.replace(/(?<!\\[\(\[])\\sqrt\{([^{}]*)\}/g, '\\(\\sqrt{$1}\\)');
  text = text.replace(/(?<!\\[\(\[])\\binom\{([^{}]*)\}\{([^{}]*)\}/g, '\\(\\binom{$1}{$2}\\)');
  return preprocessMath(text);
}

// Parse pipe-delimited !db_query output into [{source, content}]
// Format: "id | source | content\n---+--------+-------\n1 | user | hello\n..."
// Content may contain embedded newlines — use id column as row anchor.
function parseDbQueryRows(text) {
  var rows = [];
  var lines = text.split('\n');
  // Find separator line (---+---+---)
  var dataStart = -1;
  for (var i = 0; i < lines.length; i++) {
    if (/^-+\+-/.test(lines[i].trim())) { dataStart = i + 1; break; }
  }
  if (dataStart < 0) return rows;

  // Each data row starts with "id | source | content"
  var current = null;
  for (var i = dataStart; i < lines.length; i++) {
    var line = lines[i];
    // Row anchor: starts with digits (id column) then " | "
    var m = line.match(/^\d+\s*\|\s*(user|session|assistant|directive)\s*\|\s*(.*)/);
    if (m) {
      if (current) rows.push(current);
      current = { source: m[1].trim(), content: m[2].trimEnd() };
    } else if (current && line.trim()) {
      // Continuation of previous row's content (embedded newline)
      current.content += '\n' + line;
    }
  }
  if (current) rows.push(current);
  return rows;
}

// Render parsed memory rows into the chat window
function _renderMemoryRows(rows) {
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var text = row.content.replace(/\n{3,}/g, '\n\n').trim();
    if (!text) continue;

    if (row.source === 'user') {
      addMessage('user', text);
    } else if (row.source === 'session' || row.source === 'assistant') {
      var bubble = addMessage('assistant', '');
      // In claude mode, skip grok math preprocessing — Claude uses clean $$ delimiters
      var processed = claudeMode ? text : _processAssistantContent(text);
      bubble.innerHTML = renderMarkdown(processed);
      fixAnswerChoices(bubble);
      renderMath(bubble);
      renderMermaid(bubble);
    }
    // Skip directive entries
  }
}

// Load a single memory table and render its rows; returns row count rendered
async function _loadMemoryTable(dbName, suffix) {
  var table = '`' + dbName + '`.`' + dbName + '_memory_' + suffix + '`';
  var sql = 'SELECT id, source, content FROM ' + table + ' ORDER BY id ASC';
  console.log('[memory] querying', suffix, ':', sql);
  var result = await runOnSession('!db_query ' + sql);
  console.log('[memory]', suffix, 'result length:', result ? result.length : 0,
    'preview:', result ? result.slice(0, 120) : '(empty)');
  if (!result || result.trim() === '(no rows)') return 0;

  var rows = parseDbQueryRows(result);
  if (!rows.length) return 0;

  addMemorySeparator();
  _renderMemoryRows(rows);
  return rows.length;
}

// Load and display long-term memory as individual chat turns
async function loadLongTermMemory(dbName) {
  if (!dbName) return;
  try { await _loadMemoryTable(dbName, 'longterm'); } catch (e) { console.warn('[memory] longterm failed:', e); }
}

// Load and display short-term memory as individual chat turns
async function loadMemoryTurns(dbName) {
  if (!dbName) return;
  await _loadMemoryTable(dbName, 'shortterm');
}

// ── DB management ─────────────────────────────────────────────
// Parse `!db sessions` output:
//   User-created databases (N)  [...]:
//     name  tables=N  created=TIMESTAMP  (current)
// Also handles "No user-created databases" → empty list.
function parseSessionsList(text) {
  const names = [];
  let current = null;
  for (const line of text.split('\n')) {
    // Match lines like "  leegeneral  tables=19  created=2026-03-15T01:36:12Z  (current)"
    const m = line.match(/^\s+([a-zA-Z0-9_]+)\s+tables=/);
    if (!m) continue;
    const name = m[1];
    names.push(name);
    if (/\(current\)/.test(line)) current = name;
  }
  return { names, current };
}

async function loadDbList() {
  setStatus('Loading chats…');
  try {
    const text = await runCommand('!db sessions');
    const { names } = parseSessionsList(text);
    // Don't trust the throwaway session's (current) — only track currentDb via runOnSession calls
    knownDbs = names;
    updateDbLabel();
    renderDbList();
    setStatus('');
  } catch (e) {
    setStatus('Failed to load chats');
    console.error('loadDbList:', e);
  }
}

async function switchToDb(name) {
  if (name === currentDb && knownDbs.includes(name)) {
    // Already here — just reload memory
  } else {
    setStatus(`Switching to ${name}…`);
    try {
      await runOnSession(`!db switch ${name}`);
    } catch (e) {
      setStatus('Switch failed');
      return;
    }
    currentDb = name;
    if (!knownDbs.includes(name)) knownDbs.push(name);
    updateDbLabel();
    renderDbList();
  }

  // Load memory for this db (long-term first, then short-term, oldest to newest)
  clearChat();
  setStatus(`Loading history…`);
  try {
    await loadLongTermMemory(currentDb);
    await loadMemoryTurns(currentDb);
    setStatus('');
  } catch (e) {
    setStatus('');
  }

  // Close sidebar on mobile after switching
  if (window.innerWidth <= 600) closeSidebar();
}

async function createNewChat() {
  // Prompt user for a chat name (lowercase letters, digits, underscores)
  const raw = prompt('Chat name (lowercase letters, digits, underscores):');
  if (!raw) return;
  const name = raw.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
  if (!name || !/^[a-z]/.test(name)) {
    alert('Name must start with a letter and contain only lowercase letters, digits, or underscores.');
    return;
  }
  setStatus(`Creating ${name}…`);
  try {
    await runOnSession(`!db switch ${name}`);
    currentDb = name;
    if (!knownDbs.includes(name)) knownDbs.unshift(name);
    updateDbLabel();
    renderDbList();
    clearChat();
    setStatus('New chat ready');
    setTimeout(() => setStatus(''), 2000);
  } catch (e) {
    setStatus('Failed to create chat');
  }
}

async function deleteDb(name) {
  setStatus(`Deleting ${name}…`);
  try {
    await runOnSession(`!db delete ${name} confirm`);
    knownDbs = knownDbs.filter(d => d !== name);
    if (currentDb === name) {
      // Switch to first available
      if (knownDbs.length) {
        await switchToDb(knownDbs[0]);
      } else {
        clearChat();
        currentDb = null;
        updateDbLabel();
      }
    }
    renderDbList();
    setStatus('');
  } catch (e) {
    setStatus('Delete failed');
  }
}

// ── Submit / stream ───────────────────────────────────────────
function ttsClean(t) {
  return t
    .replace(/<<[^>]*>>\s*(?::\s*)?/g, '')
    .replace(/\[thinking[^\]]*\]/gi, '')
    .replace(/\[[^\]]*[▶◀][^\]]*\]/g, '')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*/g, '').replace(/\*/g, '').replace(/_/g, '')
    .replace(/~~(.+?)~~/g, '$1')
    .replace(/`{3}[\s\S]*?`{3}/g, '').replace(/`([^`]*)`/g, '$1')
    .replace(/'''[\s\S]*?'''/g, '')
    .replace(/^[-*_]{3,}$/gm, '').replace(/[-*_]{3,}/g, ', ')
    .replace(/^[\*\-]\s+/gm, '').replace(/^\d+\.\s+/gm, '')
    .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
    .replace(/\|/g, ' ')
    .replace(/\\/g, '')
    .replace(/—|–/g, ', ')
    .replace(/…/g, '...')
    .replace(/[""]/g, '"').replace(/['']/g, "'")
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&[a-z]+;/g, '')
    .replace(/<[^>]+>/g, '')
    .replace(/[^\x00-\x7F]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

async function submitText(text) {
  if (!text.trim() || isStreaming) return;

  // Claude mode — route through relay instead of LLM pipeline
  if (claudeMode) { claudeSubmit(text); return; }

  // Close any existing stream
  if (activeEvtSource) { activeEvtSource.close(); activeEvtSource = null; }
  isStreaming = true;
  sendBtn.disabled = true;
  setStatus('Thinking…');

  addMessage('user', text);

  // Quiz answer disambiguation: when user sends a single letter (a-d) and the
  // last assistant message contained answer choices, prepend the question so the
  // LLM grades against the correct (most recent) question — not an older one
  // that drifted into context.
  let sendText = text;
  const trimmed = text.trim().toLowerCase();
  if (/^[a-d]$/.test(trimmed) && currentAsstText && /[A-D]\)\s/.test(currentAsstText)) {
    sendText = currentAsstText.trim() + '\n\nWhat is your answer?\n' + text.trim();
  }

  // Start assistant bubble
  currentAsstText = '';
  currentAsst = addMessage('assistant', '', true);

  try {
    await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text: sendText, client_id: SESSION_ID }),
    });
  } catch (e) {
    currentAsst.classList.remove('streaming-cursor');
    currentAsst.textContent = '[Error submitting: ' + e.message + ']';
    finishStream();
    return;
  }

  const mySessionId = SESSION_ID;
  const es = new EventSource(`/api/stream/${encodeURIComponent(SESSION_ID)}?token=${encodeURIComponent(_apiKey)}`);
  activeEvtSource = es;

  // samaritan.py wraps all SSE as plain `data:` (no event: line) → all arrive as 'message'.
  // Payload is JSON: {"type": "tok"|"flush"|"done"|"error"|"vtok", ...}
  es.onmessage = (e) => {
    if (SESSION_ID !== mySessionId) { es.close(); activeEvtSource = null; return; }
    let msg; try { msg = JSON.parse(e.data); } catch (_) { return; }
    if (msg.type === 'tok' || msg.type === 'flush') {
      currentAsstText += (msg.text || '');
      const _dispText = currentAsstText.replace(/<<[^>]*>>\s*(?::\s*)?/g, '');
      currentAsst.innerHTML = renderMarkdown(preprocessMath(_dispText));
      scrollToBottom();
    } else if (msg.type === 'done') {
      es.close();
      activeEvtSource = null;
      currentAsst.classList.remove('streaming-cursor');
      const _finalText = currentAsstText.replace(/<<[^>]*>>\s*(?::\s*)?/g, '');
      currentAsst.innerHTML = renderMarkdown(preprocessMath(_finalText));
      renderMath(currentAsst);
      renderMermaid(currentAsst);
      scrollToBottom();
      if (ttsEnabled && currentAsstText.trim()) {
        speakInworld(ttsClean(currentAsstText));
      }
      finishStream();
    } else if (msg.type === 'error') {
      es.close();
      activeEvtSource = null;
      currentAsst.classList.remove('streaming-cursor');
      if (!currentAsstText) currentAsst.textContent = '[Error: ' + (msg.message || 'stream error') + ']';
      finishStream();
    }
  };

  es.onerror = () => {
    es.close();
    activeEvtSource = null;
    currentAsst.classList.remove('streaming-cursor');
    if (!currentAsstText) currentAsst.textContent = '[Connection error]';
    finishStream();
  };
}

function finishStream() {
  isStreaming = false;
  sendBtn.disabled = false;
  setStatus('');
  currentAsst = null;
}

// ── Send button / Enter key ───────────────────────────────────
// Run a command on SESSION_ID (so it persists in the main chat session) and
// return the full streamed text. Used for !db switch, !model, !memory list, etc.
// IMPORTANT: always cancel the reader on done/error/abort so the HTTP connection
// closes immediately — a lingering reader blocks the next runOnSession call since
// both would share the same SESSION_ID queue in llmem-gw.
async function runOnSession(cmd, timeoutMs = 15000) {
  await fetch('/api/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: cmd, client_id: SESSION_ID }),
  });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  let reader = null;
  try {
    const resp = await fetch(
      `/api/stream/${encodeURIComponent(SESSION_ID)}?token=${encodeURIComponent(_apiKey)}`,
      { signal: ctrl.signal }
    );
    reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        let msg; try { msg = JSON.parse(line.slice(5).trim()); } catch (_) { continue; }
        if (msg.type === 'tok' || msg.type === 'flush') full += (msg.text || '');
        else if (msg.type === 'done') { clearTimeout(timer); reader.cancel(); return full; }
      }
    }
    return full;
  } finally {
    clearTimeout(timer);
    if (reader) try { reader.cancel(); } catch (_) {}
  }
}

async function switchSessionModel(model) {
  try { await runOnSession(`!model ${model} database=target`); currentModel = model; _updateGedActiveRow(); } catch (_) {}

function _gedBar(score, width = 10) {
  const filled = Math.round(score * width);
  return '\u2588'.repeat(filled) + '\u2591'.repeat(width - filled);
}

function _gedLabel(score) {
  if (score >= 0.75) return '\u2713 Strong';
  if (score >= 0.5)  return '\u2192 Building';
  return '\u2717 Focus area';
}

// Parse !db_query tabular output into array of objects
function _parseDbQueryRows(text) {
  const lines = text.trim().split('\n').filter(l => l.trim() && !/^[\-+|]+$/.test(l.trim()));
  if (lines.length < 2) return [];
  // First non-separator line is header
  const headers = lines[0].split('|').map(h => h.trim()).filter(Boolean);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split('|').map(c => c.trim()).filter(Boolean);
    if (cols.length < headers.length) continue;
    const row = {};
    headers.forEach((h, j) => { row[h] = cols[j]; });
    rows.push(row);
  }
  return rows;
}

async function _gedQueryScores(dbName) {
  const tbl = dbName + '_ged_topic_scores';
  const raw = await runOnSession(`!db_query SELECT topic, score, attempts, correct FROM ${tbl} ORDER BY score ASC`);
  if (raw.includes('(no rows)') || raw.includes('ERROR')) return [];
  return _parseDbQueryRows(raw);
}

    scrollToBottom();
    setStatus('');

  }

  for (const r of rows) {

  // !reset in claude mode — run llmem-gw reset (summarize+clear ST), then fresh start
  if (claudeMode && text === '!reset') {
    textInput.value = '';
    autoResize(textInput);

      chatMessages.innerHTML = '';
      setStatus('');
      claudeSubmit('The user has reset the session. Start fresh — greet Lee and ask what she wants to work on.');
    });
    return;
  }
  // Intercept #ged commands — client-side progress dashboards
  if (text === '#ged' || text.startsWith('#ged ')) {
    textInput.value = '';
    autoResize(textInput);
    _handleGedCommand(text.slice(4).trim().toLowerCase());
    return;
  }
  // Intercept #mode commands — don't send to LLM
  if (text.startsWith('#mode ')) {
    textInput.value = '';
    autoResize(textInput);
    const mode = text.slice(6).trim().toLowerCase();
    if (mode === 'default' || mode === 'cognitive') {
      setStatus('Switching mode…');
      switchSessionModel('samaritan-voice').finally(() => {
        window.location.href = '/';

    } else if (mode === 'chat') {
      setStatus('Switching to Chat mode…');
      window.location.href = '/chat';
    } else {
      setStatus('Unknown mode: ' + mode);
      setTimeout(() => setStatus(''), 2000);
    }
    return;
  }
  textInput.value = '';
  autoResize(textInput);
  submitText(text);
}

let _typo = null;
(async () => {
  try {
    const base = 'https://cdn.jsdelivr.net/npm/typo-js@1.2.4/dictionaries/en_US/en_US';
    const [affResp, dicResp] = await Promise.all([fetch(base + '.aff'), fetch(base + '.dic')]);
    const [affData, dicData] = await Promise.all([affResp.text(), dicResp.text()]);
    _typo = new Typo('en_US', affData, dicData, { platform: 'any' });
  } catch (e) { console.warn('[autocorrect] dict load failed:', e); }
})();

textInput.addEventListener('keydown', (e) => {
  if (!_typo || !' .,?!;:'.includes(e.key)) return;
  const pos = textInput.selectionStart;
  const before = textInput.value.slice(0, pos);
  const wordMatch = before.match(/([a-zA-Z]{2,})$/);
  if (!wordMatch) return;
  const word = wordMatch[1];
  if (_typo.check(word)) return;
  const suggestions = _typo.suggest(word);
  if (!suggestions.length) return;
  const raw = suggestions[0];
  const corrected = /^[A-Z]/.test(word) ? raw.charAt(0).toUpperCase() + raw.slice(1) : raw;
  const newBefore = before.slice(0, before.length - word.length) + corrected;
  textInput.value = newBefore + textInput.value.slice(pos);
  textInput.selectionStart = textInput.selectionEnd = newBefore.length;
  autoResize(textInput);
});

function autoResize(el) {
  el.style.height = 'auto';
  const maxH = 6 * 1.5 * 15;
  el.style.height = Math.min(el.scrollHeight, maxH) + 'px';
}

// ── Audio / TTS ───────────────────────────────────────────────
let audioCtx = null;
let nextPlayAt = 0;
const activeSrcs = new Set();

function initAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

function pcmBytesToAudioBuf(bytes, sampleRate) {
  const samples = bytes.length / 2;
  const buf = audioCtx.createBuffer(1, samples, sampleRate);
  const data = buf.getChannelData(0);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  for (let i = 0; i < samples; i++) {
    data[i] = view.getInt16(i * 2, true) / 32768;
  }
  return buf;
}

function scheduleAudioChunk(audioBuf) {
  if (!audioCtx) return 0;
  const now = audioCtx.currentTime;
  const startAt = Math.max(now, nextPlayAt);
  const src = audioCtx.createBufferSource();
  src.buffer = audioBuf;
  src.connect(audioCtx.destination);
  src.start(startAt);
  nextPlayAt = startAt + audioBuf.duration;
  activeSrcs.add(src);
  src.onended = () => activeSrcs.delete(src);
  return (startAt + audioBuf.duration - now) * 1000;
}

function stopAllAudio() {
  nextPlayAt = 0;
  activeSrcs.forEach(s => { try { s.stop(); } catch (_) {} });
  activeSrcs.clear();
}

let _inworldAbort = null;
function speakInworld(text) {
  if (_inworldAbort) { _inworldAbort.abort(); _inworldAbort = null; }
  stopAllAudio();
  initAudioCtx();
  const ctrl = new AbortController();
  _inworldAbort = ctrl;
  const WAV_HEADER = 44;

  (async () => {
    let resp;
    try {
      resp = await fetch('/api/tts/inworld', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ text, model_id: 'inworld-tts-1.5-mini' }),
        signal: ctrl.signal,
      });
    } catch (e) {
      if (e.name !== 'AbortError') setStatus('TTS error');
      return;
    }
    if (!resp.ok) { setStatus('TTS error ' + resp.status); return; }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    const scheduleWav = (b64) => {
      const bin = atob(b64);
      if (bin.length <= WAV_HEADER) return;
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      scheduleAudioChunk(pcmBytesToAudioBuf(bytes.subarray(WAV_HEADER), 24000));
    };

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          const t = line.trim();
          if (!t) continue;
          try {
            const chunk = JSON.parse(t);
            const b64 = chunk.result?.audioContent || chunk.audioContent;
            if (b64) scheduleWav(b64);
          } catch (_) {}
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') setStatus('TTS stream error');
    }
  })();
}
